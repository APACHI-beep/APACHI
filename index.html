<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ایران وار | بازی متنی</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, sans-serif;
    background: radial-gradient(circle at center, #1e293b, #0f172a);
    color: #eee;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
  }
  .screen { display: none; width: 100%; max-width: 500px; height: 90vh; display: flex; flex-direction: column; }
  .screen.active { display: flex; animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* صفحه ورود */
  .welcome-box {
    background: rgba(30, 41, 59, 0.8);
    padding: 40px 20px;
    border-radius: 20px;
    border: 1px solid #334155;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    text-align: center;
    margin: auto;
    width: 100%;
  }
  .welcome-title { font-size: 2em; font-weight: bold; color: #facc15; margin-bottom: 15px; text-shadow: 0 0 20px rgba(250, 204, 21, 0.5); }
  .welcome-sub { color: #94a3b8; margin-bottom: 25px; }
  .name-input {
    width: 100%; padding: 15px; font-size: 1.1em; border-radius: 12px; border: 2px solid #334155;
    background: #0f172a; color: #fff; text-align: center; outline: none; transition: 0.3s;
  }
  .name-input:focus { border-color: #facc15; box-shadow: 0 0 10px rgba(250, 204, 21, 0.2); }
  .btn-main {
    width: 100%; padding: 15px; font-size: 1.1em; border: none; border-radius: 12px;
    background: #facc15; color: #0f172a; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.2s;
  }
  .btn-main:active { transform: scale(0.98); }

  /* تبریک */
  .congrats { text-align: center; font-size: 1.4em; color: #4ade80; background: rgba(20, 41, 29, 0.8); padding: 40px 20px; border-radius: 20px; margin: auto; width: 100%; border: 1px solid #22c55e; }

  /* چت */
  .chat-container {
    background: #0f172a; border-radius: 20px; border: 1px solid #334155; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 100%;
  }
  .chat-header {
    display: flex; align-items: center; justify-content: space-between; background: #1e293b; padding: 15px; border-bottom: 1px solid #334155;
  }
  .chat-header .title { font-weight: bold; color: #facc15; font-size: 1.1em;}
  .back-btn { background: none; border: none; color: #facc15; font-size: 1.4em; cursor: pointer; }
  .chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 0.95em; line-height: 1.5; word-wrap: break-word; }
  .msg.bot { background: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-right-radius: 4px; }
  .msg.user { background: #facc15; color: #0f172a; align-self: flex-end; border-bottom-left-radius: 4px; font-weight: bold; }
  .chat-input-row { display: flex; gap: 10px; padding: 15px; background: #1e293b; border-top: 1px solid #334155; }
  .chat-input-row input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
  .chat-input-row button { padding: 0 20px; background: #facc15; color: #0f172a; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

  /* لیست کشورها */
  .countries-list { flex: 1; overflow-y: auto; padding: 10px; background: #0f172a; border-radius: 20px; border: 1px solid #334155; }
  .country-item { background: #1e293b; padding: 12px 15px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; border: 1px solid #334155; }
  .country-item.taken { border-color: #22c55e; background: rgba(20, 41, 29, 0.5); }
  .check { color: #22c55e; font-weight: bold; }

  /* منوی پایین */
  .bottom-menu {
    display: flex; justify-content: space-around; gap: 8px; margin-top: auto; padding-top: 20px; width: 100%;
  }
  .menu-btn {
    flex: 1; padding: 10px 5px; font-size: 0.85em; border: 1px solid #facc15; border-radius: 10px;
    background: #1e293b; color: #facc15; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: center;
  }
  .menu-btn:hover { background: #facc15; color: #0f172a; }
</style>
</head>
<body>

<!-- صفحه ۱: ورود -->
<div id="screen-welcome" class="screen active">
  <div class="welcome-box">
    <div class="welcome-title">به ایران وار خوش آمدید!</div>
    <div class="welcome-sub">لطفاً اسم خود را وارد کنید</div>
    <input id="nameInput" class="name-input" type="text" placeholder="نام شما..." autocomplete="off" onkeydown="if(event.key==='Enter') submitName()">
    <button class="btn-main" onclick="submitName()">تایید</button>
  </div>
</div>

<!-- صفحه ۲: تبریک -->
<div id="screen-congrats" class="screen">
  <div class="congrats" id="congratsText" style="margin: auto;"></div>
</div>

<!-- صفحه ۳: منوی اصلی -->
<div id="screen-menu" class="screen">
  <div style="flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column;">
    <h2 style="color:#facc15; font-size:1.8em; text-align:center; margin-bottom:10px;">منوی اصلی</h2>
    <p style="color:#94a3b8; text-align:center;">یک گزینه را از پایین انتخاب کنید</p>
  </div>
  <div class="bottom-menu">
    <button class="menu-btn" onclick="openChat('country')">🧑‍💻 بات کشور گیری</button>
    <button class="menu-btn" onclick="openCountries()">🌍 کشورها</button>
    <button class="menu-btn" onclick="openChat('equipment')">🚀 بات تجهیزات</button>
  </div>
</div>

<!-- صفحه ۴: چت -->
<div id="screen-chat" class="screen">
  <div class="chat-container">
    <div class="chat-header">
      <span class="title" id="chatTitle">چت</span>
      <button class="back-btn" onclick="backToMenu()">↩</button>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-input-row">
      <input id="chatInput" type="text" placeholder="پیام خود را بنویسید..." autocomplete="off" onkeydown="if(event.key==='Enter') sendChat()">
      <button onclick="sendChat()">ارسال</button>
    </div>
  </div>
</div>

<!-- صفحه ۵: کشورها -->
<div id="screen-countries" class="screen">
  <div class="chat-header" style="border-radius: 20px; margin-bottom: 10px;">
    <span class="title">🌍 کشورهای دنیا و گروهک‌ها</span>
    <button class="back-btn" onclick="backToMenu()">↩</button>
  </div>
  <div class="countries-list" id="countriesList"></div>
</div>

<script>
// ============ اتصال به Supabase ============
const SUPABASE_URL = 'https://dqykeqtibspeajxdpsuk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4eLhQiDjFiWpTZn-P5w0dw_Q4xJgLLM';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============ لیست کشورها و گروهک‌ها ============
const ALL_ENTITIES = [
  "ایران","افغانستان","عراق","ترکیه","پاکستان","عربستان","امارات","قطر","کویت","عمان",
  "بحرین","یمن","سوریه","لبنان","اردن","فلسطین","مصر","لیبی","تونس","الجزایر",
  "مراکش","سودان","اتیوپی","سومالی","کنیا","تانزانیا","اوگاندا","نیجریه","غنا","سنگال",
  "آفریقای جنوبی","زیمبابوه","آنگولا","موزامبیک","ماداگاسکار","کامرون","چاد","نیجر","مالی","موریتانی",
  "روسیه","اوکراین","بلاروس","لهستان","آلمان","فرانسه","انگلیس","ایتالیا","اسپانیا","پرتغال",
  "هلند","بلژیک","سوئیس","اتریش","سوئد","نروژ","فنلاند","دانمارک","یونان","بلغارستان",
  "رومانی","مجارستان","چک","اسلواکی","صربستان","کرواسی","بوسنی","آلبانی","مقدونیه","اسلوونی",
  "چین","ژاپن","کره جنوبی","کره شمالی","هند","اندونزی","مالزی","تایلند","ویتنام","فیلیپین",
  "سنگاپور","برمه","کامبوج","لائوس","مغولستان","قزاقستان","ازبکستان","ترکمنستان","قرقیزستان","تاجیکستان",
  "آذربایجان","ارمنستان","گرجستان","آمریکا","کانادا","مکزیک","برزیل","آرژانتین","شیلی","پرو",
  "کلمبیا","ونزوئلا","اکوادور","بولیوی","پاراگوئه","اروگوئه","کوبا","جامائیکا","هائیتی","دومینیکن",
  "استرالیا","نیوزیلند","فیجی","پاپوآ گینه نو","سودان جنوبی","اریتره","جیبوتی","گابن",
  "کنگو","رواندا","بوروندی","مالاوی","زامبیا","بوتسوانا","ناميبيا","لسوتو","اسواتینی","گینه",
  "سیرالئون","لیبریا","ساحل عاج","بورکینافاسو","توگو","بنین","گامبیا","گینه بیسائو","کیپ ورد","سیشل",
  "موریس","کومور","سائوتومه","برونئی","تیمور شرقی","مالدیو","بوتان","نپال","بنگلادش","سریلانکا",
  "داعش", "حزب‌الله", "طالبان", "القاعده", "حماس", "انصارالله"
];

// ============ دیتابیس تجهیزات (بر اساس قدرت کشورها) ============
const EQUIPMENT_DB = {
  "ایران": "موشک بالستیک خیبرشکن، پهپاد شاهد ۱۳۶، تانک کرار",
  "آمریکا": "جنگنده F-35، ناو هواپیمابر جورج واشنگتن، بمب‌افکن B-2",
  "روسیه": "موشک هایپرسونیک آوانگارد، تانک T-14 آرماتا، جنگنده سوخو ۵۷",
  "چین": "جنگنده J-20، موشک دانگ‌فنگ ۴۱، ناوشکن تایپ ۰۵۵",
  "اسرائیل": "سیستم گنبد آهنین، جنگنده F-35I، ماهواره جاسوسی اوفک",
  "انگلیس": "تانک چلنجر ۲، جنگنده تایفون، زیردریایی هسته‌ای آستوت",
  "فرانسه": "جنگنده رافال، ناو هواپیمابر شارل دوگل، موشک اگزوست",
  "داعش": "تویوتا هایلوکس مسلح، سلاح‌های سبک انفرادی، بمب‌های دست‌ساز",
  "حزب‌الله": "موشک‌های نقطه‌زن فاتح ۱۱۰، پهپادهای انتحاری، راکت‌های کاتیوشا",
  "طالبان": "هلیکوپتر بلک هاوک، سلاح‌های باقی‌مانده ارتش آمریکا، زره‌پوش هاموی"
};

// ============ متغیرهای بازی ============
let playerName = '';
let playerCountry = null;
let playerCode = null;
let hasEquipment = false;
let currentChatType = 'country'; // country یا equipment

// ============ حافظه مرورگر (LocalStorage) ============
function saveGame() {
  localStorage.setItem('iranwar_data', JSON.stringify({
    name: playerName,
    country: playerCountry,
    code: playerCode,
    hasEquipment: hasEquipment
  }));
}

function loadGame() {
  const data = localStorage.getItem('iranwar_data');
  if (data) {
    const parsed = JSON.parse(data);
    if (parsed.name) {
      playerName = parsed.name;
      playerCountry = parsed.country;
      playerCode = parsed.code;
      hasEquipment = parsed.hasEquipment || false;
      showScreen('screen-menu');
    }
  }
}

// ============ ناوبری ============
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function backToMenu() { showScreen('screen-menu'); }

// ============ ثبت نام ============
function submitName() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { alert('لطفاً اسم خود را وارد کنید'); return; }
  playerName = name;
  saveGame();
  
  document.getElementById('congratsText').innerHTML = 
    `🎉 <b>${name}</b> عزیز،<br><br>تبریک می‌گم!<br>به دنیای <span style="color:#facc15">ایران وار</span> خوش اومدی.`;
  
  showScreen('screen-congrats');
  setTimeout(() => showScreen('screen-menu'), 2500);
}

// ============ چت ============
function openChat(type) {
  currentChatType = type;
  showScreen('screen-chat');
  
  const title = document.getElementById('chatTitle');
  const box = document.getElementById('chatBox');
  
  if (type === 'country') {
    title.textContent = '🧑‍💻 بات کشورگیری';
    if (box.children.length === 0) {
      addMsg('bot', `سلام ${playerName}! 👋 اسم یک کشور یا گروهک رو بفرست تا برات ثبت کنم.`);
    }
  } else if (type === 'equipment') {
    title.textContent = '🚀 بات تجهیزات';
    if (box.children.length === 0) {
      addMsg('bot', `سلام ${playerName} خوش اومدی 👋<br>کد کشور خودت رو بده تا تجهیزات کشورت رو بهت بدم 🚀`);
    }
  }
}

function addMsg(role, text) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg('user', text);

  if (currentChatType === 'country') {
    handleCountryChat(text);
  } else {
    handleEquipmentChat(text);
  }
}

// ============ منطق بات کشورگیری ============
async function handleCountryChat(text) {
  if (playerCountry) {
    setTimeout(() => addMsg('bot', 'شما قبلاً کشور گرفته‌اید. منتظر سیزن بعد باشید ⏳'), 400);
    return;
  }

  const found = ALL_ENTITIES.find(e => e === text);
  if (!found) {
    setTimeout(() => addMsg('bot', 'کشور یافت نشد ❌'), 400);
    return;
  }

  try {
    const { data: existing } = await db.from('player_countries').select('country').eq('country', found).maybeSingle();
    
    if (existing) {
      setTimeout(() => addMsg('bot', 'این کشور از قبل گرفته شده است ❌'), 400);
      return;
    }

    const code = Math.floor(1000 + Math.random() * 9000);
    const { error } = await db.from('player_countries').insert([{ player_name: playerName, country: found, code: code }]);
    
    if (error) throw error;
    
    playerCountry = found;
    playerCode = code;
    saveGame(); // ذخیره در حافظه مرورگر

    setTimeout(() => addMsg('bot', 'کشور شما با موفقیت ثبت شد ✅'), 400);
    setTimeout(() => addMsg('bot', `🔑 کد اختصاصی شما: <b>${code}</b>`), 900);
    setTimeout(() => addMsg('bot', 'منتظر سیزن بعد باشید ⏳'), 1400);

  } catch (err) {
    console.error(err);
    setTimeout(() => addMsg('bot', 'خطا در ثبت اطلاعات ❌'), 400);
  }
}

// ============ منطق بات تجهیزات ============
async function handleEquipmentChat(inputCode) {
  if (hasEquipment) {
    setTimeout(() => addMsg('bot', 'شما قبلاً تجهیزات خود را دریافت کرده‌اید. ⏳'), 400);
    return;
  }

  if (!playerCountry || !playerCode) {
    setTimeout(() => addMsg('bot', 'شما هنوز کشوری نگرفته‌اید! اول از بات کشورگیری یک کشور بگیرید ❌'), 400);
    return;
  }

  if (parseInt(inputCode) !== playerCode) {
    setTimeout(() => addMsg('bot', 'کد اشتباه است! کدی که بات کشورگیری به شما داد را وارد کنید ❌'), 400);
    return;
  }

  // پیدا کردن تجهیزات بر اساس کشور
  let equipment = EQUIPMENT_DB[playerCountry];
  if (!equipment) {
    equipment = "تجهیزات پایه نظامی، سلاح‌های سبک و مهمات تاکتیکی";
  }

  try {
    await db.from('equipment_claims').insert([{ 
      player_name: playerName, 
      country: playerCountry, 
      equipment: equipment 
    }]);

    hasEquipment = true;
    saveGame();

    setTimeout(() => addMsg('bot', `کد تایید شد ✅<br>کشور شما: <b>${playerCountry}</b>`), 400);
    setTimeout(() => addMsg('bot', `🚀 تجهیزات شما:<br><span style="color:#22c55e">${equipment}</span>`), 900);
    setTimeout(() => addMsg('bot', 'موفق باشی فرمانده! 🫡'), 1400);

  } catch (err) {
    console.error(err);
    setTimeout(() => addMsg('bot', 'خطا در دریافت تجهیزات ❌'), 400);
  }
}

// ============ صفحه کشورها ============
async function openCountries() {
  showScreen('screen-countries');
  const list = document.getElementById('countriesList');
  list.innerHTML = '<p style="text-align:center;color:#888;padding:20px">در حال دریافت اطلاعات...</p>';

  let takenSet = new Set();
  try {
    const { data } = await db.from('player_countries').select('country');
    if (data) takenSet = new Set(data.map(r => r.country));
  } catch(e) { console.log(e); }

  list.innerHTML = '';
  ALL_ENTITIES.forEach(c => {
    const isTaken = takenSet.has(c);
    const div = document.createElement('div');
    div.className = 'country-item' + (isTaken ? ' taken' : '');
    div.innerHTML = `<span>${c}</span>` + (isTaken ? '<span class="check">✅</span>' : '<span style="color:#64748b">—</span>');
    list.appendChild(div);
  });
}

// ============ شروع بازی ============
loadGame(); // چک کردن اینکه بازیکن قبلا اومده یا نه
</script>

</body>
 </html>
