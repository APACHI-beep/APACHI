<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Space Ship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Vazirmatn:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Vazirmatn',sans-serif;touch-action:none;user-select:none}
  canvas{display:block;width:100%;height:100%}
  
  /* Tabs */
  #tabs{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;gap:4px;padding:10px;z-index:10;opacity:0;pointer-events:none;transition:opacity .3s;background:linear-gradient(180deg,rgba(0,10,25,.9),transparent)}
  #tabs.active{opacity:1;pointer-events:auto}
  .tab{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;font-weight:800;font-size:13px;color:#9fd4ec;background:rgba(15,35,60,.65);border:1px solid rgba(90,170,220,.35);cursor:pointer;transition:all .2s}
  .tab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tab.active{color:#001018;background:linear-gradient(180deg,#a8f3ff,#2bb5ff);border-color:#a8f3ff;box-shadow:0 0 18px rgba(56,200,255,.8)}
  .tab:active{transform:scale(.95)}
  
  /* HUD */
  #ui{position:fixed;inset:0;pointer-events:none;padding:72px 10px 8px;z-index:5;display:none}
  #ui.show{display:block}
  #rightUI{position:absolute;top:72px;right:10px;display:flex;gap:6px}
  .heart{width:24px;height:24px;background:radial-gradient(circle at 35% 30%,#fff0f3,#ff4d6d 22%,#d8002f 60%,#5a0016);clip-path:path('M12,22 C-2,12 -2,4 5,2 C9,1 12,3 12,6 C12,3 15,1 19,2 C26,4 26,12 12,22 Z');filter:drop-shadow(0 0 10px #ff4d6d)}
  .heart.dead{opacity:0}
  #leftUI{position:absolute;top:72px;left:10px;display:flex;flex-direction:column;gap:4px}
  .pill{padding:4px 11px;border-radius:11px;background:linear-gradient(180deg,rgba(40,80,140,.65),rgba(10,20,40,.78));border:1px solid rgba(120,210,255,.6);box-shadow:inset 0 0 8px rgba(120,210,255,.3),0 2px 10px rgba(56,200,255,.35);backdrop-filter:blur(6px);font-family:'Orbitron',sans-serif;font-weight:800;white-space:nowrap;direction:ltr}
  .recordBox{color:#ffd84d;font-size:12px;text-shadow:0 0 8px #ff9d00}
  .scoreBox{color:#dff4ff;font-size:16px;text-shadow:0 0 8px #38c8ff}
  .coinBox{color:#ffe27a;font-size:16px;text-shadow:0 0 8px #ffb300}

  /* Lobby */
  #lobby{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:40px;background:radial-gradient(circle at 50% 30%,rgba(0,50,100,.55),rgba(0,0,0,.98) 70%),radial-gradient(circle at 80% 80%,rgba(120,30,200,.25),transparent 60%),radial-gradient(circle at 20% 70%,rgba(30,150,255,.2),transparent 60%);z-index:8;transition:opacity .4s;overflow:hidden}
  #lobby::before{content:'';position:absolute;inset:0;background-image:radial-gradient(2px 2px at 15% 25%,#fff,transparent),radial-gradient(2px 2px at 82% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 35% 65%,#cfe8ff,transparent),radial-gradient(2px 2px at 70% 75%,#fff,transparent),radial-gradient(1px 1px at 55% 35%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 85%,#fff,transparent),radial-gradient(1px 1px at 90% 55%,#cfe8ff,transparent),radial-gradient(1.5px 1.5px at 25% 15%,#fff,transparent),radial-gradient(2px 2px at 60% 90%,#fff,transparent);opacity:.85;animation:tw 4s ease-in-out infinite alternate}
  @keyframes tw{0%{opacity:.55}100%{opacity:.95}}
  #lobby.hidden{opacity:0;pointer-events:none}
  #lobbyTitle{position:absolute;top:12%;font-size:40px;font-weight:900;color:#eaf7ff;text-shadow:0 0 10px #38c8ff,0 0 28px #0090ff,0 0 60px #0060ff,0 0 100px rgba(0,120,255,.7);letter-spacing:5px;font-family:'Orbitron',sans-serif;z-index:2}
  #lobbyShip{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(255,80,120,.55)) drop-shadow(0 0 50px rgba(255,40,90,.35));z-index:2}
  @keyframes fl{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-58%)}}
  .lobby-btns{display:flex;flex-direction:column;gap:14px;width:80%;max-width:320px;z-index:10;margin-top:auto}
  #startBtn{cursor:pointer;border:none;padding:16px 0;font-size:20px;font-weight:900;color:#001018;border-radius:40px;background:linear-gradient(180deg,#a8f3ff,#18a8ff);box-shadow:0 0 24px #18a8ff,0 0 60px rgba(24,168,255,.7),inset 0 -3px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.4);letter-spacing:2px}
  #startBtn:active{transform:scale(.95)}
  .secondary-btns{display:flex;gap:10px}
  .secBtn{flex:1;cursor:pointer;border:1px solid rgba(90,170,220,.55);background:linear-gradient(180deg,rgba(20,45,75,.85),rgba(8,18,35,.9));color:#a9d8f0;padding:12px 0;border-radius:14px;font-size:13px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px;backdrop-filter:blur(4px)}
  .secBtn:active{transform:scale(.95)}
  .secBtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* Modals */
  #message{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%) scale(.7);color:#fff;font-size:32px;font-weight:900;font-family:'Orbitron',sans-serif;text-shadow:0 0 12px #ff2b6d,0 0 30px #ff2b6d,0 0 60px #ff2b6d;opacity:0;transition:all .45s cubic-bezier(.2,1.4,.4,1);pointer-events:none;white-space:nowrap;z-index:7;letter-spacing:2px}
  #message.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  
  /* Shop Panel */
  #shopPanel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;background:radial-gradient(circle at 50% 40%,rgba(0,20,40,.95),rgba(0,0,0,.98));backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:4;padding-top:65px}
  #shopPanel.show{opacity:1;pointer-events:auto}
  
  /* Shop Tabs */
  .shop-tabs{display:flex;gap:20px;margin-bottom:20px;border-bottom:1px solid rgba(56,200,255,.3);width:90%;max-width:400px;justify-content:space-around;flex-shrink:0}
  .shop-tab{color:#7a9bb5;font-weight:800;font-size:16px;padding-bottom:10px;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;display:flex;align-items:center;gap:6px}
  .shop-tab.active{color:#38c8ff;border-bottom-color:#38c8ff;text-shadow:0 0 10px rgba(56,200,255,.5)}
  
  /* Shop Content */
  #shopContent{width:90%;max-width:400px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:15px;padding-bottom:80px;scrollbar-width:none}
  #shopContent::-webkit-scrollbar{display:none}
  
  .weapon-card{background:linear-gradient(135deg,rgba(5,20,15,.9),rgba(10,25,20,.9));border:1px solid rgba(50,200,100,.5);border-radius:16px;padding:16px;position:relative;box-shadow:0 4px 15px rgba(0,0,0,.5)}
  .w-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
  .w-name{color:#fff;font-size:20px;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.8)}
  .w-info{color:#8ab2c8;font-size:13px;font-weight:600}
  .w-actions{display:flex;gap:10px;margin-top:12px;align-items:stretch}
  .w-btn{flex:1;border:none;border-radius:14px;padding:12px;font-size:15px;font-weight:900;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:'Vazirmatn',sans-serif;transition:transform .15s}
  .w-btn:active{transform:scale(.95)}
  .btn-equip{background:transparent;border:2px solid #0fb;color:#0fb;box-shadow:inset 0 0 10px rgba(0,255,187,.2);flex:0.8}
  .btn-buy{background:linear-gradient(180deg,#ff4df0,#a010a0);box-shadow:0 0 15px rgba(255,77,240,.5);font-size:14px}
  .btn-buy.disabled{background:#333;box-shadow:none;opacity:0.6;cursor:not-allowed}
  .btn-equip.active{background:linear-gradient(180deg,#0fb,#008f70);color:#001018;box-shadow:0 0 15px #0fb;border-color:#0fb}
  .price-row{font-size:12px;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:2px;color:#ffd700;text-shadow:0 1px 2px #000}
  .max-level{color:#ffd700;font-size:16px;text-shadow:0 0 10px #ffd700;font-weight:900;margin-top:10px;text-align:center;display:flex;align-items:center;justify-content:center;flex:1}

  /* Simple Modal (Rank/Profile) */
  #simpleModal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(0,40,90,.78),rgba(0,0,0,.97));backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
  #simpleModal.show{opacity:1;pointer-events:auto}
  .simple-card{background:linear-gradient(180deg,rgba(20,40,70,.98),rgba(5,12,26,.98));border:1px solid #38c8ff;border-radius:22px;padding:28px 26px;box-shadow:0 0 50px rgba(56,200,255,.6),inset 0 0 30px rgba(56,200,255,.2);text-align:center;max-width:88vw;min-width:280px}
  .simple-card h2{color:#a8f0ff;font-size:24px;margin-bottom:12px;text-shadow:0 0 16px #38c8ff;font-weight:900}
  .simple-card p{color:#cdeaff;font-size:15px;margin-bottom:18px;line-height:1.8}
  .simple-card button{cursor:pointer;border:none;padding:12px 36px;font-size:15px;font-weight:800;color:#001018;border-radius:30px;background:linear-gradient(180deg,#a8f3ff,#18a8ff);box-shadow:0 0 18px #18a8ff,inset 0 -2px 0 rgba(0,0,0,.3)}

  #gameOver{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(0,20,40,.92),rgba(0,0,0,.98));backdrop-filter:blur(8px);transition:opacity .3s;z-index:10;opacity:0;pointer-events:none}
  #gameOver.show{opacity:1;pointer-events:auto}
  .go-title{font-size:40px;font-weight:900;color:#ff3355;text-shadow:0 0 20px #ff1744,0 0 50px #ff1744;margin-bottom:30px;display:flex;align-items:center;gap:12px;font-family:'Orbitron',sans-serif}
  .go-title svg{width:40px;height:40px;fill:#ff3355}
  .go-sub{color:#fff;font-size:18px;font-weight:800;margin-bottom:25px}
  .go-score{color:#fff;font-size:20px;font-weight:800;margin-bottom:15px;display:flex;gap:5px}
  .go-reward{color:#ffe000;font-size:20px;font-weight:800;margin-bottom:40px;display:flex;gap:8px;align-items:center;text-shadow:0 0 14px #ffe000}
  .go-reward svg{width:24px;height:24px;fill:#ffe000}
  #restartBtn{cursor:pointer;border:none;padding:16px 60px;font-size:20px;font-weight:900;color:#fff;border-radius:50px;background:linear-gradient(180deg,#ff5588,#e91e63);box-shadow:0 0 26px #e91e63,inset 0 -3px 0 rgba(0,0,0,.25);letter-spacing:2px}
  #restartBtn:active{transform:scale(.95)}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="tabs">
  <div class="tab active" id="tabGame"><svg viewBox="0 0 24 24"><path d="M6 12h4M8 10v4"/><circle cx="15.5" cy="11" r="1.2"/><circle cx="18.5" cy="13" r="1.2"/><path d="M17.5 2c2 3 2 6-1 9l-2-2c2-2 2-5 3-7z"/><path d="M6 2C4 5 4 8 7 11l2-2C7 7 7 4 6 2z"/></svg><span>بازی</span></div>
  <div class="tab" id="tabShop"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>فروشگاه</span></div>
  <div class="tab" id="tabRank"><svg viewBox="0 0 24 24"><path d="M8 21l4-9 4 9M12 12v9M6 3h12v6a6 6 0 0 1-12 0V3z"/></svg><span>رتبه بندی</span></div>
  <div class="tab" id="tabProfile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg><span>پروفایل</span></div>
</div>

<div id="ui">
  <div id="rightUI"><div class="heart" id="h1"></div><div class="heart" id="h2"></div><div class="heart" id="h3"></div></div>
  <div id="leftUI">
    <div class="pill recordBox" id="record">رکورد 0</div>
    <div class="pill scoreBox" id="score">امتیاز 0</div>
    <div class="pill coinBox" id="coins">💰 0</div>
  </div>
</div>

<div id="message"></div>

<!-- Shop Panel -->
<div id="shopPanel">
  <div class="shop-tabs">
    <div class="shop-tab active" id="stWeapons">🔫 اسلحه‌ها</div>
    <div class="shop-tab" id="stShips">🚀 سفینه‌ها</div>
  </div>
  <div id="shopContent"></div>
</div>

<!-- Simple Modal for Rank / Profile -->
<div id="simpleModal">
  <div class="simple-card">
    <h2 id="smTitle">🏆</h2>
    <p>این بخش به زودی اضافه می‌شود</p>
    <button id="smClose">باشه</button>
  </div>
</div>

<div id="lobby">
  <div id="lobbyTitle">SPACE SHIP</div>
  <div id="lobbyShip"></div>
  <div class="lobby-btns">
    <button id="startBtn">شروع بازی</button>
    <div class="secondary-btns">
      <div class="secBtn" id="lobbyShop"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>فروشگاه</div>
      <div class="secBtn" id="lobbyRank"><svg viewBox="0 0 24 24"><path d="M8 21l4-9 4 9M12 12v9M6 3h12v6a6 6 0 0 1-12 0V3z"/></svg>رتبه بندی</div>
      <div class="secBtn" id="lobbyProfile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg>پروفایل</div>
    </div>
  </div>
</div>

<div id="gameOver">
  <div class="go-title"><svg viewBox="0 0 24 24"><path d="M12 2L14.5 9.5H22L15.8 13.8L18.3 21.5L12 17.2L5.7 21.5L8.2 13.8L2 9.5H9.5L12 2Z"/></svg>بازی تمام شد!</div>
  <div class="go-sub">جونات تموم شد...</div>
  <div class="go-score">امتیاز این دست: <span id="goScore">0</span></div>
  <div class="go-reward">پاداش سکه: <span id="goReward">0</span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd700" stroke="#b8860b" stroke-width="2"/></svg></div>
  <button id="restartBtn">شروع مجدد</button>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha:false });
let W=0,H=0,DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR|0; cv.height = H*DPR|0;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingQuality = 'high';
  buildCaches(); drawLobbyShip();
}
addEventListener('resize', resize);

const WEAPONS = [
  { id:'laser1', name:'لیزر ساده', price:0, baseUpgPrice:200, upgMul:1.5, baseDmg:1, shots:1, color:'#38b6ff' },
  { id:'double', name:'شلیک دوقلو', price:500, baseUpgPrice:200, upgMul:1.5, baseDmg:1, shots:2, color:'#ffd84d' },
  { id:'red', name:'لیزر سرخ', price:1000, baseUpgPrice:300, upgMul:1.5, baseDmg:2, shots:1, color:'#ff3355' },
  { id:'triple', name:'سه گانه', price:2000, baseUpgPrice:400, upgMul:1.5, baseDmg:1, shots:3, color:'#00ff00' }
];

const store = {
  get record(){ return +(localStorage.sp_record||0); },
  set record(v){ localStorage.sp_record = v; },
  get coins(){ return +(localStorage.sp_coins||0); },
  set coins(v){ localStorage.sp_coins = v; },
  get weapons(){ 
    let w = JSON.parse(localStorage.getItem('sp_weapons') || '{}');
    if(!w['laser1']) w['laser1'] = { level: 1, owned: true };
    return w;
  },
  saveWeapons(w){ localStorage.setItem('sp_weapons', JSON.stringify(w)); },
  get equipped(){ return localStorage.sp_equipped || 'laser1'; },
  set equipped(id){ localStorage.sp_equipped = id; }
};

function getWeaponStats(id) {
  const base = WEAPONS.find(w=>w.id===id);
  const st = store.weapons[id] || {level:1};
  const dmg = base.baseDmg + (st.level - 1);
  return { ...base, level: st.level, dmg };
}

function calcUpgPrice(w) {
  const st = store.weapons[w.id] || {level:1};
  if(st.level >= 10) return 0;
  return Math.floor(w.baseUpgPrice * Math.pow(w.upgMul, st.level - 1));
}

const shopPanel = document.getElementById('shopPanel');
const shopContent = document.getElementById('shopContent');
const stWeapons = document.getElementById('stWeapons');
const stShips = document.getElementById('stShips');
const simpleModal = document.getElementById('simpleModal');
const smTitle = document.getElementById('smTitle');
const smClose = document.getElementById('smClose');

let currentShopTab = 'weapons';

function renderShop() {
  shopContent.innerHTML = '';
  
  if(currentShopTab === 'ships') {
    shopContent.innerHTML = '<div style="color:#fff;text-align:center;margin-top:50px;font-size:20px;font-weight:800;">🚀 به زودی ....</div>';
    return;
  }

  WEAPONS.forEach(w => {
    const st = store.weapons[w.id];
    const owned = st && st.owned;
    const level = st ? st.level : 0;
    const equipped = store.equipped === w.id;
    const upgPrice = calcUpgPrice(w);
    const isMax = level >= 10;
    const stats = getWeaponStats(w.id);
    
    const card = document.createElement('div');
    card.className = 'weapon-card';
    
    let html = `
      <div class="w-header">
        <div class="w-name">${w.name}</div>
        <div class="w-info">دمیج: ${owned ? stats.dmg : w.baseDmg} | تعداد تیر: ${w.shots}</div>
      </div>
    `;
    
    html += `<div class="w-actions">`;
    
    if(!owned) {
      const canBuy = store.coins >= w.price;
      html += `
        <button class="w-btn btn-buy ${canBuy?'':'disabled'}" data-action="buy" data-id="${w.id}" style="flex:1;">
          خرید
          <div class="price-row">💰 ${w.price}</div>
        </button>
      `;
    } else {
      html += `
        <button class="w-btn btn-equip ${equipped?'active':''}" data-action="equip" data-id="${w.id}">
          ${equipped ? 'مجهز' : 'مجهز کردن'}
        </button>
      `;
      
      if(isMax) {
        html += `<div class="max-level">Lvl.10</div>`;
      } else {
        const canUpg = store.coins >= upgPrice;
        html += `
          <button class="w-btn btn-buy ${canUpg?'':'disabled'}" data-action="upgrade" data-id="${w.id}" style="flex:1;">
            🎇 ارتقا - Lvl ${level}
            <div class="price-row">💰 ${upgPrice}</div>
          </button>
        `;
      }
    }
    
    html += `</div>`;
    card.innerHTML = html;
    shopContent.appendChild(card);
  });

  shopContent.querySelectorAll('.w-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const action = btn.dataset.action;
      const id = btn.dataset.id;
      if(btn.classList.contains('disabled')) return;
      
      if(action === 'buy') {
        const w = WEAPONS.find(x=>x.id===id);
        if(store.coins >= w.price) {
          store.coins -= w.price;
          let wData = store.weapons;
          wData[id] = { level: 1, owned: true };
          store.saveWeapons(wData);
          store.equipped = id; 
          updateUI();
          renderShop();
        }
      } else if(action === 'equip') {
        store.equipped = id;
        renderShop();
      } else if(action === 'upgrade') {
        const w = WEAPONS.find(x=>x.id===id);
        const price = calcUpgPrice(w);
        if(store.coins >= price) {
          store.coins -= price;
          let wData = store.weapons;
          wData[id].level++;
          store.saveWeapons(wData);
          updateUI();
          renderShop();
        }
      }
    });
  });
}

stWeapons.addEventListener('click', () => {
  currentShopTab = 'weapons';
  stWeapons.classList.add('active');
  stShips.classList.remove('active');
  renderShop();
});
stShips.addEventListener('click', () => {
  currentShopTab = 'ships';
  stShips.classList.add('active');
  stWeapons.classList.remove('active');
  renderShop();
});

/* Simple Modal Logic */
function showSimpleModal(title) {
  smTitle.textContent = title;
  simpleModal.classList.add('show');
  G.running = false;
}
smClose.addEventListener('click', () => {
  simpleModal.classList.remove('show');
  if(!G.over && !G.inLobby) G.running = true;
});


const G = {
  running:false, over:false, inLobby:true,
  score:0, lives:3, runCoins:0,
  time:0, spawnTimer:0.4, spawnInterval:1.15,
  bossPhase:false, boss:null, nextBossScore:1000,
  bullets:[], miniBullets:[], enemies:[], enemyBullets:[],

const caches={};
const mkC=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w);c.height=Math.max(1,h);return c;};
const hexA=(hex,a)=>{const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;};

function glow(color,radius,intensity=1){
  const size=radius*2,c=mkC(size,size),g=c.getContext('2d');
  const grad=g.createRadialGradient(radius,radius,1,radius,radius,radius);
  grad.addColorStop(0,hexA(color,intensity));
  grad.addColorStop(0.45,hexA(color,.55*intensity));
  grad.addColorStop(1,hexA(color,0));
  g.fillStyle=grad;g.fillRect(0,0,size,size);return c;
}

function makeShipSprite(scale){
  const sw=140, sh=160, c=mkC(sw*scale,sh*scale), g=c.getContext('2d');
  g.scale(scale,scale); g.translate(sw/2, sh/2);
  const N=-60, T=50, WY=22, WX=52;
  
  const engOuter=g.createRadialGradient(0,42,2,0,42,50);
  engOuter.addColorStop(0,'rgba(255,80,120,.8)'); engOuter.addColorStop(.5,'rgba(255,20,60,.3)'); engOuter.addColorStop(1,'rgba(255,0,50,0)');
  g.fillStyle=engOuter; g.beginPath(); g.arc(0,42,50,0,Math.PI*2); g.fill();
  const engInner=g.createRadialGradient(0,42,2,0,42,20);
  engInner.addColorStop(0,'#fff'); engInner.addColorStop(.3,'#ffb3c6'); engInner.addColorStop(1,'rgba(255,20,60,0)');
  g.fillStyle=engInner; g.beginPath(); g.arc(0,42,20,0,Math.PI*2); g.fill();
  
  const au=g.createRadialGradient(0,0,10,0,0,80); au.addColorStop(0,'rgba(255,70,110,.25)'); au.addColorStop(1,'rgba(255,0,60,0)');
  g.fillStyle=au; g.beginPath(); g.arc(0,0,80,0,Math.PI*2); g.fill();

  const body=()=>{
    g.beginPath();
    g.moveTo(0,N);
    g.bezierCurveTo(-8,-40, -WX*0.4,WY*0.2, -WX,WY);
    g.lineTo(-WX*0.65,WY+6); g.lineTo(-WX*0.35,WY+18); g.lineTo(-24,T-10); g.lineTo(0,T);
    g.lineTo(24,T-10); g.lineTo(WX*0.35,WY+18); g.lineTo(WX*0.65,WY+6); g.lineTo(WX,WY);
    g.bezierCurveTo(WX*0.4,WY*0.2, 8,-40, 0,N);
    g.closePath();
  };

  body(); g.lineWidth=12; g.strokeStyle='rgba(255,60,100,.2)'; g.stroke();
  body(); g.lineWidth=5; g.strokeStyle='rgba(255,120,150,.7)'; g.stroke();
  body();
  const fill=g.createLinearGradient(0,N,0,T);
  fill.addColorStop(0,'#2a0a12'); fill.addColorStop(0.4,'#7a1a2e'); fill.addColorStop(0.6,'#5c0f20'); fill.addColorStop(1,'#1a0308');
  g.fillStyle=fill; g.fill();
  g.lineWidth=2.5; g.strokeStyle='#ff6b85'; body(); g.stroke();

  g.beginPath(); g.moveTo(0,N+10); g.lineTo(-12, T-15); g.lineTo(12, T-15); g.closePath();
  const panelGrad=g.createLinearGradient(0,0,0,T); panelGrad.addColorStop(0,'#9e2a46'); panelGrad.addColorStop(1,'#3a0510');
  g.fillStyle=panelGrad; g.fill(); g.lineWidth=1.5; g.strokeStyle='rgba(255,150,170,.8)'; g.stroke();

  const cpGrad=g.createLinearGradient(0,-26,0,-4); cpGrad.addColorStop(0,'#fff'); cpGrad.addColorStop(0.4,'#ffd1dc'); cpGrad.addColorStop(1,'#ff4d6d');
  g.fillStyle=cpGrad; g.beginPath(); g.ellipse(0,-18, 9, 20, 0, 0, Math.PI*2); g.fill();
  g.lineWidth=2; g.strokeStyle='#fff'; g.stroke();
  g.fillStyle='rgba(255,255,255,.8)'; g.beginPath(); g.ellipse(-3,-24, 2.5, 6, 0.3, 0, Math.PI*2); g.fill();

  g.fillStyle='#ffebf0'; g.shadowColor='#ff4d6d'; g.shadowBlur=8;
  g.beginPath(); g.arc(-WX+2, WY, 3, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(WX-2, WY, 3, 0, Math.PI*2); g.fill();
  g.shadowBlur=0;

  g.strokeStyle='#fff'; g.lineWidth=2; g.globalAlpha=.8;
  g.beginPath(); g.moveTo(-8, T+4); g.lineTo(-4, T+22); g.stroke();
  g.beginPath(); g.moveTo(8, T+4); g.lineTo(4, T+22); g.stroke();
  g.globalAlpha=1;
  return c;
}

function makeMiniSprite(scale){
  const c=mkC(60*scale,70*scale),g=c.getContext('2d');
  g.scale(scale,scale); g.translate(30,35);
  const gl=g.createRadialGradient(0,0,2,0,0,30); gl.addColorStop(0,'rgba(255,100,140,.6)'); gl.addColorStop(1,'rgba(255,0,60,0)');
  g.fillStyle=gl; g.beginPath(); g.arc(0,0,30,0,Math.PI*2); g.fill();
  const body=()=>{ g.beginPath(); g.moveTo(0,-28); g.lineTo(-18, 12); g.lineTo(-6, 8); g.lineTo(0, 20); g.lineTo(6, 8); g.lineTo(18, 12); g.closePath(); };
  body();
  const f=g.createLinearGradient(0,-28,0,20); f.addColorStop(0,'#2a0a12'); f.addColorStop(0.5,'#8a1a2e'); f.addColorStop(1,'#1a0308');
  g.fillStyle=f; g.fill(); g.lineWidth=2; g.strokeStyle='#ff6b85'; body(); g.stroke();
  const cp=g.createLinearGradient(0,-14,0,0); cp.addColorStop(0,'#fff'); cp.addColorStop(1,'#ff4d6d');
  g.fillStyle=cp; g.beginPath(); g.ellipse(0,-6, 4, 8, 0, 0, Math.PI*2); g.fill();

function makeHexSprite(r){
  const pad=r*2, size=(r+pad)*2; const c=mkC(size,size), g=c.getContext('2d'); g.translate(size/2, size/2);
  const halo=g.createRadialGradient(0,0,r*0.3,0,0,r*1.8); halo.addColorStop(0,'rgba(255,120,180,.6)'); halo.addColorStop(0.6,'rgba(255,40,110,.15)'); halo.addColorStop(1,'rgba(255,0,80,0)');
  g.fillStyle=halo; g.beginPath(); g.arc(0,0,r*1.8,0,Math.PI*2); g.fill();
  const hex=(rad,rot=0)=>{ g.beginPath(); for(let i=0;i<6;i++){ const a=(Math.PI/3)*i-Math.PI/2+rot; const px=Math.cos(a)*rad, py=Math.sin(a)*rad; i?g.lineTo(px,py):g.moveTo(px,py); } g.closePath(); };
  hex(r); g.fillStyle='rgba(20,0,10,.9)'; g.fill();
  hex(r); const mg=g.createLinearGradient(-r,-r,r,r); mg.addColorStop(0,'rgba(180,20,70,.9)'); mg.addColorStop(0.5,'rgba(90,10,40,.95)'); mg.addColorStop(1,'rgba(40,0,20,.95)');
  g.fillStyle=mg; g.fill();
  hex(r); g.lineWidth=5; g.strokeStyle='rgba(255,60,130,.3)'; g.stroke();
  hex(r); g.lineWidth=2; g.strokeStyle='#ff5f8f'; g.stroke();
  hex(r*0.7,Math.PI/6); g.lineWidth=1.5; g.strokeStyle='rgba(255,160,200,.6)'; g.stroke();
  const cg=g.createRadialGradient(0,0,1,0,0,r*0.6); cg.addColorStop(0,'#fff'); cg.addColorStop(0.4,'#ffd0e0'); cg.addColorStop(1,'rgba(255,40,120,0)');
  g.fillStyle=cg; g.beginPath(); g.arc(0,0,r*0.6,0,Math.PI*2); g.fill();
  return c;
}

function makeNebula(){
  const c=mkC(W, H); const g=c.getContext('2d'); g.fillStyle='#020006'; g.fillRect(0,0,W,H);
  for(let i=0;i<6;i++){ const x=Math.random()*W, y=Math.random()*H, r=Math.random()*W*0.6+W*0.4; const grad=g.createRadialGradient(x,y,0, x,y,r); const hue=i%2===0?'rgba(80,20,120,':'rgba(20,80,150,'; grad.addColorStop(0,hue+'0.15)'); grad.addColorStop(1,hue+'0)'); g.fillStyle=grad; g.fillRect(0,0,W,H); }
  return c;
}

function buildCaches(){
  caches.stars=[glow('#ffffff',3,.55),glow('#cfe8ff',4.5,.7),glow('#ffffff',6,.9)];
  caches.particles={ '#ff5d8f':glow('#ff5d8f',8,.8),'#ff3355':glow('#ff3355',8,.8),'#ffd84d':glow('#ffd84d',8,.8),'#7ef0ff':glow('#7ef0ff',8,.8),'#38b6ff':glow('#38b6ff',8,.8),'#ffa5c0':glow('#ffa5c0',8,.8) };
  caches.bulletGlow=glow('#38b6ff',22,.9); caches.coreGlow=glow('#ffd84d',44,1); caches.nebula=makeNebula();
  const baseR=enemyRadius(); caches.hex={baseR,sprite:makeHexSprite(baseR)};
  player.scale=Math.min(Math.max(1,Math.min(W,H)/400),2); caches.ship=makeShipSprite(player.scale); caches.mini=makeMiniSprite(player.scale*.9);
  if(G.boss) caches.boss=makeBossSprite(G.boss.w,G.boss.h,G.boss.variant);
  makeStars();
}

function makeStars(){
  G.stars=[]; const count=Math.floor((W*H)/4000);
  for(let i=0;i<count;i++){ const layer=Math.floor(Math.random()*3); G.stars.push({ x:Math.random()*W,y:Math.random()*H,layer, r:layer===0?rnd(0.6,1.1):layer===1?rnd(1,1.7):rnd(1.5,2.4), s:layer===0?rnd(20,40):layer===1?rnd(50,90):rnd(100,160), a:layer===0?rnd(0.35,0.6):layer===1?rnd(0.55,0.85):rnd(0.8,1) }); }
}

const player={x:0,y:0,scale:1,hitCooldown:0};
const minis=[{offset:-60,fireTimer:0},{offset:60,fireTimer:0}];
function resetPlayer(){
  player.x=W/2; player.y=H-90; player.scale=Math.min(Math.max(1,Math.min(W,H)/400),2); player.hitCooldown=0; minis.forEach(m=>m.fireTimer=0);
}
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

function shoot(){
  if(G.fireCooldown>0)return;
  G.fireCooldown=0.16;
  const s=player.scale;
  const wStats = getWeaponStats(store.equipped);
  
  if(wStats.shots === 1) {
    G.bullets.push({x:player.x, y:player.y-30*s, r:9*s, vy:-800, dmg:wStats.dmg, color:wStats.color});
  } else if(wStats.shots === 2) {
    G.bullets.push({x:player.x-15*s, y:player.y-25*s, r:7*s, vy:-800, dmg:wStats.dmg, color:wStats.color});
    G.bullets.push({x:player.x+15*s, y:player.y-25*s, r:7*s, vy:-800, dmg:wStats.dmg, color:wStats.color});
  } else if(wStats.shots === 3) {
    G.bullets.push({x:player.x, y:player.y-35*s, r:9*s, vy:-800, dmg:wStats.dmg, color:wStats.color});
    G.bullets.push({x:player.x-20*s, y:player.y-20*s, r:7*s, vy:-800, dmg:wStats.dmg, color:wStats.color});
    G.bullets.push({x:player.x+20*s, y:player.y-20*s, r:7*s, vy:-800, dmg:wStats.dmg, color:wStats.color});
  }
  
  if(G.particles.length<G.MAX_PARTICLES) burst(player.x,player.y-32*s,'#38b6ff',4,110);
}

function shootMini(m){
  const s=player.scale;
  G.miniBullets.push({x:player.x+m.offset*s,y:player.y+8*s,r:5*s,vy:-680,dmg:1});
}

function enemyRadius(){return clamp(Math.min(W,H)*0.045,22,46);}
function spawnEnemy(){
  const wave = 1 + Math.floor(G.score/1000);
  const r=enemyRadius()*rnd(0.9,1.1);
  const baseVy = 550 + G.time*2.5 + wave*30;
  const baseVx = 40 + wave*6;
  G.enemies.push({
    x:rnd(r+20,W-r-20),y:-r-20,r, vy:rnd(baseVy*0.85,baseVy*1.15), vx:rnd(-baseVx,baseVx),
    rot:Math.random()*Math.PI, rotSpeed:rnd(-1.6,1.6), hp:1
  });
}

function spawnBoss(){
  G.bossPhase=true;
  const waveIndex=Math.max(1,Math.floor(G.score/1000));
  const bw=clamp(W*0.42,160,280);
  const variant=(waveIndex-1)%8;
  G.boss={ x:W/2,y:-bw*0.5,w:bw,h:bw*0.55, targetY:Math.min(130,H*0.16),dir:1,speed:W*0.22, hp:20+waveIndex*6,maxHp:20+waveIndex*6, entering:true,volleyCount:0,variant,t:0 };
  caches.boss=makeBossSprite(G.boss.w,G.boss.h,variant);
  showMessage('⚠️ DANGER ⚠️',1800);
}

function makeBossSprite(w,h,variant){
  const pad=90,c=mkC(w+pad*2,h+pad*2),g=c.getContext('2d'); g.translate((w+pad*2)/2,(h+pad*2)/2);
  const hue1=(variant*47)%360,hue2=(hue1+40)%360, cM=`hsl(${hue1},85%,42%)`,cD=`hsl(${hue1},80%,18%)`,cL=`hsl(${hue2},95%,65%)`;
  const au=g.createRadialGradient(0,0,10,0,0,w*0.95); au.addColorStop(0,`hsla(${hue1},100%,55%,.5)`); au.addColorStop(0.55,`hsla(${hue1},100%,45%,.22)`); au.addColorStop(1,`hsla(${hue1},100%,40%,0)`);
  g.fillStyle=au;g.beginPath();g.arc(0,0,w*0.95,0,Math.PI*2);g.fill();
  const hw=w/2,hh=h/2;
  const shape=()=>{
    g.beginPath();
    switch(variant%8){
      case 0:g.moveTo(-hw,-hh);g.lineTo(hw,-hh);g.lineTo(hw+30,0);g.lineTo(hw,hh);g.lineTo(-hw,hh);g.lineTo(-hw-30,0);break;
      case 1:g.moveTo(0,-hh-10);g.lineTo(hw+25,0);g.lineTo(0,hh+10);g.lineTo(-hw-25,0);break;
      case 2:g.moveTo(-hw,-hh);g.lineTo(hw,-hh);g.lineTo(hw-20,hh);g.lineTo(0,hh+22);g.lineTo(-hw+20,hh);break;
      case 3:{const s=Math.min(w,h)*0.32;g.moveTo(-hw,-s);g.lineTo(-s,-s);g.lineTo(-s,-hh);g.lineTo(s,-hh);g.lineTo(s,-s);g.lineTo(hw,-s);g.lineTo(hw,s);g.lineTo(s,s);g.lineTo(s,hh);g.lineTo(-s,hh);g.lineTo(-s,s);g.lineTo(-hw,s);}break;
      case 4:g.moveTo(-hw,-hh+18);g.lineTo(-hw*0.6,-hh-8);g.lineTo(-hw*0.3,-hh+4);g.lineTo(0,-hh-18);g.lineTo(hw*0.3,-hh+4);g.lineTo(hw*0.6,-hh-8);g.lineTo(hw,-hh+18);g.lineTo(hw*0.7,hh);g.lineTo(0,hh+14);g.lineTo(-hw*0.7,hh);break;
      case 5:g.moveTo(-hw*1.15,-hh*0.4);g.lineTo(-hw*0.5,-hh);g.lineTo(0,-hh*0.5);g.lineTo(hw*0.5,-hh);g.lineTo(hw*1.15,-hh*0.4);g.lineTo(hw*0.7,hh*0.6);g.lineTo(hw*0.2,hh);g.lineTo(-hw*0.2,hh);g.lineTo(-hw*0.7,hh*0.6);break;
      case 6:g.moveTo(-hw*0.55,-hh);g.lineTo(hw*0.55,-hh);g.lineTo(hw,-hh*0.55);g.lineTo(hw,hh*0.55);g.lineTo(hw*0.55,hh);g.lineTo(-hw*0.55,hh);g.lineTo(-hw,hh*0.55);g.lineTo(-hw,-hh*0.55);break;
      case 7:{const sp=10;for(let i=0;i<sp*2;i++){const a=(Math.PI/sp)*i-Math.PI/2;const r=(i%2===0)?Math.min(hw,hh)*1.3:Math.min(hw,hh)*0.8;const px=Math.cos(a)*r,py=Math.sin(a)*r*0.75;i?g.lineTo(px,py):g.moveTo(px,py);}}break;
    }
    g.closePath();
  };
  shape();g.lineWidth=14;g.strokeStyle=`hsla(${hue1},100%,55%,.2)`;g.stroke();
  shape();g.lineWidth=6;g.strokeStyle=`hsla(${hue1},100%,65%,.55)`;g.stroke();
  shape();const gr=g.createLinearGradient(0,-hh,0,hh); gr.addColorStop(0,cD);gr.addColorStop(0.5,cM);gr.addColorStop(1,cD);
  g.fillStyle=gr;g.fill();g.lineWidth=3;g.strokeStyle=cL;shape();g.stroke();
  g.save();shape();g.clip(); g.strokeStyle=`hsla(${hue2},100%,80%,.28)`;g.lineWidth=1.2;
  for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(-hw,i*hh*0.35);g.lineTo(hw,i*hh*0.35);g.stroke();}
  for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(i*hw*0.4,-hh);g.lineTo(i*hw*0.4,hh);g.stroke();}
  g.fillStyle=`hsla(${hue2},100%,85%,.5)`;
  for(let i=-2;i<=2;i++)for(let j=-1;j<=1;j++){g.beginPath();g.arc(i*hw*0.35,j*hh*0.5,2.2,0,Math.PI*2);g.fill();}
  g.restore();
  const coreR=Math.min(hw,hh)*0.32; const core=g.createRadialGradient(0,0,1,0,0,coreR*1.8); core.addColorStop(0,'#fff');core.addColorStop(0.3,cL); core.addColorStop(0.7,`hsl(${hue1},100%,55%)`);core.addColorStop(1,`hsla(${hue1},100%,40%,0)`);
  g.fillStyle=core;g.beginPath();g.arc(0,0,coreR*1.8,0,Math.PI*2);g.fill();
  g.strokeStyle=`hsla(${hue2},100%,90%,.85)`;g.lineWidth=2; g.beginPath();g.arc(0,0,coreR,0,Math.PI*2);g.stroke();
  g.strokeStyle=cL;g.lineWidth=1.6; for(let i=0;i<8;i++){const a=(Math.PI/4)*i;g.beginPath();g.moveTo(Math.cos(a)*coreR,Math.sin(a)*coreR);g.lineTo(Math.cos(a)*(coreR+8),Math.sin(a)*(coreR+8));g.stroke();}
  return c;
}

function burst(x,y,color,n,spd){
  if(G.particles.length>=G.MAX_PARTICLES)n=Math.max(1,n>>1);
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,s=Math.random()*spd+40; G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.35,.8),max:.8,color,r:rnd(1.4,3.4)}); }
}
function shockwave(x,y,color,rMax){G.shockwaves.push({x,y,color,r:4,rMax,life:1,max:1});}
function floatText(x,y,txt,color){G.floatTexts.push({x,y,txt,color,life:1.1,max:1.1});}

let msgTimer=null;
function showMessage(txt,dur=1600){
  const el=document.getElementById('message'); el.textContent=txt;el.classList.add('show');
  clearTimeout(msgTimer); msgTimer=setTimeout(()=>el.classList.remove('show'),dur);
}

function onDown(e){
  if(G.over||G.inLobby||!G.running)return;
  const t=e.touches?e.touches[0]:e;
  G.touch.active=true;G.touch.x=t.clientX;G.touch.y=t.clientY;
  if(Math.abs(player.x-t.clientX)>40)player.x=t.clientX;
  if(e.cancelable)e.preventDefault();
}
function onMove(e){
  if(!G.touch.active||G.over||G.inLobby||!G.running)return;
  const t=e.touches?e.touches[0]:e;
  G.touch.x=t.clientX;G.touch.y=t.clientY; player.x=t.clientX; player.y+=(Math.min(t.clientY,H-60)-player.y)*0.25;
  if(e.cancelable)e.preventDefault();
}
const onUp=()=>G.touch.active=false;
cv.addEventListener('touchstart',onDown,{passive:false}); cv.addEventListener('touchmove',onMove,{passive:false});
cv.addEventListener('touchend',onUp); cv.addEventListener('touchcancel',onUp); cv.addEventListener('mousedown',onDown);
addEventListener('mousemove',e=>{if(G.touch.active)onMove(e);}); addEventListener('mouseup',onUp);

addEventListener('keydown',e=>{ if(e.code==='ArrowLeft'||e.code==='KeyA')G.keysLeft=true; if(e.code==='ArrowRight'||e.code==='KeyD')G.keysRight=true; if(e.code==='Space')G.keysFire=true; });
addEventListener('keyup',e=>{ if(e.code==='ArrowLeft'||e.code==='KeyA')G.keysLeft=false; if(e.code==='ArrowRight'||e.code==='KeyD')G.keysRight=false; if(e.code==='Space')G.keysFire=false; });

  document.getElementById(id).classList.add('active'); 
}

tabs[0].addEventListener('click',()=>{
  setTab('tabGame');
  closeAllOverlays();
  // اگر در لابی بودیم، لابی را نمایش بده
  if(G.inLobby){
    lobbyEl.classList.remove('hidden');
    uiEl.classList.remove('show');
    G.running=false;
  } else if (G.over) {
    lobbyEl.classList.remove('hidden');
    uiEl.classList.remove('show');
  } else {
    // اگر وسط بازی بودیم، بازی ادامه پیدا کند
    G.running=true;
  }
});

tabs[1].addEventListener('click',()=>{
  setTab('tabShop');
  simpleModal.classList.remove('show');
  shopPanel.classList.add('show');
  G.running=false;
  renderShop();
});

tabs[2].addEventListener('click',()=>{
  setTab('tabRank');
  shopPanel.classList.remove('show');
  showSimpleModal('🏆 رتبه بندی');
});

tabs[3].addEventListener('click',()=>{
  setTab('tabProfile');
  shopPanel.classList.remove('show');
  showSimpleModal('👤 پروفایل');
});

document.getElementById('startBtn').addEventListener('click',()=>{
  lobbyEl.classList.add('hidden'); G.inLobby=false;G.running=true;
  tabsEl.classList.add('active'); uiEl.classList.add('show'); startGame();
});
['lobbyShop','lobbyRank','lobbyProfile'].forEach((id,i)=>{
  document.getElementById(id).addEventListener('click',()=>{
    lobbyEl.classList.add('hidden');
    tabsEl.classList.add('active'); 
    if (i===0) tabs[1].click();
    else if (i===1) tabs[2].click();
    else tabs[3].click();
  });
});

const gameOverEl=document.getElementById('gameOver');
const goScoreEl=document.getElementById('goScore');
const goRewardEl=document.getElementById('goReward');
const restartBtn=document.getElementById('restartBtn');

function startGame(){
  G.running=true;G.over=false; G.score=0;G.lives=3;G.runCoins=0;
  G.time=0;G.spawnTimer=0.4;G.spawnInterval=1.15; G.bossPhase=false;G.boss=null;G.nextBossScore=1000;
  G.bullets=[];G.miniBullets=[];G.enemies=[];G.enemyBullets=[];
  G.particles=[];G.floatTexts=[];G.shockwaves=[]; G.fireCooldown=0;G.miniFireCooldown=0;
  G.shake=0;G.flash=0;G.enemyPassCooldown=0; G.touch.active=false; resetPlayer();updateUI();
  gameOverEl.classList.remove('show'); showMessage('🚀 بازی شروع شد',1800);
}

function endGame(){
  G.running=false;G.over=true;
  const reward=G.runCoins; store.coins+=reward;
  if(G.score>store.record)store.record=G.score; updateUI();
  goScoreEl.textContent=G.score; goRewardEl.textContent='+'+reward;
  gameOverEl.classList.add('show');
  setTimeout(()=>{
    gameOverEl.classList.remove('show'); lobbyEl.classList.remove('hidden');
    G.inLobby=true;tabsEl.classList.remove('active');uiEl.classList.remove('show'); setTab('tabGame');
  },3500);
}
restartBtn.addEventListener('click',()=>{gameOverEl.classList.remove('show');startGame();});

function addEnemyKill(e){
  burst(e.x,e.y,'#ff5d8f',14,260); shockwave(e.x,e.y,'#ff5d8f',e.r*2.2);
  G.score+=30;store.coins+=3;G.runCoins+=3; floatText(e.x,e.y,'+30','#7ef0ff'); floatText(e.x,e.y-20,'+3💰','#ffe066');
  updateUI();checkBossTrigger();
}

function update(dt){
  G.time+=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*3);
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt*3.5);
  if(player.hitCooldown>0)player.hitCooldown-=dt;
  if(G.enemyPassCooldown>0)G.enemyPassCooldown-=dt;

  if(G.keysLeft)player.x-=520*dt; if(G.keysRight)player.x+=520*dt;
  player.x=clamp(player.x,60,W-60); player.y=clamp(player.y,H*0.35,H-60);

  if(G.fireCooldown>0)G.fireCooldown-=dt; if(G.miniFireCooldown>0)G.miniFireCooldown-=dt;
  if(G.touch.active||G.keysFire)shoot();
  for(const m of minis){ m.fireTimer-=dt; if(m.fireTimer<=0){m.fireTimer=0.42;shootMini(m);} }

  for(let i=G.bullets.length-1;i>=0;i--){G.bullets[i].y+=G.bullets[i].vy*dt;if(G.bullets[i].y<-20)G.bullets.splice(i,1);}
  for(let i=G.miniBullets.length-1;i>=0;i--){G.miniBullets[i].y+=G.miniBullets[i].vy*dt;if(G.miniBullets[i].y<-20)G.miniBullets.splice(i,1);}

  if(!G.bossPhase){
    G.spawnTimer-=dt;
    if(G.spawnTimer<=0){ spawnEnemy(); G.spawnTimer=Math.max(0.22,G.spawnInterval-G.time*0.02); }
  }

  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i]; e.y+=e.vy*dt;e.x+=e.vx*dt;
    if(e.x<e.r){e.x=e.r;e.vx*=-1;} if(e.x>W-e.r){e.x=W-e.r;e.vx*=-1;}
    e.rot+=e.rotSpeed*dt;
    if(e.y-e.r>H){
      G.enemies.splice(i,1);
      if(!G.over&&G.enemyPassCooldown<=0){
        G.enemyPassCooldown=0.4; player.hitCooldown=Math.max(player.hitCooldown,0.6);
        G.shake=1.0;G.flash=0.7; G.lives--;updateUI(); showMessage('❌ دشمن رد شد!',800);
        if(G.lives<=0){G.lives=0;setTimeout(endGame,320);}
      }
    }
  }

  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i];
    for(let j=G.enemies.length-1;j>=0;j--){
      const e=G.enemies[j]; const dx=b.x-e.x,dy=b.y-e.y;
      if(dx*dx+dy*dy<(b.r+e.r)*(b.r+e.r)){ addEnemyKill(e); G.enemies.splice(j,1); G.bullets.splice(i,1); break; }
    }
  }
  for(let i=G.miniBullets.length-1;i>=0;i--){
    const b=G.miniBullets[i];
    for(let j=G.enemies.length-1;j>=0;j--){
      const e=G.enemies[j]; const dx=b.x-e.x,dy=b.y-e.y;
      if(dx*dx+dy*dy<(b.r+e.r)*(b.r+e.r)){ addEnemyKill(e); G.enemies.splice(j,1); G.miniBullets.splice(i,1); break; }
    }
  }

  if(G.boss){
    const bs=G.boss; bs.t+=dt;
    if(bs.entering){ bs.y+=160*dt; if(bs.y>=bs.targetY){bs.y=bs.targetY;bs.entering=false;} }
    else {
      const prev=bs.dir; bs.x+=bs.dir*bs.speed*dt; let wall=false;
      if(bs.x>W-bs.w/2-10){bs.x=W-bs.w/2-10;bs.dir=-1;wall=true;}
      if(bs.x<bs.w/2+10){bs.x=bs.w/2+10;bs.dir=1;wall=true;}
      if(wall&&prev!==bs.dir){ bs.volleyCount++; const n=3+(bs.volleyCount-1)*2; fireBossSpread(bs,Math.min(n,21)); }
    }
    const hitBoss=(b)=>{
      if(b.x>bs.x-bs.w/2&&b.x<bs.x+bs.w/2&&b.y>bs.y-bs.h/2&&b.y<bs.y+bs.h/2){
        burst(b.x,b.y,'#ffd84d',5,220); bs.hp-=b.dmg; if(bs.hp<=0)defeatBoss(); return true;
      }
      return false;
    };
    for(let i=G.bullets.length-1;i>=0;i--)if(hitBoss(G.bullets[i]))G.bullets.splice(i,1);
    for(let i=G.miniBullets.length-1;i>=0;i--)if(hitBoss(G.miniBullets[i]))G.miniBullets.splice(i,1);
  }

  function defeatBoss(){
    const bs=G.boss;if(!bs)return;
    burst(bs.x,bs.y,'#ff7b00',44,460); burst(bs.x,bs.y,'#ffe066',34,360); shockwave(bs.x,bs.y,'#ffd84d',bs.w*1.2);
    G.shake=1.3;G.flash=1; G.score+=100;store.coins+=30;G.runCoins+=30;
    floatText(bs.x,bs.y,'+100','#7ef0ff'); floatText(bs.x,bs.y-25,'+30💰','#ffe066');
    G.boss=null;G.bossPhase=false; updateUI();showMessage('🌊 موج بعدی'); checkBossTrigger();
  }

  function fireBossSpread(bs,n){
    const spread=Math.PI*0.55,start=-spread/2; const step=n>1?spread/(n-1):0;
    for(let k=0;k<n;k++){ const ang=start+k*step+Math.PI/2,speed=260; G.enemyBullets.push({x:bs.x,y:bs.y+bs.h/2-6,r:6,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed}); }
  }

  for(let i=G.enemyBullets.length-1;i>=0;i--){
    const b=G.enemyBullets[i]; b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y>H+20||b.x<-20||b.x>W+20||b.y<-20){G.enemyBullets.splice(i,1);continue;}
    if(!G.over&&player.hitCooldown<=0){
      const dx=b.x-player.x,dy=b.y-player.y,hitR=16*player.scale;
      if(dx*dx+dy*dy<(b.r+hitR)*(b.r+hitR)){G.enemyBullets.splice(i,1);hitPlayer(b.x,b.y);}
    }
  }

  if(!G.over&&player.hitCooldown<=0){
    for(let i=G.enemies.length-1;i>=0;i--){
      const e=G.enemies[i]; const dx=e.x-player.x,dy=e.y-player.y,hitR=16*player.scale;
      if(Math.abs(dx)<e.r+hitR&&Math.abs(dy)<e.r+hitR){
        G.enemies.splice(i,1);G.lives--;player.hitCooldown=1.0; updateUI();
        if(G.lives<=0){G.lives=0;setTimeout(endGame,260);} break;
      }
    }
  }

  for(let i=G.particles.length-1;i>=0;i--){ const p=G.particles[i]; p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.94;p.vy*=0.94;p.life-=dt; if(p.life<=0)G.particles.splice(i,1); }
  for(let i=G.shockwaves.length-1;i>=0;i--){ const w=G.shockwaves[i]; w.r+=(w.rMax-w.r)*dt*6;w.life-=dt; if(w.life<=0)G.shockwaves.splice(i,1); }
  for(let i=G.floatTexts.length-1;i>=0;i--){ const f=G.floatTexts[i]; f.y-=50*dt;f.life-=dt; if(f.life<=0)G.floatTexts.splice(i,1); }
  for(const st of G.stars){ st.y+=st.s*dt; if(st.y>H+4){st.y=-4;st.x=Math.random()*W;} }
}

function checkBossTrigger(){ if(!G.bossPhase&&G.score>=G.nextBossScore){G.nextBossScore+=1000;spawnBoss();} }

function hitPlayer(hx,hy){
  G.shake=1.4;G.flash=0.9;
  const ix=hx!==undefined?hx:player.x,iy=hy!==undefined?hy:player.y;
  burst(ix,iy,'#ff3355',22,400); burst(ix,iy,'#ffd84d',14,340); burst(ix,iy,'#7ef0ff',10,260);
  shockwave(ix,iy,'#ff3355',Math.min(W,H)*0.35); shockwave(ix,iy,'#ffd84d',Math.min(W,H)*0.22);
  player.hitCooldown=1.2;G.lives--;updateUI(); if(G.lives<=0){G.lives=0;setTimeout(endGame,320);}
}

function drawSprite(cache,x,y,scale=1,alpha=1){
  if(!cache)return; if(alpha!==1)ctx.globalAlpha=alpha;
  const w=cache.width*scale,h=cache.height*scale; ctx.drawImage(cache,x-w/2,y-h/2,w,h);
  if(alpha!==1)ctx.globalAlpha=1;
}

function drawHex(e){
  const s=caches.hex.sprite,ratio=e.r/caches.hex.baseR; ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot);
  ctx.drawImage(s,-s.width*ratio/2,-s.height*ratio/2,s.width*ratio,s.height*ratio); ctx.restore();
}

function drawBoss(bs){
  const s=caches.boss;if(!s)return; ctx.save();ctx.translate(bs.x,bs.y);
  const pulse=1+Math.sin(bs.t*4)*0.08; ctx.drawImage(s,-s.width/2,-s.height/2); drawSprite(caches.coreGlow,0,0,pulse,0.9);
  ctx.save();ctx.rotate(bs.t*0.8); ctx.strokeStyle='rgba(255,220,120,.35)';ctx.lineWidth=1.5;
  for(let r=0;r<2;r++){ const rad=20+r*12+Math.sin(bs.t*2+r)*4; ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);ctx.stroke(); }
  ctx.restore();ctx.restore();
  const pct=Math.max(0,bs.hp/bs.maxHp); ctx.save();
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(W/2-140,44,280,12);
  const g2=ctx.createLinearGradient(W/2-140,0,W/2+140,0); g2.addColorStop(0,'#ff2b6d');g2.addColorStop(1,'#ffd84d');
  ctx.fillStyle=g2;ctx.fillRect(W/2-140,44,280*pct,12); ctx.strokeStyle='#ff4d7d';ctx.lineWidth=1.5;ctx.strokeRect(W/2-140,44,280,12);
  ctx.restore();
}

function draw(){
  ctx.drawImage(caches.nebula,0,0,W,H);
  for(const s of G.stars){ const cache=caches.stars[s.layer]; const size=s.r*4; ctx.globalAlpha=s.a; ctx.drawImage(cache,s.x-size,s.y-size,size*2,size*2); } ctx.globalAlpha=1;
  if(G.flash>0){ctx.fillStyle=`rgba(255,60,90,${G.flash*0.28})`;ctx.fillRect(0,0,W,H);}

  ctx.save();
  if(G.shake>0){const m=G.shake*9;ctx.translate(rnd(-m,m),rnd(-m,m));}

  for(const w of G.shockwaves){ ctx.globalAlpha=w.life*0.7;ctx.strokeStyle=w.color;ctx.lineWidth=3; ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,Math.PI*2);ctx.stroke(); } ctx.globalAlpha=1;

  for(const p of G.particles){ const a=p.life/p.max; const cache=caches.particles[p.color]||caches.particles['#7ef0ff']; const sz=p.r*4*a; ctx.globalAlpha=a; ctx.drawImage(cache,p.x-sz,p.y-sz,sz*2,sz*2); } ctx.globalAlpha=1;

  for(const b of G.enemyBullets){
    ctx.globalAlpha=0.5; ctx.drawImage(caches.bulletGlow,b.x-22,b.y-22,44,44); ctx.globalAlpha=1;
    ctx.fillStyle='#ff5577'; ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath();ctx.arc(b.x-1,b.y-1,b.r*0.45,0,Math.PI*2);ctx.fill();
  }
  
  for(const b of G.bullets){
    ctx.globalAlpha=0.5; 
    ctx.shadowColor = b.color || '#38b6ff'; ctx.shadowBlur = 15;
    ctx.fillStyle=b.color || '#38b6ff'; 
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle='#fff'; ctx.beginPath();ctx.arc(b.x-1,b.y-1,b.r*0.5,0,Math.PI*2);ctx.fill();
  }
  
  for(const b of G.miniBullets){
    ctx.fillStyle='#ff8fa8'; ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffe4ec'; ctx.beginPath();ctx.arc(b.x,b.y-1,b.r*0.45,0,Math.PI*2);ctx.fill();
  }

  for(const e of G.enemies)drawHex(e);
  if(G.boss)drawBoss(G.boss);
  
  if(!G.over&&G.running&&!G.inLobby){
    const blink=player.hitCooldown>0&&Math.floor(player.hitCooldown*14)%2===0;
    drawSprite(caches.ship,player.x,player.y,1,blink?0.55:1);
    for(const m of minis){ drawSprite(caches.mini,player.x+m.offset*player.scale,player.y+8*player.scale,1,blink?0.55:1); }
  }

  ctx.textAlign='center'; ctx.font='700 16px Orbitron, Vazirmatn, sans-serif';
  for(const f of G.floatTexts){ ctx.globalAlpha=f.life/f.max; ctx.fillStyle=f.color; ctx.fillText(f.txt,f.x,f.y); }
  ctx.globalAlpha=1; ctx.restore();
}

let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(G.running&&!G.over&&!G.inLobby)update(dt);
  else{ for(const s of G.stars){ s.y+=s.s*dt*0.15; if(s.y>H){s.y=-4;s.x=Math.random()*W;} } }
  draw(); requestAnimationFrame(loop);
}

resize();resetPlayer();updateUI();requestAnimationFrame(loop);
</script>
