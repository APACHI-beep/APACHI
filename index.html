<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Space Fighter</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;overflow:hidden;
    font-family:Tahoma,Verdana,sans-serif;user-select:none;
    -webkit-user-select:none;-webkit-touch-callout:none;
    touch-action:none;overscroll-behavior:none}
  #game{position:fixed;inset:0;background:#000}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  .hud{position:absolute;top:0;left:0;right:0;
       padding:calc(8px + env(safe-area-inset-top)) 12px 0 12px;
       display:flex;justify-content:space-between;align-items:flex-start;
       pointer-events:none;z-index:5;color:#fff;
       text-shadow:0 0 8px rgba(0,200,255,.8)}
  .hud .left{text-align:left;direction:ltr;line-height:1.15}
  .hud .right{text-align:right}
  /* قلب‌های ایموجی واقعی گوشی */
  .hearts{
    font-size:26px;
    letter-spacing:2px;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    filter:drop-shadow(0 0 6px rgba(255,60,90,.85)) drop-shadow(0 0 14px rgba(255,0,50,.5));
    line-height:1;
  }
  .label{font-size:9px;opacity:.7;letter-spacing:1px}
  .score{font-size:18px;font-weight:bold;color:#7ef9ff}
  .record{font-size:12px;color:#ffd45e;margin-bottom:1px}
  .coins{font-size:15px;color:#ffe066;margin-top:2px;
    font-family:inherit,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

  #msg{position:absolute;inset:0;display:flex;align-items:center;
       justify-content:center;pointer-events:none;z-index:6;padding:0 16px}
  #msg span{font-size:clamp(26px,8vw,44px);font-weight:bold;color:#fff;opacity:0;
       letter-spacing:2px;text-align:center;
       text-shadow:0 0 18px #00d4ff,0 0 40px #0088ff,0 0 80px #0044ff;
       transition:opacity .35s, transform .35s;transform:scale(.8)}
  #msg span.show{opacity:1;transform:scale(1)}

  #start{position:absolute;inset:0;z-index:10;display:flex;
    flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,#061a2e 0%,#000 70%);
    color:#fff;padding:20px;text-align:center}
  #start h1{font-size:clamp(28px,9vw,46px);letter-spacing:4px;margin-bottom:8px;
    color:#7ef9ff;text-shadow:0 0 20px #00c8ff,0 0 60px #0066ff}
  #start p{opacity:.65;margin-bottom:26px;font-size:12px;line-height:1.7;max-width:340px}
  #start button{cursor:pointer;font-family:inherit;font-size:clamp(16px,5vw,20px);
    padding:13px 44px;border-radius:40px;border:2px solid #00d4ff;
    background:rgba(0,180,255,.08);color:#7ef9ff;letter-spacing:2px;
    box-shadow:0 0 25px rgba(0,180,255,.5),inset 0 0 25px rgba(0,180,255,.15);
    transition:.2s;touch-action:manipulation}
  #start button:active{transform:scale(.96);background:rgba(0,180,255,.25)}
  #start .stats{margin-top:28px;font-size:13px;color:#ffe066;opacity:.9;line-height:1.8}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div class="hud">
    <div class="left">
      <div class="label">RECORD</div>
      <div class="record" id="record">0</div>
      <div class="label" style="margin-top:4px">SCORE</div>
      <div class="score" id="score">0</div>
      <div class="coins" id="coins">💰 0</div>
    </div>
    <div class="right">
      <div class="hearts" id="hearts"></div>
    </div>
  </div>

  <div id="msg"><span id="msgText"></span></div>

  <div id="start">
    <h1>SPACE FIGHTER</h1>
    <p>انگشتت را روی صفحه بکش تا سفینه حرکت کند — شلیک خودکار است</p>
    <button id="startBtn">شروع بازی</button>
    <div class="stats" id="startStats"></div>
  </div>
</div>

<script>
/* ============================================================
   ذخیره‌سازی دائمی
============================================================ */
const SAVE = {
  get(k, d){ try{ const v = localStorage.getItem('sf_'+k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('sf_'+k, JSON.stringify(v)); }catch(e){} }
};
let totalCoins = SAVE.get('coins', 0);
let bestRecord = SAVE.get('record', 0);

/* ============================================================
   تنظیمات پایه
============================================================ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
let isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=> setTimeout(resize, 200));
resize();

/* ============================================================
   وضعیت بازی
============================================================ */
const state = {
  running: false,
  over: false,
  score: 0,
  sessionCoins: 0,
  lives: 3,
  enemies: [],
  bullets: [],
  bossBullets: [],
  particles: [],
  stars: [],
  boss: null,
  bossActive: false,
  nextBossScore: 1000,
  wave: 1,
  spawnTimer: 0,
  spawnInterval: 1.05,
  shootTimer: 0,
  shootInterval: 0.16,
  lastTime: 0,
  shake: 0,
  time: 0
};

const player = {
  x: 0, y: 0, w: 74, h: 62,
  targetX: 0, targetY: 0,
  alive: true,
  invuln: 0
};

function playerScale(){ return Math.max(0.7, Math.min(1, W / 480)); }

/* ============================================================
   ستاره‌ها
============================================================ */
function makeStars(){
  state.stars = [];
  const count = Math.floor((W*H)/7000);
  for(let i=0;i<count;i++){
    state.stars.push({
      x: Math.random()*W,
      y: Math.random()*H,
      r: Math.random()*1.6 + .3,
      s: Math.random()*22 + 6,
      a: Math.random()*.7 + .25,
      tw: Math.random()*Math.PI*2
    });
  }
}
makeStars();

/* ============================================================
   ورودی
============================================================ */
let pointerActive = false;
let pointerX = null, pointerY = null;
let touchOffsetX = 0, touchOffsetY = 0;

function getPoint(e){
  if(e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if(e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

cv.addEventListener('mousemove', e=>{
  if(isMobile) return;
  pointerX = e.clientX; pointerY = e.clientY;
  pointerActive = true;
});

cv.addEventListener('touchstart', e=>{
  const p = getPoint(e);
  pointerX = p.x; pointerY = p.y;
  touchOffsetX = player.x - p.x;
  touchOffsetY = player.y - p.y;
  pointerActive = true;
  e.preventDefault();
}, {passive:false});

cv.addEventListener('touchmove', e=>{
  const p = getPoint(e);
  pointerX = p.x; pointerY = p.y;
  e.preventDefault();
}, {passive:false});

cv.addEventListener('touchend', e=> e.preventDefault(), {passive:false});

const keys = {};
addEventListener('keydown', e=>{
  keys[e.key] = true;
  if(e.key === ' ') e.preventDefault();
});
addEventListener('keyup', e=> keys[e.key] = false);

/* ============================================================
   ابزارها
============================================================ */
const rand = (a,b)=> a + Math.random()*(b-a);
const dist2 = (a,b,c,d)=> (a-c)**2 + (b-d)**2;

function spawnParticles(x, y, n, color, speed=180, life=.7, size=3){
  for(let i=0;i<n;i++){
    const ang = Math.random()*Math.PI*2;
    const sp = Math.random()*speed + 30;
    state.particles.push({
      x, y,
      vx: Math.cos(ang)*sp,
      vy: Math.sin(ang)*sp,
      life, maxLife: life,
      color, size: Math.random()*size + 1
    });
  }
}

/* ============================================================
   پیام
============================================================ */
const msgEl = document.getElementById('msgText');
let msgTimer = 0;
function showMessage(text, dur=1.6){
  msgEl.textContent = text;
  msgEl.classList.add('show');
  msgTimer = dur;
}

/* ============================================================
   HUD — قلب‌های ایموجی
============================================================ */
const heartsEl  = document.getElementById('hearts');
const scoreEl   = document.getElementById('score');
const recordEl  = document.getElementById('record');
const coinsEl   = document.getElementById('coins');

function updateHUD(){
  // قلب‌های ایموجی واقعی گوشی
  let h = '';
  for(let i=0;i<Math.max(0,state.lives);i++) h += '❤️';
  heartsEl.textContent = h;

  scoreEl.textContent  = state.score;
  recordEl.textContent = bestRecord;
  coinsEl.textContent  = '💰 ' + (totalCoins + state.sessionCoins);
}

/* ============================================================
   شلیک بازیکن
============================================================ */
function playerShoot(){
  const s = playerScale();
  const bx = player.x;
  const by = player.y - player.h*s/2;
  state.bullets.push({ x: bx, y: by, r: 5, vy: -820, vx: 0 });
  spawnParticles(bx, by, 3, '#7ef9ff', 90, .25, 2);
}

/* ============================================================
   دشمن
============================================================ */
function spawnEnemy(){
  const s = playerScale();
  const r = rand(15, 24) * s;
  const speedBoost = 1 + (state.wave - 1) * 0.15;
  state.enemies.push({
    x: rand(r+10, W-r-10),
    y: -r-20,
    r,
    vy: (rand(65, 110) + state.wave*4) * speedBoost,
    vx: rand(-35, 35) * speedBoost,
    rot: rand(0, Math.PI*2),
    vrot: rand(-1.6, 1.6),
    hp: 1,
    hitFlash: 0
  });
}

/* ============================================================
   باس
============================================================ */
const BOSS_TYPES = [
  { color:'#ff4dff', glow:'rgba(255,60,220,.3)', hpBase:22, speedBase:70 },
  { color:'#ff8a3d', glow:'rgba(255,140,60,.3)', hpBase:28, speedBase:85 },
  { color:'#4dff88', glow:'rgba(70,255,140,.3)', hpBase:34, speedBase:100 },
  { color:'#4d9dff', glow:'rgba(70,150,255,.3)', hpBase:40, speedBase:115 }
];

function spawnBoss(){
  state.bossActive = true;
  const waveIdx = (state.wave - 1);
  const type = BOSS_TYPES[waveIdx % BOSS_TYPES.length];
  const scale = playerScale();
  const w = 220 * scale;
  const h = 110 * scale;
  const speedBoost = 1 + (state.wave - 1) * 0.12;

  state.boss = {
    x: W/2,
    y: -h - 40,
    w, h,
    vx: type.speedBase * speedBoost,
    dir: 1,
    hp: type.hpBase + (state.wave - 1) * 4,
    maxHp: type.hpBase + (state.wave - 1) * 4,
    entering: true,
    shootStage: 0,
    shootTimer: 1.6,
    cycles: 0,
    hitFlash: 0,
    t: 0,
    typeIndex: waveIdx % BOSS_TYPES.length,
    color: type.color,
    glow: type.glow,
    speedBoost
  };
  showMessage('باس وارد شد!', 2.2);
}

function bossShoot(){
  const b = state.boss;
  if(!b) return;
  const counts = [3, 5, 7];
  const n = counts[b.shootStage % 3];
  const originX = b.x;
  const originY = b.y + b.h/2 - 8;
  const baseAng = Math.atan2(player.y - originY, player.x - originX);
  const spread = 0.5;
  const bulletSpeed = 230 * (1 + (state.wave-1)*0.06);

  for(let i=0;i<n;i++){
    const t = n===1? 0 : (i/(n-1) - .5);
    const ang = baseAng + t*spread;
    state.bossBullets.push({
      x: originX, y: originY,
      vx: Math.cos(ang)*bulletSpeed,
      vy: Math.sin(ang)*bulletSpeed,
      r: 8,
      color: b.color,
      trail: []
    });
  }
  b.shootStage++;
  spawnParticles(originX, originY, 14, b.color, 200, .4, 3);
}

/* ============================================================
   شروع
============================================================ */
function startGame(){
  state.running = true;
  state.over = false;
  state.score = 0;
  state.sessionCoins = 0;
  state.lives = 3;
  state.enemies.length = 0;
  state.bullets.length = 0;
  state.bossBullets.length = 0;
  state.particles.length = 0;
  state.boss = null;
  state.bossActive = false;
  state.nextBossScore = 1000;
  state.wave = 1;
  state.spawnTimer = 0;
  state.shootTimer = 0;
  state.shake = 0;

  const s = playerScale();
  player.x = W/2;
  player.y = H - 110*s;
  player.targetX = player.x;
  player.targetY = player.y;
  player.alive = true;
  player.invuln = 0;

  pointerActive = false;
  pointerX = null; pointerY = null;

  updateHUD();
  msgEl.classList.remove('show');
  document.getElementById('start').style.display = 'none';
}

/* ============================================================
   پایان
============================================================ */
function endGame(){
  state.running = false;
  state.over = true;

  if(state.score > bestRecord){
    bestRecord = state.score;
    SAVE.set('record', bestRecord);
  }
  totalCoins += state.sessionCoins;
  SAVE.set('coins', totalCoins);
  state.sessionCoins = 0;
  updateHUD();

  const s = document.getElementById('start');
  s.style.display = 'flex';
  s.querySelector('h1').textContent = 'GAME OVER';
  s.querySelector('button').textContent = 'دوباره بازی کن';
  document.getElementById('startStats').innerHTML =
    `امتیاز: ${state.score}<br>رکورد: ${bestRecord}<br>💰 ${totalCoins}`;
}

/* ============================================================
   به‌روزرسانی
============================================================ */
function update(dt){
  state.time += dt;
  if(msgTimer > 0){
    msgTimer -= dt;
    if(msgTimer <= 0) msgEl.classList.remove('show');
  }
  if(state.shake > 0) state.shake = Math.max(0, state.shake - dt*60);
  if(player.invuln > 0) player.invuln -= dt;

  for(const s of state.stars){
    s.y += s.s * dt * .55;
    s.tw += dt*3;
    if(s.y > H + 3){ s.y = -3; s.x = Math.random()*W; }
  }

  if(!state.running) return;

  const s = playerScale();
  player.w = 74 * s;
  player.h = 62 * s;

  const speedKeys = 780;
  let kx = 0, ky = 0;
  if(keys['ArrowLeft'] || keys['a'] || keys['A']) kx -= 1;
  if(keys['ArrowRight']|| keys['d'] || keys['D']) kx += 1;
  if(keys['ArrowUp']   || keys['w'] || keys['W']) ky -= 1;
  if(keys['ArrowDown'] || keys['s'] || keys['S']) ky += 1;

  if(kx || ky){
    const len = Math.hypot(kx,ky) || 1;
    player.targetX = Math.max(player.w/2, Math.min(W-player.w/2, player.targetX + kx/len*speedKeys*dt));
    player.targetY = Math.max(player.h/2, Math.min(H-player.h/2, player.targetY + ky/len*speedKeys*dt));
  } else if(pointerActive && pointerX !== null){
    if(isMobile){
      player.targetX = Math.max(player.w/2, Math.min(W-player.w/2, pointerX + touchOffsetX));
      player.targetY = Math.max(player.h/2, Math.min(H-player.h/2, pointerY + touchOffsetY));
    } else {
      player.targetX = Math.max(player.w/2, Math.min(W-player.w/2, pointerX));
      player.targetY = Math.max(player.h/2, Math.min(H-player.h/2, pointerY));
    }
  }
  player.x += (player.targetX - player.x) * Math.min(1, dt*16);
  player.y += (player.targetY - player.y) * Math.min(1, dt*16);

  state.shootTimer -= dt;
  if(state.shootTimer <= 0 && player.alive){
    state.shootTimer = state.shootInterval;
    playerShoot();
  }

  if(!state.bossActive){
    state.spawnTimer -= dt;
    if(state.spawnTimer <= 0){
      state.spawnTimer = Math.max(.35, state.spawnInterval - state.wave*0.035);
      spawnEnemy();
      if(Math.random() < .28 + state.wave*0.015) spawnEnemy();
    }
  }

  if(!state.bossActive && state.score >= state.nextBossScore){
    spawnBoss();
  }
  if(state.bossActive && state.boss) updateBoss(dt);

  /* تیرهای بازیکن */
  for(let i=state.bullets.length-1;i>=0;i--){
    const b = state.bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.y < -20 || b.x < -20 || b.x > W+20){ state.bullets.splice(i,1); continue; }

    let removed = false;
    for(let j=state.enemies.length-1;j>=0;j--){
      const e = state.enemies[j];
      if(dist2(b.x,b.y,e.x,e.y) < (e.r + b.r)**2){
        state.enemies.splice(j,1);
        state.bullets.splice(i,1);
        spawnParticles(e.x, e.y, 16, '#00e5ff', 220, .55, 3);
        addScore(30);
        addCoins(3);
        state.shake = Math.max(state.shake, 3);
        removed = true;
        break;
      }
    }
    if(removed) continue;

    if(state.bossActive && state.boss && !state.boss.entering){
      const bs = state.boss;
      if(Math.abs(b.x - bs.x) < bs.w/2 && Math.abs(b.y - bs.y) < bs.h/2){
        state.bullets.splice(i,1);
        bs.hp--;
        bs.hitFlash = .12;
        spawnParticles(b.x, b.y, 5, bs.color, 120, .3, 2);
        if(bs.hp <= 0) killBoss();
      }
    }
  }

  /* دشمن‌ها */
  for(let i=state.enemies.length-1;i>=0;i--){
    const e = state.enemies[i];
    e.y += e.vy*dt;
    e.x += e.vx*dt;
    e.rot += e.vrot*dt;
    if(e.hitFlash > 0) e.hitFlash -= dt;

    if(e.x < e.r){ e.x = e.r; e.vx = Math.abs(e.vx); }
    if(e.x > W-e.r){ e.x = W-e.r; e.vx = -Math.abs(e.vx); }

    if(player.alive && player.invuln <= 0 &&
       dist2(e.x,e.y,player.x,player.y) < (e.r + player.h*0.42)**2){
      state.enemies.splice(i,1);
      hitPlayer();
      continue;
    }
    if(e.y > H + e.r + 20) state.enemies.splice(i,1);
  }

  /* تیرهای باس */
  for(let i=state.bossBullets.length-1;i>=0;i--){
    const b = state.bossBullets[i];
    b.trail.push({x:b.x, y:b.y});
    if(b.trail.length > 7) b.trail.shift();
    b.x += b.vx*dt; b.y += b.vy*dt;

    if(b.x < -40 || b.x > W+40 || b.y < -40 || b.y > H+40){
      state.bossBullets.splice(i,1); continue;
    }
    if(player.alive && player.invuln <= 0 &&
       dist2(b.x,b.y,player.x,player.y) < (b.r + player.h*0.35)**2){
      state.bossBullets.splice(i,1);
      hitPlayer();
    }
  }

  for(let i=state.particles.length-1;i>=0;i--){
    const p = state.particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= (1 - 2.2*dt); p.vy *= (1 - 2.2*dt);
    p.life -= dt;
    if(p.life <= 0) state.particles.splice(i,1);
  }

  updateHUD();
}

function updateBoss(dt){
  const b = state.boss;
  b.t += dt;
  if(b.hitFlash > 0) b.hitFlash -= dt;

  if(b.entering){
    b.y += 130*dt;
    if(b.y >= 120 * playerScale()){ b.y = 120 * playerScale(); b.entering = false; }
    return;
  }

  b.x += b.vx * b.dir * dt;
  const margin = b.w/2 + 10;
  if(b.x > W - margin){ b.x = W - margin; b.dir = -1; bossShoot(); }
  if(b.x < margin){ b.x = margin; b.dir = 1; bossShoot(); }

  b.shootTimer -= dt;
  if(b.shootTimer <= 0){
    b.shootTimer = Math.max(1.0, 2.0 - b.cycles*0.06);
    bossShoot();
    b.cycles++;
  }

  if(player.alive && player.invuln <= 0 &&
     Math.abs(player.x - b.x) < b.w/2 + 10 &&
     Math.abs(player.y - b.y) < b.h/2 + 14){
    hitPlayer();
  }
}

function killBoss(){
  const b = state.boss;
  spawnParticles(b.x, b.y, 70, b.color, 420, 1.1, 5);
  spawnParticles(b.x, b.y, 40, '#ffffff', 300, .9, 4);
  state.boss = null;
  state.bossActive = false;
  state.shake = 18;
  addScore(100);
  state.wave++;
  state.nextBossScore += 1000;
  showMessage('موج بعدی', 1.8);
}

/* ============================================================
   ضربه به بازیکن — سفینه سر جای خودش می‌ماند
============================================================ */
function hitPlayer(){
  if(!player.alive || player.invuln > 0) return;
  state.lives--;
  state.shake = 14;
  player.invuln = 1.6;
  spawnParticles(player.x, player.y, 30, '#ff3355', 280, .8, 4);

  if(state.lives <= 0){
    player.alive = false;
    spawnParticles(player.x, player.y, 60, '#ffcc00', 380, 1.2, 5);
    state.running = false;
    state.over = true;
    if(state.score > bestRecord){ bestRecord = state.score; SAVE.set('record', bestRecord); }
    totalCoins += state.sessionCoins;
    SAVE.set('coins', totalCoins);
    state.sessionCoins = 0;
    updateHUD();
    setTimeout(()=>{
      const scr = document.getElementById('start');
      scr.style.display = 'flex';
      scr.querySelector('h1').textContent = 'GAME OVER';
      scr.querySelector('button').textContent = 'دوباره بازی کن';
      document.getElementById('startStats').innerHTML =
        `امتیاز: ${state.score}<br>رکورد: ${bestRecord}<br>💰 ${totalCoins}`;
    }, 700);
  }
  // سفینه جابجا نمی‌شود
}

function addScore(n){
  state.score += n;
  if(state.score > bestRecord){
    bestRecord = state.score;
    SAVE.set('record', bestRecord);
  }
}
function addCoins(n){ state.sessionCoins += n; }

/* ============================================================
   رسم
============================================================ */
function drawStars(){
  const shakeX = state.shake ? rand(-state.shake,state.shake) : 0;
  const shakeY = state.shake ? rand(-state.shake,state.shake) : 0;
  ctx.save();
  ctx.translate(shakeX, shakeY);
  for(const s of state.stars){
    const tw = .6 + .4*Math.sin(s.tw);
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${s.a*tw})`;
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
    if(s.r > 1.1){
      ctx.beginPath();
      ctx.fillStyle = `rgba(180,220,255,${s.a*tw*0.18})`;
      ctx.arc(s.x, s.y, s.r*2.6, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawPlayer(){
  if(!player.alive) return;
  const s = playerScale();
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.scale(s, s);

  if(player.invuln > 0){
    const blink = Math.floor(player.invuln * 12) % 2;
    ctx.globalAlpha = blink ? 0.35 : 1;
  }

  const g = ctx.createRadialGradient(0,0,4, 0,0,64);
  g.addColorStop(0,'rgba(0,200,255,.25)');
  g.addColorStop(1,'rgba(0,200,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,64,0,Math.PI*2); ctx.fill();

  const w = 74/2, h = 62/2;
  ctx.beginPath();
  ctx.moveTo(0, -h - 6);
  ctx.lineTo(w, h*0.55);
  ctx.lineTo(w*0.55, h*0.9);
  ctx.lineTo(w*0.16, h*0.55);
  ctx.lineTo(0, h + 16);
  ctx.lineTo(-w*0.16, h*0.55);
  ctx.lineTo(-w*0.55, h*0.9);
  ctx.lineTo(-w, h*0.55);
  ctx.closePath();

  const pg = ctx.createLinearGradient(0,-h,0,h);
  pg.addColorStop(0,'#d9f7ff');
  pg.addColorStop(.45,'#5fc8ea');
  pg.addColorStop(1,'#12304a');
  ctx.fillStyle = pg;
  ctx.shadowColor = '#3ad4ff';
  ctx.shadowBlur = 22;
  ctx.fill();

  ctx.lineWidth = 1.6;
  ctx.strokeStyle = 'rgba(180,245,255,.95)';
  ctx.shadowBlur = 10;
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(0,60,90,.55)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,-h*0.5); ctx.lineTo(0,h*0.4); ctx.stroke();

  const fl = 6 + Math.random()*7;
  const eg = ctx.createLinearGradient(0,h,0,h+fl*2);
  eg.addColorStop(0,'rgba(120,240,255,.9)');
  eg.addColorStop(1,'rgba(0,120,255,0)');
  ctx.fillStyle = eg;
  ctx.beginPath();
  ctx.moveTo(-7, h*0.35); ctx.lineTo(7, h*0.35);
  ctx.lineTo(0, h + fl*2);
  ctx.closePath(); ctx.fill();

  ctx.restore();
}

function drawHexagon(x, y, r, rot, flash){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a = Math.PI/3*i - Math.PI/2;
    const px = Math.cos(a)*r, py = Math.sin(a)*r;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.lineWidth = 2.4;
  if(flash > 0){
    ctx.strokeStyle = '#ffffff';
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fill();
  } else {
    ctx.strokeStyle = '#3ff5d0';
    ctx.shadowColor = '#3ff5d0';
    ctx.shadowBlur = 16;
  }
  ctx.stroke();
  ctx.restore();
}

function drawEnemies(){
  for(const e of state.enemies) drawHexagon(e.x, e.y, e.r, e.rot, e.hitFlash);
}

function drawBullets(){
  for(const b of state.bullets){
    const g = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*3);
    g.addColorStop(0,'#ffffff');
    g.addColorStop(.35,'#8ef7ff');
    g.addColorStop(1,'rgba(0,180,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*3,0,Math.PI*2); ctx.fill();

    ctx.beginPath();
    ctx.fillStyle = '#eaffff';
    ctx.shadowColor = '#4de3ff';
    ctx.shadowBlur = 14;
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawBossBullets(){
  for(const b of state.bossBullets){
    for(let i=0;i<b.trail.length;i++){
      const t = b.trail[i];
      const a = (i / b.trail.length) * .45;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,80,230,${a})`;
      ctx.arc(t.x, t.y, b.r*(i/b.trail.length)*0.9, 0, Math.PI*2);
      ctx.fill();
    }
    const g = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*4);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(.25, b.color);
    g.addColorStop(1,'rgba(200,0,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*4,0,Math.PI*2); ctx.fill();

    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 22;
    ctx.arc(b.x,b.y,b.r*0.55,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawBoss(){
  const b = state.boss;
  if(!b) return;
  ctx.save();
  ctx.translate(b.x, b.y);

  const g = ctx.createRadialGradient(0,0,20, 0,0,b.w*0.9);
  g.addColorStop(0, b.glow);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,b.w*0.9,0,Math.PI*2); ctx.fill();

  const w = b.w/2, h = b.h/2;
  const type = b.typeIndex % 4;

  ctx.beginPath();
  if(type === 0){
    ctx.moveTo(-w, -h*0.35);
    ctx.lineTo(-w*0.55, -h);
    ctx.lineTo(w*0.55, -h);
    ctx.lineTo(w, -h*0.35);
    ctx.lineTo(w*0.7, h);
    ctx.lineTo(-w*0.7, h);
  } else if(type === 1){
    ctx.moveTo(0, -h);
    ctx.lineTo(w, 0);
    ctx.lineTo(0, h);
    ctx.lineTo(-w, 0);
  } else if(type === 2){
    const points = 8;
    for(let i=0;i<points;i++){
      const a = (i/points)*Math.PI*2 - Math.PI/2;
      const rad = i%2===0 ? w : w*0.6;
      const px = Math.cos(a)*rad;
      const py = Math.sin(a)*(h*1.1);
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
  } else {
    for(let i=0;i<6;i++){
      const a = (i/6)*Math.PI*2 - Math.PI/2;
      const px = Math.cos(a)*w;
      const py = Math.sin(a)*h;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
  }
  ctx.closePath();

  const bg = ctx.createLinearGradient(0,-h,0,h);
  if(b.hitFlash > 0){
    bg.addColorStop(0,'#ffffff');
    bg.addColorStop(1,b.color);
  } else {
    bg.addColorStop(0, b.color);
    bg.addColorStop(.5, shadeColor(b.color, -50));
    bg.addColorStop(1,'#1a0518');
  }
  ctx.fillStyle = bg;
  ctx.shadowColor = b.color;
  ctx.shadowBlur = 30;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,.25)';
  ctx.lineWidth = 1.5;
  for(let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.moveTo(i*w*0.35, -h*0.6);
    ctx.lineTo(i*w*0.35, h*0.7);
    ctx.stroke();
  }

  ctx.fillStyle = '#fff';
  ctx.shadowColor = b.color;
  ctx.shadowBlur = 16;
  for(const ox of [-w*0.55, 0, w*0.55]){
    ctx.beginPath();
    ctx.arc(ox, h*0.55, 7, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  const hpW = b.w * 0.9;
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(-hpW/2, -h - 22, hpW, 8);
  const hpRatio = Math.max(0, b.hp / b.maxHp);
  const hg = ctx.createLinearGradient(-hpW/2,0,hpW/2,0);
  hg.addColorStop(0,'#ff2e6e');
  hg.addColorStop(1,'#ff9ad4');
  ctx.fillStyle = hg;
  ctx.fillRect(-hpW/2, -h - 22, hpW*hpRatio, 8);

  ctx.restore();
}

function shadeColor(hex, amt){
  if(!hex.startsWith('#')) return hex;
  let c = hex.slice(1);
  if(c.length===3) c = c.split('').map(x=>x+x).join('');
  const num = parseInt(c,16);
  let r = Math.max(0, Math.min(255, (num>>16) + amt));
  let g = Math.max(0, Math.min(255, ((num>>8)&255) + amt));
  let b = Math.max(0, Math.min(255, (num&255) + amt));
  return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

function drawParticles(){
  for(const p of state.particles){
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.fillStyle = p.color;
    ctx.arc(p.x, p.y, p.size * a + .4, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   حلقه اصلی
============================================================ */
function loop(t){
  const dt = Math.min(.05, (t - state.lastTime)/1000 || 0);
  state.lastTime = t;

  update(dt);

  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  drawStars();

  ctx.save();
  if(state.shake > 0){
    ctx.translate(rand(-state.shake,state.shake)*.5, rand(-state.shake,state.shake)*.5);
  }

  drawBoss();
  drawEnemies();
  drawBullets();
  drawBossBullets();
  drawPlayer();
  drawParticles();

  ctx.restore();

  requestAnimationFrame(loop);
}

/* ============================================================
   شروع
============================================================ */
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('startStats').innerHTML =
  `رکورد: ${bestRecord}<br>💰 ${totalCoins}`;
updateHUD();

const _s = playerScale();
player.x = W/2;
player.y = H - 110*_s;
player.targetX = player.x;
player.targetY = player.y;

requestAnimationFrame(loop);
</script>
