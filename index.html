<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>آپاچی - هفته‌های تو</title>
  
  <!-- فونت‌ها -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
  
  <!-- کتابخانه Three.js (برای شخصیت سه بعدی) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- سوپابیس SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0b0716;
      --panel: #16102a;
      --panel-light: #20163b;
      --accent: #ffd60a;
      --pink: #ff2e7e;
      --cyan: #19e3ff;
      --text: #ffffff;
      --text-dim: #a49cb5;
      --radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; }
    
    .app-container { width: 100%; max-width: 480px; padding: 16px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 40px; }
    
    /* هدر */
    header { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Lalezar', cursive; font-size: 32px; color: var(--pink); text-shadow: 0 0 10px var(--pink); }
    .badge { background: var(--cyan); color: #000; font-size: 12px; padding: 4px 12px; border-radius: 12px; font-weight: bold; }
    .subtitle { font-size: 14px; color: var(--text-dim); text-align: center; margin-top: 8px; line-height: 1.6; }

    /* صحنه سه بعدی */
    .scene-box {
      background: linear-gradient(135deg, #1c1433, #2a1b4d, #4a2020);
      border-radius: var(--radius);
      height: 320px;
      position: relative;
      overflow: hidden;
      border: 1px solid #ffffff15;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #apachi-container { width: 100%; height: 100%; }
    .scene-overlay {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      padding: 6px 12px; border-radius: 20px; font-size: 12px;
    }

    /* کنترل‌ها */
    .controls-section { display: flex; flex-direction: column; gap: 12px; }
    .control-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .control-label { font-size: 13px; color: var(--text-dim); min-width: 40px; }
    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; justify-content: flex-end; }
    
    .btn {
      background: var(--panel-light); color: var(--text); border: none;
      padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer;
      transition: all 0.2s; font-family: 'Vazirmatn';
    }
    .btn.active { background: var(--accent); color: #000; font-weight: bold; box-shadow: 0 0 12px #ffd60a88; }
    .btn:active { transform: scale(0.95); }

    /* ویجت هفته‌های زندگی */
    .week-widget {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid #ffffff10;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .week-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .week-title { color: var(--cyan); font-size: 18px; font-weight: bold; }
    .week-age { font-family: 'Lalezar', cursive; font-size: 28px; color: var(--accent); }
    
    input[type=range] { width: 100%; -webkit-appearance: none; background: transparent; margin-bottom: 16px; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; background: #ffffff20; border-radius: 4px; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 10px var(--accent); margin-top: -8px; cursor: pointer;
    }
    
    .progress-bar { width: 100%; height: 8px; background: #ffffff10; border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--pink), var(--accent)); width: 30%; border-radius: 4px; transition: width 0.3s; }
    
    .week-stats { font-size: 14px; line-height: 1.8; color: var(--text-dim); }
    .week-stats b { color: var(--text); }

    /* دکمه‌های تعاملی (لایک و اشتراک) */
    .action-bar { display: flex; gap: 12px; margin-top: 16px; }
    .action-btn {
      flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px;
      padding: 14px; border-radius: 16px; border: none; font-size: 15px; font-weight: bold;
      cursor: pointer; transition: 0.2s; font-family: 'Vazirmatn';
    }
    .action-btn:active { transform: scale(0.96); }
    .btn-share { background: var(--cyan); color: #000; }
    .btn-like { background: var(--panel-light); color: #fff; border: 1px solid var(--pink); }
    .btn-like.active { background: var(--pink); color: #fff; box-shadow: 0 0 15px var(--pink); }

    /* بخش کامنت‌ها */
    .comments-section {
      background: var(--panel); border-radius: var(--radius); padding: 20px;
      border: 1px solid #ffffff10;
    }
    .comments-title { font-size: 16px; font-weight: bold; margin-bottom: 16px; color: var(--text); }
    .comment-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; max-height: 250px; overflow-y: auto; }
    .comment-item { background: var(--panel-light); padding: 12px; border-radius: 12px; font-size: 13px; }
    .comment-name { color: var(--accent); font-weight: bold; margin-bottom: 4px; font-size: 12px; }
    
    .comment-form { display: flex; flex-direction: column; gap: 8px; }
    .comment-form input, .comment-form textarea {
      width: 100%; background: #0b0716; border: 1px solid #ffffff20; color: #fff;
      padding: 10px; border-radius: 10px; font-family: 'Vazirmatn'; font-size: 13px; outline: none;
    }
    .comment-form input:focus, .comment-form textarea:focus { border-color: var(--cyan); }
    .comment-submit {
      background: var(--panel-light); color: var(--text); border: 1px solid var(--cyan);
      padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s;
    }
    .comment-submit:hover { background: var(--cyan); color: #000; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="logo">آپاچی</div>
    <div class="badge">علم در ۲ دقیقه</div>
  </header>
  <p class="subtitle">با آپاچی دنیا رو کشف کن. هر قسمت به یه حدس، به شگفتی و یه عدد که یادت می‌مونه.</p>

  <!-- صحنه 3D -->
  <div class="scene-box">
    <div id="apachi-container"></div>
    <div class="scene-overlay">بکش و بچرخونش</div>
  </div>

  <!-- کنترل شخصیت -->
  <div class="controls-section">
    <div class="control-row">
      <span class="control-label">زاویه</span>
      <div class="btn-group" id="view-controls">
        <button class="btn" onclick="setView('front')">جلو</button>
        <button class="btn" onclick="setView('side')">پهلو</button>
        <button class="btn" onclick="setView('back')">پشت</button>
        <button class="btn active" onclick="apachi.spin()">بچرخ!</button>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">حرکت</span>
      <div class="btn-group" id="pose-controls">
        <button class="btn" onclick="setPose('wave')">سلام</button>
        <button class="btn" onclick="setPose('dance')">رقص</button>
        <button class="btn" onclick="setPose('think')">فکر</button>
        <button class="btn" onclick="setPose('jump')">پرش</button>
        <button class="btn" onclick="setPose('sleep')">خواب</button>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">حالت</span>
      <div class="btn-group" id="mood-controls">
        <button class="btn active" onclick="setMood('happy')">خوشحال</button>
        <button class="btn" onclick="setMood('wow')">تعجب</button>
        <button class="btn" onclick="setMood('laugh')">خنده</button>
        <button class="btn" onclick="setMood('cool')">خونسرد</button>
        <button class="btn" onclick="setMood('sad')">ناراحت</button>
      </div>
    </div>
  </div>

  <!-- ویجت محاسبه هفته‌ها -->
  <div class="week-widget">
    <div class="week-header">
      <span class="week-title">هفته‌های تو</span>
      <span class="week-age"><span id="age-display">۲۵</span> سال</span>
    </div>
    
    <input type="range" id="age-slider" min="1" max="80" value="25">
    
    <div class="progress-bar">
      <div class="progress-fill" id="life-progress"></div>
    </div>
    
    <div class="week-stats" id="week-text"></div>
    
    <!-- دکمه‌های لایک و اشتراک -->
    <div class="action-bar">
      <button class="action-btn btn-like" id="like-btn" onclick="toggleLike()">
        <span id="like-icon">🤍</span> <span id="like-count">0</span>
      </button>
      <button class="action-btn btn-share" onclick="shareResult()">کهن نتیجه برای دوستام</button>
    </div>
  </div>

  <!-- بخش کامنت‌ها -->
  <div class="comments-section">
    <div class="comments-title">نظرت چیه؟ (کامنت‌ها)</div>
    <div class="comment-list" id="comment-list">
      <!-- کامنت‌ها اینجا لود می‌شن -->
    </div>
    <div class="comment-form">
      <input type="text" id="comment-name" placeholder="اسمت (اختیاری)" maxlength="24">
      <textarea id="comment-body" placeholder="چی فکر می‌کنی؟..." maxlength="300" rows="2"></textarea>
      <button class="comment-submit" onclick="submitComment()">ارسال کامنت</button>
    </div>
  </div>
</div>

<!-- فایل شخصیت آپاچی رو اینجا لود کن -->
<!-- <script src="apachi.js"></script> -->

<script>
  // ==========================================
  // 1. راه‌اندازی سوپابیس (Supabase)
  // ==========================================
  const SUPABASE_URL = 'https://dqykeqtibspeajxdpsuk.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_4eLhQiDjFiWpTZn-P5w0dw_Q4xJgLLM';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const SCENE_KEY = 'ep:weeks'; // شناسه این صفحه

  // تولید یا خواندن شناسه یکتا برای کاربر (برای لایک کردن)
  let clientId = localStorage.getItem('apachi_client_id');
  if (!clientId) {
    clientId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2) + Date.now().toString(36);
    localStorage.setItem('apachi_client_id', clientId);
  }

  // ==========================================
  // 2. راه‌اندازی شخصیت سه بعدی آپاچی
  // ==========================================
  let apachi = null;
  const container = document.getElementById('apachi-container');
  
  if (window.Apachi) {
    apachi = window.Apachi.create(container);
  } else {
    console.warn("کد Apachi.js لود نشده است.");
  }

  function setView(v) { if(apachi) apachi.view(v); updateActiveBtn('view-controls', event.target); }
  function setPose(p) { if(apachi) apachi.pose(p); updateActiveBtn('pose-controls', event.target); }
  function setMood(m) { if(apachi) apachi.mood(m); updateActiveBtn('mood-controls', event.target); }
  function updateActiveBtn(groupId, btn) {
    document.querySelectorAll(`#${groupId} .btn`).forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
  }

  // ==========================================
  // 3. منطق هفته‌های زندگی (UI)
  // ==========================================
  const slider = document.getElementById('age-slider');
  const ageDisplay = document.getElementById('age-display');
  const lifeProgress = document.getElementById('life-progress');
  const weekText = document.getElementById('week-text');
  
  function faNum(num) { return num.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

  function updateAge() {
    const age = parseInt(slider.value);
    const totalWeeks = 80 * 52;
    const livedWeeks = age * 52;
    const leftWeeks = totalWeeks - livedWeeks;
    const percent = (livedWeeks / totalWeeks) * 100;

    ageDisplay.innerText = faNum(age);
    lifeProgress.style.width = percent + '%';
    
    weekText.innerHTML = `
      حدود <b>${faNum(livedWeeks)}</b> هفته رو زندگی کردی و اگه <b>۸۰ سال</b> عمر کنی،<br>
      حدود <b>${faNum(leftWeeks)}</b> هفته مونده.
    `;
  }
  slider.addEventListener('input', updateAge);
  updateAge();

  // ==========================================
  // 4. ارتباط با دیتابیس (لایک، کامنت، اشتراک)
  // ==========================================

  // آپدیت آمار (تعداد لایک و کامنت)
  async function loadStats() {
    try {
      // آمار کلی از ویو
      const { data: stats } = await supabaseClient
        .from('scene_stats')
        .select('*')
        .eq('scene_key', SCENE_KEY)
        .single();

      if (stats) {
        document.getElementById('like-count').innerText = faNum(stats.likes);
      }

      // بررسی اینکه آیا کاربر فعلی لایک کرده است یا خیر
      const { data: myLike } = await supabaseClient
        .from('likes')
        .select('*')
        .eq('scene_key', SCENE_KEY)
        .eq('client_id', clientId)
        .single();

      if (myLike) {
        document.getElementById('like-btn').classList.add('active');
        document.getElementById('like-icon').innerText = '❤️';
      }
    } catch (err) {
      console.error('خطا در دریافت آمار:', err);
    }
  }

  // لایک / آنلایک
  async function toggleLike() {
    const btn = document.getElementById('like-btn');
    const isLiked = btn.classList.contains('active');

    if (isLiked) {
      // حذف لایک
      const { error } = await supabaseClient.from('likes').delete().match({ scene_key: SCENE_KEY, client_id: clientId });
      if (!error) {
        btn.classList.remove('active');
        document.getElementById('like-icon').innerText = '🤍';
        loadStats(); // آپدیت تعداد
      }
    } else {
      // ثبت لایک
      const { error } = await supabaseClient.from('likes').insert({ scene_key: SCENE_KEY, client_id: clientId });
      if (!error) {
        btn.classList.add('active');
        document.getElementById('like-icon').innerText = '❤️';
        loadStats();
      }
    }
  }

  // دریافت کامنت‌ها
  async function loadComments() {
    const { data, error } = await supabaseClient
      .from('comments')
      .select('*')
      .eq('scene_key', SCENE_KEY)
      .order('created_at', { ascending: false })
      .limit(10);

    if (data && !error) {
      const list = document.getElementById('comment-list');
      list.innerHTML = '';
      data.forEach(c => {
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `
          <div class="comment-name">${c.name}</div>
          <div>${c.body}</div>
        `;
        list.appendChild(item);
      });
    }
  }

  // ارسال کامنت جدید
  async function submitComment() {
    const nameInput = document.getElementById('comment-name');
    const bodyInput = document.getElementById('comment-body');
    const name = nameInput.value.trim() || 'ناشناس';
    const body = bodyInput.value.trim();

    if (!body) return alert('متن کامنت نمی‌تواند خالی باشد.');

    const btn = document.querySelector('.comment-submit');
    btn.innerText = 'در حال ارسال...';
    btn.disabled = true;

    const { error } = await supabaseClient
      .from('comments')
      .insert({ scene_key: SCENE_KEY, name: name, body: body });

    if (error) {
      alert('خطا در ارسال کامنت!');
      console.error(error);
    } else {
      bodyInput.value = '';
      await loadComments();
    }

    btn.innerText = 'ارسال کامنت';
    btn.disabled = false;
  }

  // اشتراک‌گذاری
  async function shareResult() {
    const age = parseInt(slider.value);
    const text = `من ${faNum(age)} سالمه و تازه فهمیدم چقدر هفته برای زندگی کردن دارم! تو هم حساب کن.`;
    
    // ثبت آمار اشتراک‌گذاری در دیتابیس
    await supabaseClient.from('shares').insert({ scene_key: SCENE_KEY });

    if (navigator.share) {
      navigator.share({
        title: 'آپاچی - هفته‌های تو',
        text: text,
        url: window.location.href,
      }).catch(console.error);
    } else {
      navigator.clipboard.writeText(text + ' ' + window.location.href);
      alert('لینک کپی شد! می‌تونی برای دوستات بفرستی.');
    }
  }

  // اجرای اولیه
  loadStats();
  loadComments();

</script>

</body>
                                                            </html>
