<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APACHI | آکادمی علمی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1128;
    --surface:#131E3A;
    --surface-2:#1B2C6B;
    --primary:#3D5AFE;
    --gold:#FFC94A;
    --text:#EAF0FF;
    --muted:rgba(234,240,255,.55);
    --muted-2:rgba(234,240,255,.28);
    --border:rgba(255,255,255,.12);
    --ease:cubic-bezier(.22,1,.36,1);
    --shadow-3d:
      0 1px 0 rgba(255,255,255,.08) inset,
      0 4px 12px rgba(0,0,0,.35),
      0 24px 48px -12px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Vazirmatn',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    line-height:1.8;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ BACKGROUND ============ */
  .bg-layer{
    position:fixed;inset:0;z-index:-1;overflow:hidden;
    background:
      radial-gradient(60% 50% at 15% 10%, rgba(61,90,254,.35), transparent 70%),
      radial-gradient(50% 45% at 90% 85%, rgba(255,201,74,.14), transparent 70%),
      linear-gradient(135deg,#0A1128 0%,#131E3A 50%,#0A1128 100%);
  }
  .bg-layer::before{ /* dot grid */
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(234,240,255,.5) 1px, transparent 1px);
    background-size:28px 28px;
    opacity:.06;
    mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 75%);
    -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 75%);
  }
  .bg-layer::after{ /* noise */
    content:"";position:absolute;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity:.03;
    pointer-events:none;
  }
  .blob{
    position:absolute;border-radius:50%;filter:blur(120px);opacity:.35;
    animation:float 22s ease-in-out infinite;
  }
  .blob-1{width:520px;height:520px;background:#3D5AFE;top:-10%;right:-10%}
  .blob-2{width:420px;height:420px;background:#FFC94A;bottom:-10%;left:-10%;animation-delay:-11s;opacity:.2}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(40px,-40px) scale(1.08)}
  }

  /* ============ HEADER ============ */
  header{
    position:sticky;top:0;z-index:50;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    background:rgba(10,17,40,.65);
    border-bottom:1px solid var(--border);
  }
  .header-inner{
    max-width:1360px;margin:0 auto;
    padding:16px 32px;
    display:flex;align-items:center;gap:32px;
  }
  .brand{
    display:flex;align-items:center;gap:12px;
    font-weight:800;font-size:22px;letter-spacing:.06em;
    color:var(--text);text-decoration:none;
  }
  .brand-mark{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(145deg,#1B2C6B,#3D5AFE);
    border:1px solid rgba(255,201,74,.4);
    display:grid;place-items:center;
    box-shadow:0 0 20px rgba(61,90,254,.4);
    overflow:hidden;
  }
  .brand-mark svg{width:100%;height:100%}
  .brand-name span{color:var(--gold)}

  .header-search{
    flex:1;max-width:520px;position:relative;
  }
  .header-search input{
    width:100%;height:44px;padding:0 16px 0 48px;
    border-radius:14px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--border);
    color:var(--text);font-family:inherit;font-size:15px;
    transition:all .25s var(--ease);
  }
  .header-search input::placeholder{color:var(--muted-2)}
  .header-search input:focus{
    outline:none;
    border-color:rgba(255,201,74,.5);
    background:rgba(255,255,255,.09);
    box-shadow:0 0 0 4px rgba(255,201,74,.1);
  }
  .header-search::after{
    content:"🔍";position:absolute;left:16px;top:50%;
    transform:translateY(-50%);font-size:16px;opacity:.5;
  }

  /* ============ HERO ============ */
  .hero{
    max-width:1360px;margin:0 auto;
    padding:80px 32px 100px;
    display:grid;grid-template-columns:1.2fr .8fr;
    gap:60px;align-items:center;
    min-height:70vh;
  }
  .hero-text h1{
    font-size:clamp(34px,4.5vw,60px);
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.02em;
    margin-bottom:24px;
  }
  .hero-text h1 .gold{color:var(--gold);position:relative}
  .hero-text h1 .gold::after{
    content:"";position:absolute;left:0;right:0;bottom:-4px;
    height:3px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .hero-text p{
    font-size:18px;color:var(--muted);
    max-width:520px;margin-bottom:36px;
  }
  .hero-cta{display:flex;gap:16px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    height:52px;padding:0 28px;
    border-radius:14px;
    font-family:inherit;font-size:15px;font-weight:700;
    letter-spacing:.02em;
    border:none;cursor:pointer;
    transition:all .25s var(--ease);
  }
  .btn-primary{
    background:linear-gradient(135deg,#3D5AFE,#1B2C6B);
    color:#fff;
    box-shadow:0 8px 24px rgba(61,90,254,.4), 0 0 20px rgba(255,201,74,.15);
  }
  .btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 32px rgba(61,90,254,.5), 0 0 28px rgba(255,201,74,.35);
  }
  .btn-primary:active{transform:scale(.97)}
  .btn-ghost{
    background:rgba(255,255,255,.06);
    color:var(--text);
    border:1px solid var(--border);
  }
  .btn-ghost:hover{
    background:rgba(255,255,255,.1);
    border-color:rgba(255,201,74,.4);
    transform:translateY(-2px);
  }
  .btn-ghost:active{transform:scale(.97)}

  .hero-mascot{
    position:relative;display:grid;place-items:center;
    aspect-ratio:1;
  }
  .hero-mascot::before{
    content:"";position:absolute;inset:15%;border-radius:50%;
    background:radial-gradient(circle, rgba(61,90,254,.45), transparent 70%);
    filter:blur(40px);
    animation:pulse 5s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
  .hero-mascot svg{
    position:relative;width:70%;height:auto;
    filter:drop-shadow(0 30px 60px rgba(61,90,254,.5));
    animation:bob 4s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-14px)}
  }

  /* ============ LIBRARY ============ */
  .library{
    max-width:1360px;margin:0 auto;
    padding:60px 32px 120px;
  }
  .library-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:24px;margin-bottom:40px;flex-wrap:wrap;
  }
  .library-head h2{
    font-size:clamp(24px,2.6vw,34px);font-weight:800;
    letter-spacing:-.01em;
  }
  .library-head h2 span{color:var(--gold)}
  .library-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .shuffle-btn{
    height:44px;padding:0 20px;
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--text);font-family:inherit;font-size:14px;font-weight:700;
    cursor:pointer;transition:all .25s var(--ease);
  }
  .shuffle-btn:hover{
    background:rgba(255,201,74,.1);
    border-color:rgba(255,201,74,.45);
    color:var(--gold);
  }
  .shuffle-btn:active{transform:scale(.96)}

  .video-block{margin-bottom:32px}
  .block-row{display:grid;gap:24px}
  .block-row-top{grid-template-columns:repeat(3,1fr)}
  .block-row-bottom{grid-template-columns:repeat(2,1fr);margin-top:24px}

  /* ============ VIDEO CARD ============ */
  .video-card{
    position:relative;
    border-radius:20px;overflow:hidden;
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:var(--shadow-3d);
    cursor:pointer;
    transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s;
    animation:cardIn .7s var(--ease) both;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
  }
  .video-card:hover{
    transform:translateY(-6px);
    border-color:rgba(255,201,74,.4);
    box-shadow:
      0 1px 0 rgba(255,255,255,.14) inset,
      0 8px 20px rgba(0,0,0,.4),
      0 32px 60px -16px rgba(0,0,0,.65),
      0 0 40px rgba(255,201,74,.08);
  }
  .video-thumb{
    position:relative;aspect-ratio:16/9;
    background:linear-gradient(135deg,var(--g1),var(--g2));
    overflow:hidden;
    display:grid;place-items:center;
  }
  .video-thumb::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.4) 1px, transparent 1px);
    background-size:22px 22px;opacity:.08;
  }
  .video-thumb::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 40%,rgba(10,17,40,.65) 100%);
  }
  .video-code{
    position:absolute;top:14px;right:14px;z-index:2;
    padding:5px 12px;border-radius:8px;
    background:rgba(10,17,40,.75);
    border:1px solid rgba(255,201,74,.4);
    color:var(--gold);font-size:12px;font-weight:800;
    letter-spacing:.08em;
    backdrop-filter:blur(8px);
  }
  .video-duration{
    position:absolute;bottom:12px;left:12px;z-index:2;
    padding:4px 10px;border-radius:6px;
    background:rgba(10,17,40,.75);
    color:var(--text);font-size:12px;font-weight:600;
    backdrop-filter:blur(8px);
  }
  .play-btn{
    position:relative;z-index:2;
    width:56px;height:56px;border-radius:50%;
    background:rgba(255,255,255,.15);
    border:1.5px solid rgba(255,255,255,.4);
    display:grid;place-items:center;
    font-size:20px;color:#fff;
    backdrop-filter:blur(8px);
    transition:all .3s var(--ease);
  }
  .play-btn::before{content:"▶";margin-right:-4px}
  .video-card:hover .play-btn{
    background:var(--gold);
    color:#0A1128;
    border-color:var(--gold);
    transform:scale(1.1);
    box-shadow:0 0 24px rgba(255,201,74,.6);
  }
  .video-body{padding:18px 20px 22px}
  .video-body h3{
    font-size:16px;font-weight:700;line-height:1.5;
    margin-bottom:8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;
  }
  .video-cat{
    font-size:12px;color:var(--gold);font-weight:600;
    letter-spacing:.04em;
  }

  .no-results{
    text-align:center;padding:80px 20px;
    color:var(--muted);
  }
  .no-results h3{font-size:22px;color:var(--text);margin-bottom:12px}

  /* ============ MODAL ============ */
  .modal{
    position:fixed;inset:0;z-index:100;
    display:grid;place-items:center;padding:24px;
    background:rgba(5,8,20,.85);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    opacity:0;transition:opacity .3s var(--ease);
  }
  .modal[hidden]{display:none}
  .modal.open{opacity:1}
  .modal-inner{
    max-width:880px;width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 40px 100px -20px rgba(0,0,0,.8);
    transform:scale(.95);opacity:0;
    transition:transform .35s var(--ease),opacity .3s;
    max-height:90vh;overflow-y:auto;
  }
  .modal.open .modal-inner{transform:scale(1);opacity:1}
  .modal-player{
    position:relative;aspect-ratio:16/9;
    background:linear-gradient(135deg,var(--g1,#1B2C6B),var(--g2,#3D5AFE));
    overflow:hidden;
    display:grid;place-items:center;
  }
  .modal-player::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.35) 1px, transparent 1px);
    background-size:26px 26px;opacity:.1;
    animation:drift 30s linear infinite;
  }
  @keyframes drift{to{background-position:260px 260px}}
  .modal-player .big-apache{width:38%;max-width:220px;opacity:.95;animation:bob 4s ease-in-out infinite}
  .modal-close{
    position:absolute;top:14px;left:14px;z-index:5;
    width:40px;height:40px;border-radius:50%;
    background:rgba(10,17,40,.8);border:1px solid var(--border);
    color:var(--text);font-size:18px;cursor:pointer;
    display:grid;place-items:center;
    transition:all .2s;
  }
  .modal-close:hover{background:#FF4D9D;border-color:#FF4D9D}

  /* ============ KARAOKE SUBS ============ */
  .karaoke{
    position:absolute;left:0;right:0;bottom:20px;z-index:4;
    padding:0 32px;text-align:center;
    font-size:clamp(18px,2.4vw,26px);
    font-weight:700;line-height:1.9;
    direction:rtl;
    white-space:pre-wrap;
    pointer-events:none;
  }
  .karaoke::before{
    content:"";position:absolute;inset:-16px 0 0;
    background:linear-gradient(0deg,rgba(10,17,40,.7),transparent);
    z-index:-1;
  }
  .word{
    display:inline-block;
    color:rgba(234,240,255,.35);
    transition:color .15s linear, transform .15s var(--ease);
    will-change:color,transform;
  }
  .word.past{color:#EAF0FF}
  .word.now{
    color:var(--gold);
    font-weight:800;
    transform:scale(1.08);
    text-shadow:0 0 16px rgba(255,201,74,.7), 0 0 4px rgba(255,201,74,.9);
  }

  .modal-body{padding:28px 32px 32px}
  .modal-body h2{font-size:22px;font-weight:800;margin-bottom:12px;line-height:1.4}
  .modal-meta{
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;
  }
  .chip{
    padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;
    background:rgba(255,201,74,.12);
    color:var(--gold);
    border:1px solid rgba(255,201,74,.3);
  }
  .chip.gray{
    background:rgba(255,255,255,.06);
    color:var(--muted);
    border-color:var(--border);
  }
  .modal-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}

  /* ============ FOOTER ============ */
  footer{
    max-width:1360px;margin:0 auto;
    padding:40px 32px 60px;
    border-top:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
    gap:24px;flex-wrap:wrap;
    color:var(--muted);font-size:14px;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width:1000px){
    .hero{grid-template-columns:1fr;gap:40px;padding:60px 24px 80px;text-align:center}
    .hero-text p{margin-inline:auto}
    .hero-cta{justify-content:center}
    .hero-mascot{max-width:320px;margin-inline:auto}
    .block-row-top{grid-template-columns:repeat(2,1fr)}
    .block-row-bottom{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:640px){
    .header-inner{padding:12px 16px;gap:16px}
    .brand-name{font-size:16px}
    .brand-mark{width:34px;height:34px}
    .library,.hero{padding-inline:20px}
    .block-row-top,.block-row-bottom{grid-template-columns:1fr}
    .block-row-bottom{margin-top:24px}
    .modal-body{padding:20px}
    .karaoke{padding:0 16px;bottom:12px}
    footer{flex-direction:column;text-align:center}
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<header>
  <div class="header-inner">
    <a href="#" class="brand">
      <div class="brand-mark">
        <!-- minimal apache mark -->
        <svg viewBox="0 0 60 60">
          <line x1="20" y1="14" x2="16" y2="6" stroke="#FFC94A" stroke-width="3" stroke-linecap="round"/>
          <circle cx="16" cy="6" r="3" fill="#FFC94A"/>
          <line x1="40" y1="14" x2="44" y2="6" stroke="#FFC94A" stroke-width="3" stroke-linecap="round"/>
          <circle cx="44" cy="6" r="3" fill="#FFC94A"/>
          <circle cx="30" cy="26" r="14" fill="#3D5AFE"/>
          <ellipse cx="24" cy="25" rx="3" ry="4" fill="#FFC94A"/>
          <ellipse cx="36" cy="25" rx="3" ry="4" fill="#FFC94A"/>
          <ellipse cx="30" cy="46" rx="14" ry="11" fill="#3D5AFE"/>
        </svg>
      </div>
      <div class="brand-name">APACH<span>I</span></div>
    </a>
    <div class="header-search">
      <input id="search" type="text" placeholder="جستجو با کد (مثل AP-003) یا عنوان...">
    </div>
  </div>
</header>

<main>
  <!-- HERO -->
  <section class="hero">
    <div class="hero-text">
      <h1>علم را با <span class="gold">آپاچی</span><br>تماشا کن</h1>
      <p>مجموعه‌ای از فیلم‌های علمی کوتاه، پرانرژی و سرگرم‌کننده — با زیرنویس کارائوکه‌ای و روایت آپاچی.</p>
      <div class="hero-cta">
        <button class="btn btn-primary" onclick="document.getElementById('library').scrollIntoView()">شروع تماشا →</button>
        <button class="btn btn-ghost" id="heroShuffle">بُر زدن فیلم‌ها</button>
      </div>
    </div>
    <div class="hero-mascot" id="heroMascot"></div>
  </section>

  <!-- LIBRARY -->
  <section class="library" id="library">
    <div class="library-head">
      <h2>کتابخانه <span>فیلم‌ها</span></h2>
      <div class="library-tools">
        <button class="shuffle-btn" id="shuffleBtn">🔀 بُر زدن</button>
      </div>
    </div>
    <div id="grid"></div>
    <div class="no-results" id="noResults" hidden>
      <h3>چیزی پیدا نشد</h3>
      <p>کد یا عنوان دیگری را امتحان کنید — مثلاً AP-003</p>
    </div>
  </section>
</main>

<footer>
  <div>© APACHI — آکادمی علمی</div>
  <div>ساخته‌شده با ❤️ و کمی علم</div>
</footer>

<!-- MODAL -->
<div class="modal" id="modal" hidden>
  <div class="modal-inner" id="modalInner">
    <div class="modal-player" id="modalPlayer">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="big-apache" id="modalApache"></div>
      <div class="karaoke" id="karaoke"></div>
    </div>
    <div class="modal-body">
      <h2 id="modalTitle"></h2>
      <div class="modal-meta">
        <span class="chip" id="modalCode"></span>
        <span class="chip gray" id="modalCat"></span>
        <span class="chip gray" id="modalDur"></span>
      </div>
      <p style="color:var(--muted);font-size:15px" id="modalDesc"></p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="replayBtn">🔁 پخش دوباره زیرنویس</button>
        <button class="btn btn-ghost" id="anotherBtn">🎲 فیلم بعدی</button>
      </div>
    </div>
  </div>
</div>

<script>
/* =============== APACHE SVG =============== */
const APACHE_SVG = `
<svg viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D5AFE" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#3D5AFE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A68FF"/>
      <stop offset="100%" stop-color="#2A42C9"/>
    </linearGradient>
  </defs>
  <ellipse cx="110" cy="140" rx="110" ry="120" fill="url(#glowGrad)"/>
  <!-- antennae -->
  <line x1="76" y1="40" x2="62" y2="14" stroke="#FFC94A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="62" cy="14" r="7" fill="#FFC94A"/>
  <line x1="144" y1="40" x2="158" y2="14" stroke="#FFC94A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="158" cy="14" r="7" fill="#FFC94A"/>
  <!-- head -->

/* =============== STATE =============== */
let currentVideos = [...VIDEOS];
let karaokeRAF = null;

/* =============== SHUFFLE =============== */
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =============== RENDER GRID =============== */
function createCard(v){
  const card = document.createElement('article');
  card.className = 'video-card';
  card.innerHTML = `
    <div class="video-thumb" style="--g1:${v.g[0]};--g2:${v.g[1]}">
      <span class="video-code">${v.code}</span>
      <div class="play-btn"></div>
      <span class="video-duration">${v.dur}</span>
    </div>
    <div class="video-body">
      <h3>${v.title}</h3>
      <p class="video-cat">${v.cat}</p>
    </div>`;
  card.addEventListener('click', () => openModal(v));
  return card;
}

function renderGrid(list){
  const grid = document.getElementById('grid');
  const noRes = document.getElementById('noResults');
  grid.innerHTML = '';
  if(list.length === 0){
    noRes.hidden = false;
    return;
  }
  noRes.hidden = true;

  for(let i = 0; i < list.length; i += 5){
    const slice = list.slice(i, i + 5);
    const block = document.createElement('div');
    block.className = 'video-block';

    const top = document.createElement('div');
    top.className = 'block-row block-row-top';
    slice.slice(0, 3).forEach(v => top.appendChild(createCard(v)));
    block.appendChild(top);

    if(slice.length > 3){
      const bottom = document.createElement('div');
      bottom.className = 'block-row block-row-bottom';
      slice.slice(3, 5).forEach(v => bottom.appendChild(createCard(v)));
      block.appendChild(bottom);
    }

    grid.appendChild(block);
  }
}

/* =============== SEARCH =============== */
function filterVideos(q){
  const s = q.trim().toLowerCase();
  if(!s) return shuffle(VIDEOS);
  return VIDEOS.filter(v =>
    v.code.toLowerCase().includes(s) ||
    v.title.toLowerCase().includes(s) ||
    v.cat.toLowerCase().includes(s)
  );
}

let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    currentVideos = filterVideos(e.target.value);
    renderGrid(currentVideos);
  }, 180);
});

/* =============== SHUFFLE BUTTONS =============== */
function doShuffle(){
  currentVideos = shuffle(currentVideos);
  renderGrid(currentVideos);
  document.getElementById('library').scrollIntoView({behavior:'smooth'});
}
document.getElementById('shuffleBtn').addEventListener('click', doShuffle);
document.getElementById('heroShuffle').addEventListener('click', doShuffle);

/* =============== KARAOKE PLAYER =============== */
function buildKaraoke(){
  const k = document.getElementById('karaoke');
  k.innerHTML = '';
  KARAOKE.forEach(o => {
    const el = document.createElement('span');
    el.className = 'word';
    el.textContent = o.w + ' ';
    k.appendChild(el);
  });
}

function playKaraoke(){
  cancelAnimationFrame(karaokeRAF);
  const words = document.querySelectorAll('#karaoke .word');
  words.forEach(w => w.className = 'word');
  const start = performance.now();
  function tick(now){
    const t = (now - start) / 1000;
    KARAOKE.forEach((k, i) => {
      const el = words[i];
      if(!el) return;
      if(t >= k.e) el.className = 'word past';
      else if(t >= k.s && t < k.e) el.className = 'word now';
      else el.className = 'word';
    });
    if(t < 8.5) karaokeRAF = requestAnimationFrame(tick);
  }
  karaokeRAF = requestAnimationFrame(tick);
}

/* =============== MODAL =============== */
const modal = document.getElementById('modal');
const modalInner = document.getElementById('modalInner');
let currentIdx = 0;

function openModal(v){
  currentIdx = VIDEOS.findIndex(x => x.code === v.code);
  const player = document.getElementById('modalPlayer');
  player.style.setProperty('--g1', v.g[0]);
  player.style.setProperty('--g2', v.g[1]);
  document.getElementById('modalTitle').textContent = v.title;
  document.getElementById('modalCode').textContent = v.code;
  document.getElementById('modalCat').textContent = v.cat;
  document.getElementById('modalDur').textContent = v.dur;
  document.getElementById('modalDesc').textContent = v.desc;

  modal.hidden = false;
  requestAnimationFrame(() => modal.classList.add('open'));

  buildKaraoke();
  setTimeout(playKaraoke, 500);
}

function closeModal(){
  cancelAnimationFrame(karaokeRAF);
  modal.classList.remove('open');
  setTimeout(() => { modal.hidden = true; }, 300);
}

document.getElementById('modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', e => {
  if(e.target === modal) closeModal();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !modal.hidden) closeModal();
});
document.getElementById('replayBtn').addEventListener('click', playKaraoke);
document.getElementById('anotherBtn').addEventListener('click', () => {
  const next = VIDEOS[(currentIdx + 1 + Math.floor(Math.random() * (VIDEOS.length - 1))) % VIDEOS.length];
  openModal(next);
});

/* =============== INIT =============== */
currentVideos = shuffle(VIDEOS);
renderGrid(currentVideos);
