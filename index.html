<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ایران وار</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #eee;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
  }
  .screen { display: none; width: 100%; max-width: 500px; }
  .screen.active { display: block; }

  .welcome-title {
    font-size: 2em;
    font-weight: bold;
    color: #facc15;
    text-align: center;
    margin-bottom: 20px;
    text-shadow: 0 0 15px rgba(250, 204, 21, 0.6);
  }
  .welcome-sub {
    text-align: center;
    color: #cbd5e1;
    margin-bottom: 10px;
    font-size: 1em;
  }
  .name-input {
    width: 100%;
    padding: 14px;
    font-size: 1.1em;
    border-radius: 10px;
    border: 2px solid #334155;
    background: #1e293b;
    color: #fff;
    text-align: center;
    margin-top: 15px;
    outline: none;
  }
  .name-input:focus { border-color: #facc15; }
  .btn {
    width: 100%;
    padding: 14px;
    font-size: 1.1em;
    border: none;
    border-radius: 10px;
    background: #facc15;
    color: #0f172a;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
    transition: transform 0.15s;
  }
  .btn:hover { transform: scale(1.02); }

  .congrats {
    text-align: center;
    font-size: 1.3em;
    color: #4ade80;
    line-height: 1.8;
  }

  .menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: 30px;
  }
  .menu-btn {
    padding: 20px;
    font-size: 1.2em;
    border: 2px solid #facc15;
    border-radius: 14px;
    background: #1e293b;
    color: #facc15;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .menu-btn:hover { background: #facc15; color: #0f172a; }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1e293b;
    padding: 12px 15px;
    border-radius: 10px 10px 0 0;
    border-bottom: 1px solid #334155;
  }
  .chat-header .title { font-weight: bold; color: #facc15; }
  .back-btn {
    background: none;
    border: none;
    color: #facc15;
    font-size: 1.4em;
    cursor: pointer;
    padding: 0 8px;
  }
  .chat-box {
    background: #0f172a;
    height: 60vh;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.95em;
    line-height: 1.6;
    word-wrap: break-word;
  }
  .msg.bot {
    background: #1e293b;
    color: #e2e8f0;
    align-self: flex-start;
    border-bottom-right-radius: 4px;
  }
  .msg.user {
    background: #facc15;
    color: #0f172a;
    align-self: flex-end;
    border-bottom-left-radius: 4px;
    font-weight: bold;
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #1e293b;
    border-radius: 0 0 10px 10px;
  }
  .chat-input-row input {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #fff;
    font-size: 1em;
    outline: none;
  }
  .chat-input-row button {
    padding: 0 18px;
    background: #facc15;
    color: #0f172a;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }

  .country-item {
    background: #1e293b;
    padding: 12px 15px;
    border-radius: 10px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #334155;
  }
  .country-item.taken {
    border-color: #22c55e;
    background: #14291d;
  }
  .check { color: #22c55e; font-weight: bold; }
  .countries-list {
    height: 60vh;
    overflow-y: auto;
    padding-right: 5px;
  }
</style>
</head>
<body>

<div id="screen-welcome" class="screen active">
  <div class="welcome-title">به ایران وار خوش آمدید!</div>
  <div class="welcome-sub">لطفاً اسم خود را وارد کنید</div>
  <input id="nameInput" class="name-input" type="text" placeholder="نام شما..." autocomplete="off">
  <button class="btn" onclick="submitName()">تایید</button>
</div>

<div id="screen-congrats" class="screen">
  <div class="congrats" id="congratsText"></div>
</div>

<div id="screen-menu" class="screen">
  <div class="menu-buttons">
    <button class="menu-btn" onclick="openChat()">🧑‍💻 بات کشور گیری</button>
    <button class="menu-btn" onclick="openCountries()">🌍 کشورها</button>
  </div>
</div>

<div id="screen-chat" class="screen">
  <div class="chat-header">
    <span class="title">بات کشورگیری</span>
    <button class="back-btn" onclick="backToMenu()">↩</button>
  </div>
  <div class="chat-box" id="chatBox"></div>
  <div class="chat-input-row">
    <input id="chatInput" type="text" placeholder="اسم کشور یا گروهک..." autocomplete="off" onkeydown="if(event.key==='Enter') sendChat()">
    <button onclick="sendChat()">ارسال</button>
  </div>
</div>

<div id="screen-countries" class="screen">
  <div class="chat-header">
    <span class="title">🌍 کشورهای دنیا</span>
    <button class="back-btn" onclick="backToMenu()">↩</button>
  </div>
  <div class="countries-list" id="countriesList"></div>
</div>

<script>
// ============ تنظیمات Supabase ============
const SUPABASE_URL = 'https://dqykeqtibspeajxdpsuk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4eLhQiDjFiWpTZn-P5w0dw_Q4xJgLLM';

// این خط رو داخل try قرار دادم که اگه خطا داد، کل سایت خراب نشه
let supabaseClient = null;
try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) {
    console.error("خطا در اتصال به Supabase:", e);
}

// ============ لیست کامل کشورها ============
const ALL_ENTITIES = [
  "ایران","افغانستان","عراق","ترکیه","پاکستان","عربستان","امارات","قطر","کویت","عمان",
  "بحرین","یمن","سوریه","لبنان","اردن","فلسطین","مصر","لیبی","تونس","الجزایر",
  "مراکش","سودان","اتیوپی","سومالی","کنیا","تانزانیا","اوگاندا","نیجریه","غنا","سنگال",
  "آفریقای جنوبی","زیمبابوه","آنگولا","موزامبیک","ماداگاسکار","کامرون","چاد","نیجر","مالی","موریتانی",
  "روسیه","اوکراین","بلاروس","لهستان","آلمان","فرانسه","انگلیس","ایتالیا","اسپانیا","پرتغال",
  "هلند","بلژیک","سوئیس","اتریش","سوئد","نروژ","فنلاند","دانمارک","یونان","بلغارستان",
  "رومانی","مجارستان","چک","اسلواکی","صربستان","کرواسی","بوسنی","آلبانی","مقدونیه","اسلوونی",
  "چین","ژاپن","کره جنوبی","کره شمالی","هند","اندونزی","مالزی","تایلند","ویتنام","فیلیپین",
  "سنگاپور","برمه","کامبوج","لائوس","مغولستان","قزاقستان","ازبکستان","ترکمنستان","قرقیزستان","تاجیکستان",
  "آذربایجان","ارمنستان","گرجستان","آمریکا","کانادا","مکزیک","برزیل","آرژانتین","شیلی","پرو",
  "کلمبیا","ونزوئلا","اکوادور","بولیوی","پاراگوئه","اروگوئه","کوبا","جامائیکا","هائیتی","دومینیکن",
  "استرالیا","نیوزیلند","فیجی","پاپوآ گینه نو","سودان جنوبی","اریتره","جیبوتی","گابن",
  "کنگو","رواندا","بوروندی","مالاوی","زامبیا","بوتسوانا","ناميبيا","لسوتو","اسواتینی","گینه",
  "سیرالئون","لیبریا","ساحل عاج","بورکینافاسو","توگو","بنین","گامبیا","گینه بیسائو","کیپ ورد","سیشل",
  "موریس","کومور","سائوتومه","برونئی","تیمور شرقی","مالدیو","بوتان","نپال","بنگلادش",
  "سریلانکا"
];

// ============ وضعیت بازی ============
let playerName = '';
let playerCountry = null;
let playerCode = null;

// ============ توابع صفحه ============
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function submitName() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { alert('لطفاً اسم خود را وارد کنید'); return; }
  playerName = name;
  document.getElementById('congratsText').innerHTML =
    `${name} عزیز،<br>تبریک می‌گم به ایران وار خوش اومدی 🎉`;
  showScreen('screen-congrats');
  setTimeout(() => showScreen('screen-menu'), 2500);
}

function backToMenu() { showScreen('screen-menu'); }

// ============ چت بات ============
function openChat() {
  showScreen('screen-chat');
  const box = document.getElementById('chatBox');
  if (box.children.length === 0) {
    addMsg('bot', `سلام ${playerName}! 👋 اسم یک کشور یا گروهک رو بفرست تا بررسی کنم.`);
  }
}

function addMsg(type, text) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg('user', text);

  if (!supabaseClient) {
    setTimeout(() => addMsg('bot', 'خطا در اتصال به دیتابیس ❌'), 400);
    return;
  }

  if (playerCountry) {
    setTimeout(() => addMsg('bot', 'شما قبلاً کشور گرفته‌اید. منتظر سیزن بعد باشید ⏳'), 400);
    return;
  }

  const found = ALL_ENTITIES.find(e => e === text);
  if (!found) {
    setTimeout(() => addMsg('bot', 'کشور یافت نشد ❌'), 400);
    return;
  }

  const { data: existing, error: exErr } = await supabaseClient
    .from('player_countries')
    .select('country')
    .eq('country', found)
    .maybeSingle();

  if (exErr) { console.error(exErr); }
  if (existing) {
    setTimeout(() => addMsg('bot', 'این کشور قبلاً گرفته شده است ❌'), 400);
    return;
  }

  const code = Math.floor(1000 + Math.random() * 9000);

  const { error } = await supabaseClient.from('player_countries').insert({
    player_name: playerName,
    country: found,
    code: code
  });

  if (error) {
    console.error(error);
    setTimeout(() => addMsg('bot', 'خطا در ثبت. دوباره تلاش کنید ❌'), 400);
    return;
  }

  playerCountry = found;
  playerCode = code;

  setTimeout(() => addMsg('bot', 'کشور شما با موفقیت ثبت شد ✅'), 400);
  setTimeout(() => addMsg('bot', `کد شما این است: ${code}`), 900);
  setTimeout(() => addMsg('bot', 'منتظر سیزن بعد باشید ⏳'), 1400);
}

// ============ صفحه کشورها ============
async function openCountries() {
  showScreen('screen-countries');
  const list = document.getElementById('countriesList');
  list.innerHTML = '<p style="text-align:center;color:#888">در حال دریافت...</p>';

  if (!supabaseClient) {
     list.innerHTML = '<p style="text-align:center;color:red">خطا در اتصال به دیتابیس</p>';
     return;
  }

  const { data, error } = await supabaseClient.from('player_countries').select('country');
  if (error) { console.error(error); }

  const takenSet = new Set((data || []).map(r => r.country));

  list.innerHTML = '';
  ALL_ENTITIES.forEach(c => {
    const div = document.createElement('div');
    div.className = 'country-item' + (takenSet.has(c) ? ' taken' : '');
    div.innerHTML = `<span>${c}</span>` + (takenSet.has(c) ? '<span class="check">✅</span>' : '');
    list.appendChild(div);
  });
}
</script>

</body>
   </html>
