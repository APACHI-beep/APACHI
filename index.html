<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APACHI | آکادمی علمی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #060B14;
    --surface-1: #0B1324;
    --surface-2: #111C33;
    --surface-3: #182645;
    --cyan: #00D2D3;
    --violet: #A855F7;
    --emerald: #10B981;
    --gold: #FFC94A;
    --white: #FFFFFF;
    --slate: #94A3B8;
    --slate-dim: rgba(148,163,184,.45);
    --border: rgba(255,255,255,.08);
    --border-hover: rgba(0,210,211,.35);
    --ease: cubic-bezier(.22,1,.36,1);
    --shadow-3d:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 4px 16px rgba(0,0,0,.35),
      0 24px 60px -16px rgba(0,0,0,.65);
    --font: 'Vazirmatn', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font);
    background: var(--void);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.8;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ BACKGROUND ============ */
  .bg-layer {
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background:
      radial-gradient(60% 50% at 15% 10%, rgba(0,210,211,.12), transparent 70%),
      radial-gradient(50% 45% at 90% 85%, rgba(168,85,247,.14), transparent 70%),
      radial-gradient(40% 40% at 50% 50%, rgba(255,201,74,.04), transparent 70%),
      linear-gradient(135deg, #060B14 0%, #0B1324 50%, #060B14 100%);
  }
  .bg-layer::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(0,210,211,.4) 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: .05;
    mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 75%);
  }
  .bg-layer::after {
    content: ""; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: .025;
    pointer-events: none;
  }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(140px); opacity: .3;
    animation: float 24s ease-in-out infinite;
  }
  .blob-1 { width: 560px; height: 560px; background: var(--cyan); top: -12%; right: -12%; }
  .blob-2 { width: 480px; height: 480px; background: var(--violet); bottom: -12%; left: -10%; animation-delay: -12s; opacity: .22; }
  .blob-3 { width: 320px; height: 320px; background: var(--gold); top: 40%; left: 30%; animation-delay: -6s; opacity: .1; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(40px,-50px) scale(1.12); }
  }

  /* ============ HEADER ============ */
  header {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    background: rgba(6,11,20,.7);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1360px; margin: 0 auto;
    padding: 16px 32px;
    display: flex; align-items: center; gap: 32px;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    font-weight: 900; font-size: 22px; letter-spacing: .04em;
    color: var(--white); text-decoration: none; flex-shrink: 0;
  }
  .brand-mark {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(145deg, var(--surface-2), var(--surface-3));
    border: 1px solid rgba(0,210,211,.35);
    display: grid; place-items: center;
    box-shadow: 0 0 24px rgba(0,210,211,.25);
    overflow: hidden;
  }
  .brand-mark svg { width: 100%; height: 100%; }
  .brand-name span { color: var(--cyan); }

  .header-search { flex: 1; max-width: 560px; position: relative; }
  .header-search input {
    width: 100%; height: 46px; padding: 0 18px 0 52px;
    border-radius: 14px;
    background: rgba(255,255,255,.045);
    border: 1px solid var(--border);
    color: var(--white); font-family: var(--font); font-size: 15px;
    transition: all .3s var(--ease);
    backdrop-filter: blur(10px);
  }
  .header-search input::placeholder { color: var(--slate-dim); }
  .header-search input:focus {
    outline: none;
    border-color: rgba(0,210,211,.5);
    background: rgba(255,255,255,.08);
    box-shadow: 0 0 0 4px rgba(0,210,211,.1), 0 0 30px rgba(0,210,211,.08);
  }
  .header-search::after {
    content: "⌕"; position: absolute; left: 18px; top: 50%;
    transform: translateY(-50%); font-size: 20px; color: var(--cyan); opacity: .6;
  }

  /* ============ HERO ============ */
  .hero {
    max-width: 1360px; margin: 0 auto;
    padding: 80px 32px 100px;
    display: grid; grid-template-columns: 1.15fr .85fr;
    gap: 60px; align-items: center;
    min-height: 70vh;
  }
  .hero-text h1 {
    font-size: clamp(36px, 4.8vw, 64px);
    line-height: 1.12; font-weight: 900;
    letter-spacing: -.02em; margin-bottom: 24px;
  }
  .hero-text h1 .cyan { color: var(--cyan); text-shadow: 0 0 40px rgba(0,210,211,.4); }
  .hero-text h1 .violet { color: var(--violet); text-shadow: 0 0 40px rgba(168,85,247,.4); }
  .hero-text p {
    font-size: 18px; color: var(--slate);
    max-width: 520px; margin-bottom: 36px; line-height: 1.9;
  }
  .hero-cta { display: flex; gap: 16px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    height: 54px; padding: 0 30px;
    border-radius: 14px;
    font-family: var(--font); font-size: 15px; font-weight: 800;
    letter-spacing: .02em; border: none; cursor: pointer;
    transition: all .3s var(--ease);
    position: relative; overflow: hidden;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--cyan), #00A3FF);
    color: #060B14;
    box-shadow: 0 8px 28px rgba(0,210,211,.35), 0 0 20px rgba(0,210,211,.2);
  }
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 40px rgba(0,210,211,.5), 0 0 30px rgba(0,210,211,.3);
  }
  .btn-primary:active { transform: scale(.97); }

  .btn-ghost {
    background: rgba(255,255,255,.045);
    color: var(--white);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
  }
  .btn-ghost:hover {
    background: rgba(168,85,247,.1);
    border-color: rgba(168,85,247,.45);
    color: var(--violet);
    transform: translateY(-3px);
    box-shadow: 0 0 30px rgba(168,85,247,.12);
  }
  .btn-ghost:active { transform: scale(.97); }

  /* ============ HERO MASCOT (STICKMAN) ============ */
  .hero-mascot {
    position: relative; display: grid; place-items: center;
    aspect-ratio: 1;
  }
  .hero-mascot::before {
    content: ""; position: absolute; inset: 18%; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,210,211,.35), rgba(168,85,247,.15), transparent 70%);
    filter: blur(50px);
    animation: pulse 6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: .5; transform: scale(1); }
    50% { opacity: .9; transform: scale(1.08); }
  }
  .hero-mascot svg {
    position: relative; width: 68%; height: auto;
    filter: drop-shadow(0 30px 60px rgba(0,210,211,.25));
    animation: bob 4.5s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-16px); }
  }

  /* ============ LIBRARY ============ */
  .library { max-width: 1360px; margin: 0 auto; padding: 60px 32px 120px; }

  .library-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px; margin-bottom: 44px; flex-wrap: wrap;
  }
  .library-head h2 {
    font-size: clamp(26px, 2.8vw, 36px); font-weight: 900;
    letter-spacing: -.01em;
  }
  .library-head h2 span { color: var(--violet); text-shadow: 0 0 30px rgba(168,85,247,.35); }

  .shuffle-btn {
    height: 46px; padding: 0 22px;
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.045);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--white); font-family: var(--font); font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all .3s var(--ease);
    backdrop-filter: blur(10px);
  }
  .shuffle-btn:hover {
    background: rgba(255,201,74,.1);
    border-color: rgba(255,201,74,.45);
    color: var(--gold);
    box-shadow: 0 0 30px rgba(255,201,74,.1);
  }
  .shuffle-btn:active { transform: scale(.96); }

  .video-block { margin-bottom: 32px; }
  .block-row { display: grid; gap: 24px; }
  .block-row-top { grid-template-columns: repeat(3, 1fr); }
  .block-row-bottom { grid-template-columns: repeat(2, 1fr); margin-top: 24px; }

  /* ============ VIDEO CARD ============ */
  .video-card {
    position: relative;
    border-radius: 20px; overflow: hidden;
    background: rgba(255,255,255,.035);
    border: 1px solid var(--border);
    backdrop-filter: blur(16px) saturate(130%);
    -webkit-backdrop-filter: blur(16px) saturate(130%);
    box-shadow: var(--shadow-3d);
    cursor: pointer;
    transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s;
    animation: cardIn .7s var(--ease) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .video-card:hover {
    transform: translateY(-8px);
    border-color: var(--border-hover);
    box-shadow:
      0 1px 0 rgba(255,255,255,.12) inset,
      0 10px 24px rgba(0,0,0,.45),
      0 36px 70px -18px rgba(0,0,0,.7),
      0 0 48px rgba(0,210,211,.08);
  }

  .video-thumb {
    position: relative; aspect-ratio: 16/9;
    background: linear-gradient(135deg, var(--g1), var(--g2));
    overflow: hidden;
    display: grid; place-items: center;
  }
  .video-thumb::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.3) 1px, transparent 1px);
    background-size: 24px 24px; opacity: .08;
  }
  .video-thumb::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 35%, rgba(6,11,20,.75) 100%);
  }

  .video-code {
    position: absolute; top: 16px; right: 16px; z-index: 2;
    padding: 6px 14px; border-radius: 10px;
    background: rgba(6,11,20,.75);
    border: 1px solid rgba(0,210,211,.4);
    color: var(--cyan); font-size: 12px; font-weight: 900;
    letter-spacing: .08em;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(0,210,211,.15);
  }
  .video-duration {
    position: absolute; bottom: 14px; left: 14px; z-index: 2;
    padding: 5px 12px; border-radius: 8px;
    background: rgba(6,11,20,.75);
    color: var(--slate); font-size: 12px; font-weight: 600;
    backdrop-filter: blur(10px);
  }
  .play-btn {
    position: relative; z-index: 2;
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(255,255,255,.12);
    border: 1.5px solid rgba(255,255,255,.35);
    display: grid; place-items: center;
    font-size: 22px; color: var(--white);
    backdrop-filter: blur(10px);
    transition: all .35s var(--ease);
  }
  .play-btn::before { content: "▶"; margin-right: -4px; }
  .video-card:hover .play-btn {
    background: var(--cyan);
    color: #060B14;
    border-color: var(--cyan);
    transform: scale(1.15);
    box-shadow: 0 0 32px rgba(0,210,211,.7);
  }

  .video-body { padding: 20px 22px 24px; }
  .video-body h3 {
    font-size: 16px; font-weight: 700; line-height: 1.5;
    margin-bottom: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .video-cat {
    font-size: 12px; color: var(--violet); font-weight: 700;
    letter-spacing: .04em;
  }

  .no-results { text-align: center; padding: 80px 20px; color: var(--slate); }
  .no-results h3 { font-size: 22px; color: var(--white); margin-bottom: 12px; }

  /* ============ MODAL ============ */
  .modal {
    position: fixed; inset: 0; z-index: 100;
    display: grid; place-items: center; padding: 24px;
    background: rgba(4,7,15,.88);
    backdrop-filter: blur(16px) saturate(120%);
    -webkit-backdrop-filter: blur(16px) saturate(120%);
    opacity: 0; transition: opacity .35s var(--ease);
  }
  .modal[hidden] { display: none; }
  .modal.open { opacity: 1; }

  .modal-inner {
    max-width: 900px; width: 100%;
    background: var(--surface-1);
    border: 1px solid rgba(0,210,211,.2);
    border-radius: 26px; overflow: hidden;
    box-shadow:
      0 50px 120px -24px rgba(0,0,0,.9),
      0 0 80px rgba(0,210,211,.06);
    transform: scale(.94); opacity: 0;
    transition: transform .4s var(--ease), opacity .35s;
    max-height: 90vh; overflow-y: auto;
  }
  .modal.open .modal-inner { transform: scale(1); opacity: 1; }

  .modal-player {
    position: relative; aspect-ratio: 16/9;
    background: linear-gradient(135deg, var(--g1,#111C33), var(--g2,#182645));
    overflow: hidden;
    display: grid; place-items: center;
  }
  .modal-player::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(0,210,211,.25) 1px, transparent 1px);
    background-size: 28px 28px; opacity: .1;
    animation: drift 32s linear infinite;
  }
  @keyframes drift { to { background-position: 280px 280px; } }

  .modal-player .big-stickman { width: 30%; max-width: 200px; opacity: .9; animation: bob 4.5s ease-in-out infinite; }

  .modal-close {
    position: absolute; top: 16px; left: 16px; z-index: 5;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(6,11,20,.8); border: 1px solid var(--border);
    color: var(--white); font-size: 18px; cursor: pointer;
    display: grid; place-items: center;
    transition: all .25s; backdrop-filter: blur(8px);
  }
  .modal-close:hover { background: #FF4D6D; border-color: #FF4D6D; }

  /* ============ KARAOKE ============ */
  .karaoke {
    position: absolute; left: 0; right: 0; bottom: 24px; z-index: 4;
    padding: 0 32px; text-align: center;
    font-size: clamp(20px, 2.6vw, 28px);
    font-weight: 800; line-height: 1.9;
    direction: rtl; white-space: pre-wrap;
    pointer-events: none;
  }
  .karaoke::before {
    content: ""; position: absolute; inset: -20px 0 0;
    background: linear-gradient(0deg, rgba(6,11,20,.75), transparent);
    z-index: -1;
  }
  .word {
    display: inline-block;
    color: rgba(255,255,255,.25);
    transition: color .15s linear, transform .18s var(--ease);
    will-change: color, transform;
  }
  .word.past { color: var(--white); }
  .word.now {
    color: var(--gold);
    font-weight: 900;
    transform: scale(1.1);
    text-shadow: 0 0 18px rgba(255,201,74,.75), 0 0 6px rgba(255,201,74,.9);
  }

  .modal-body { padding: 30px 34px 34px; }
  .modal-body h2 { font-size: 22px; font-weight: 800; margin-bottom: 14px; line-height: 1.45; }

  .modal-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
  .chip {
    padding: 6px 14px; border-radius: 10px; font-size: 12px; font-weight: 700;
    background: rgba(0,210,211,.1);
    color: var(--cyan);
    border: 1px solid rgba(0,210,211,.3);
  }
  .chip.gray {
    background: rgba(255,255,255,.05);
    color: var(--slate);
    border-color: var(--border);
  }

  .modal-actions { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 28px; }

  /* ============ FOOTER ============ */
  footer {
    max-width: 1360px; margin: 0 auto;
    padding: 40px 32px 60px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    gap: 24px; flex-wrap: wrap;
    color: var(--slate); font-size: 14px;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 1000px) {
    .hero { grid-template-columns: 1fr; gap: 40px; padding: 60px 24px 80px; text-align: center; }
    .hero-text p { margin-inline: auto; }
    .hero-cta { justify-content: center; }
    .hero-mascot { max-width: 340px; margin-inline: auto; }
    .block-row-top { grid-template-columns: repeat(2, 1fr); }
    .block-row-bottom { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .header-inner { padding: 12px 16px; gap: 16px; }
    .brand-name { font-size: 16px; }
    .brand-mark { width: 36px; height: 36px; }
    .library, .hero { padding-inline: 20px; }
    .block-row-top, .block-row-bottom { grid-template-columns: 1fr; }
    .block-row-bottom { margin-top: 24px; }
    .modal-body { padding: 22px; }
    .karaoke { padding: 0 16px; bottom: 14px; }
    footer { flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<header>
  <div class="header-inner">
    <a href="#" class="brand">
      <div class="brand-mark">
        <!-- Stickman minimal mark -->
        <svg viewBox="0 0 60 60">
          <circle cx="30" cy="16" r="9" fill="none" stroke="#00D2D3" stroke-width="3.5"/>
          <line x1="30" y1="25" x2="30" y2="42" stroke="#00D2D3" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="30" y1="30" x2="16" y2="38" stroke="#A855F7" stroke-width="3" stroke-linecap="round"/>
          <line x1="30" y1="30" x2="44" y2="38" stroke="#A855F7" stroke-width="3" stroke-linecap="round"/>
          <line x1="30" y1="42" x2="20" y2="54" stroke="#00D2D3" stroke-width="3" stroke-linecap="round"/>
          <line x1="30" y1="42" x2="40" y2="54" stroke="#00D2D3" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-name">APACH<span>I</span></div>
    </a>
    <div class="header-search">
      <input id="search" type="text" placeholder="جستجو با کد (مثل AP-003) یا عنوان...">
    </div>
  </div>
</header>

<main>
  <!-- HERO -->
  <section class="hero">
    <div class="hero-text">
      <h1>علم را با <span class="cyan">آپاچی</span><br><span class="violet">تماشا</span> کن</h1>
      <p>مجموعه‌ای از فیلم‌های علمی کوتاه، پرانرژی و سرگرم‌کننده — با زیرنویس کارائوکه‌ای و روایت آپاچی.</p>
      <div class="hero-cta">
        <button class="btn btn-primary" onclick="document.getElementById('library').scrollIntoView()">شروع تماشا →</button>
        <button class="btn btn-ghost" id="heroShuffle">بُر زدن فیلم‌ها</button>
      </div>
    </div>
    <div class="hero-mascot" id="heroMascot"></div>
  </section>

  <!-- LIBRARY -->
  <section class="library" id="library">
    <div class="library-head">
      <h2>کتابخانه <span>فیلم‌ها</span></h2>
      <div class="library-tools">
        <button class="shuffle-btn" id="shuffleBtn">🔀 بُر زدن</button>
      </div>
    </div>
    <div id="grid"></div>
    <div class="no-results" id="noResults" hidden>
      <h3>چیزی پیدا نشد</h3>
      <p>کد یا عنوان دیگری را امتحان کنید — مثلاً AP-003</p>
    </div>
  </section>
</main>

<footer>
  <div>© APACHI — آکادمی علمی</div>
  <div>ساخته‌شده با ❤️ و کمی علم</div>
</footer>

<!-- MODAL -->
<div class="modal" id="modal" hidden>
  <div class="modal-inner" id="modalInner">
    <div class="modal-player" id="modalPlayer">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="big-stickman" id="modalStickman"></div>
      <div class="karaoke" id="karaoke"></div>
    </div>
    <div class="modal-body">
      <h2 id="modalTitle"></h2>
      <div class="modal-meta">
        <span class="chip" id="modalCode"></span>
        <span class="chip gray" id="modalCat"></span>
        <span class="chip gray" id="modalDur"></span>
      </div>
      <p style="color:var(--slate);font-size:15px;line-height:1.9" id="modalDesc"></p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="replayBtn">🔁 پخش دوباره زیرنویس</button>
        <button class="btn btn-ghost" id="anotherBtn">🎲 فیلم بعدی</button>

/* =============== STATE =============== */
let currentVideos = [...VIDEOS];
let karaokeRAF = null;

/* =============== SHUFFLE =============== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =============== RENDER GRID =============== */
function createCard(v) {
  const card = document.createElement('article');
  card.className = 'video-card';
  card.innerHTML = `
    <div class="video-thumb" style="--g1:${v.g[0]};--g2:${v.g[1]}">
      <span class="video-code">${v.code}</span>
      <div class="play-btn"></div>
      <span class="video-duration">${v.dur}</span>
    </div>
    <div class="video-body">
      <h3>${v.title}</h3>
      <p class="video-cat">${v.cat}</p>
    </div>`;
  card.addEventListener('click', () => openModal(v));
  return card;
}

function renderGrid(list) {
  const grid = document.getElementById('grid');
  const noRes = document.getElementById('noResults');
  grid.innerHTML = '';
  if (list.length === 0) { noRes.hidden = false; return; }
  noRes.hidden = true;

  for (let i = 0; i < list.length; i += 5) {
    const slice = list.slice(i, i + 5);
    const block = document.createElement('div');
    block.className = 'video-block';

    const top = document.createElement('div');
    top.className = 'block-row block-row-top';
    slice.slice(0, 3).forEach(v => top.appendChild(createCard(v)));
    block.appendChild(top);

    if (slice.length > 3) {
      const bottom = document.createElement('div');
      bottom.className = 'block-row block-row-bottom';
      slice.slice(3, 5).forEach(v => bottom.appendChild(createCard(v)));
      block.appendChild(bottom);
    }
    grid.appendChild(block);
  }
}

/* =============== SEARCH =============== */
function filterVideos(q) {
  const s = q.trim().toLowerCase();
  if (!s) return shuffle(VIDEOS);
  return VIDEOS.filter(v =>
    v.code.toLowerCase().includes(s) ||
    v.title.toLowerCase().includes(s) ||
    v.cat.toLowerCase().includes(s)
  );
}

let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    currentVideos = filterVideos(e.target.value);
    renderGrid(currentVideos);
  }, 180);
});

/* =============== SHUFFLE BUTTONS =============== */
function doShuffle() {
  currentVideos = shuffle(currentVideos);
  renderGrid(currentVideos);
  document.getElementById('library').scrollIntoView({ behavior: 'smooth' });
}
document.getElementById('shuffleBtn').addEventListener('click', doShuffle);
document.getElementById('heroShuffle').addEventListener('click', doShuffle);

/* =============== KARAOKE PLAYER =============== */
let activeKaraoke = [];

function buildKaraoke(words) {
  const k = document.getElementById('karaoke');
  k.innerHTML = '';
  words.forEach(o => {
    const el = document.createElement('span');
    el.className = 'word';
    el.textContent = o.w + ' ';
    k.appendChild(el);
  });
}

function playKaraoke() {
  cancelAnimationFrame(karaokeRAF);
  const words = document.querySelectorAll('#karaoke .word');
  words.forEach(w => w.className = 'word');
  const start = performance.now();
  const duration = activeKaraoke.length > 0 ? activeKaraoke[activeKaraoke.length - 1].e + 0.8 : 10;

  function tick(now) {
    const t = (now - start) / 1000;
    activeKaraoke.forEach((k, i) => {
      const el = words[i];
      if (!el) return;
      if (t >= k.e) el.className = 'word past';
      else if (t >= k.s && t < k.e) el.className = 'word now';
      else el.className = 'word';
    });
    if (t < duration) karaokeRAF = requestAnimationFrame(tick);
  }
  karaokeRAF = requestAnimationFrame(tick);
}

/* =============== MODAL =============== */
const modal = document.getElementById('modal');
let currentIdx = 0;

function openModal(v) {
  currentIdx = VIDEOS.findIndex(x => x.code === v.code);
  const player = document.getElementById('modalPlayer');
  player.style.setProperty('--g1', v.g[0]);
  player.style.setProperty('--g2', v.g[1]);

  document.getElementById('modalTitle').textContent = v.title;
  document.getElementById('modalCode').textContent = v.code;
  document.getElementById('modalCat').textContent = v.cat;
  document.getElementById('modalDur').textContent = v.dur;
  document.getElementById('modalDesc').textContent = v.desc;

  activeKaraoke = v.karaoke;

  modal.hidden = false;
  requestAnimationFrame(() => modal.classList.add('open'));

  buildKaraoke(activeKaraoke);
  setTimeout(playKaraoke, 500);
}

function closeModal() {
  cancelAnimationFrame(karaokeRAF);
  modal.classList.remove('open');
  setTimeout(() => { modal.hidden = true; }, 350);
}

document.getElementById('modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !modal.hidden) closeModal();
});
document.getElementById('replayBtn').addEventListener('click', playKaraoke);
document.getElementById('anotherBtn').addEventListener('click', () => {
  const next = VIDEOS[(currentIdx + 1 + Math.floor(Math.random() * (VIDEOS.length - 1))) % VIDEOS.length];
  openModal(next);
});

/* =============== INIT =============== */
currentVideos = shuffle(VIDEOS);
renderGrid(currentVideos);
</script>
