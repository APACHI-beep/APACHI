<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Space Ship</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI',Tahoma,sans-serif; }
  canvas { display:block; width:100%; height:100%; }

  #ui {
    position:fixed; inset:0; pointer-events:none;
    display:flex; justify-content:space-between;
    padding:14px 18px; direction:rtl;
  }
  #rightUI { text-align:right; }
  #leftUI  { text-align:right; }
  .hearts { font-size:26px; letter-spacing:2px; filter:drop-shadow(0 0 6px #ff3355); }
  .hearts .dead { opacity:.25; filter:none; }
  .scoreBox, .recordBox, .coinBox {
    color:#e8f6ff; text-shadow:0 0 8px #38c8ff, 0 0 16px #0060ff;
    font-weight:700; user-select:none;
  }
  .recordBox { font-size:15px; color:#ffd84d; text-shadow:0 0 8px #ff9d00; margin-bottom:4px; }
  .scoreBox  { font-size:22px; }
  .coinBox   { font-size:22px; margin-top:6px; color:#ffe066; text-shadow:0 0 8px #ffb300,0 0 16px #ff7b00; }

  #message {
    position:fixed; top:38%; left:50%; transform:translate(-50%,-50%) scale(0.7);
    color:#fff; font-size:42px; font-weight:900; letter-spacing:2px;
    text-shadow:0 0 12px #ff2b6d, 0 0 30px #ff2b6d, 0 0 60px #ff2b6d;
    opacity:0; transition:all .45s cubic-bezier(.2,1.4,.4,1); pointer-events:none;
    text-align:center; white-space:nowrap;
  }
  #message.show { opacity:1; transform:translate(-50%,-50%) scale(1); }

  #overlay {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px;
    background:radial-gradient(circle at 50% 40%, rgba(0,40,90,.55), rgba(0,0,0,.92));
    backdrop-filter:blur(3px);
    transition:opacity .5s; z-index:10;
  }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #overlay h1 {
    color:#cdeaff; font-size:46px; letter-spacing:4px;
    text-shadow:0 0 14px #38c8ff, 0 0 40px #0060ff;
  }
  #overlay p { color:#7fb6d8; font-size:15px; }
  #startBtn {
    pointer-events:auto; cursor:pointer; border:none;
    padding:14px 52px; font-size:20px; font-weight:800; letter-spacing:2px;
    color:#001018; border-radius:40px;
    background:linear-gradient(180deg,#7ef0ff,#18a8ff);
    box-shadow:0 0 18px #18a8ff, 0 0 50px rgba(24,168,255,.6), inset 0 -3px 0 rgba(0,0,0,.25);
    transition:transform .15s, box-shadow .15s;
  }
  #startBtn:hover { transform:scale(1.06); box-shadow:0 0 26px #6fe3ff,0 0 70px rgba(24,168,255,.8); }
  #startBtn:active{ transform:scale(.97); }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="ui">
  <div id="rightUI">
    <div class="hearts" id="hearts"></div>
  </div>
  <div id="leftUI">
    <div class="recordBox" id="record">رکورد: 0</div>
    <div class="scoreBox" id="score">امتیاز: 0</div>
    <div class="coinBox" id="coins">💰 0</div>
  </div>
</div>

<div id="message"></div>

<div id="overlay">
  <h1>SPACE SHIP</h1>
  <p>با کلیدهای ← → یا A / D حرکت کن — فاصله برای شلیک</p>
  <button id="startBtn">شروع بازی</button>
</div>

<script>
/* ================= Setup ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ================= Storage ================= */
const store = {
  get record(){ return +(localStorage.getItem('sp_record')||0); },
  set record(v){ localStorage.setItem('sp_record', v); },
  get coins(){ return +(localStorage.getItem('sp_coins')||0); },
  set coins(v){ localStorage.setItem('sp_coins', v); }
};

/* ================= State ================= */
const G = {
  running:false, over:false,
  score:0, coins:0, lives:3,
  time:0, spawnTimer:0, spawnInterval:1.1,
  bossPhase:false, boss:null,
  nextBossScore:1000,
  bullets:[], enemies:[], enemyBullets:[], particles:[], stars:[], floatTexts:[],
  keys:{left:false,right:false,fire:false},
  fireCooldown:0, shake:0
};

/* ================= Stars ================= */
function makeStars(){
  G.stars = [];
  const count = Math.floor((W*H)/4500);
  for(let i=0;i<count;i++){
    G.stars.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.6+0.3, s:Math.random()*30+8,
      a:Math.random()*0.7+0.3
    });
  }
}
makeStars();
window.addEventListener('resize', ()=>{ makeStars(); if(!G.running) draw(); });

/* ================= Player ================= */
const player = {
  x:0, y:0, w:64, h:56,
  speed:520
};
function resetPlayer(){
  player.x = W/2;
  player.y = H - 90;
}

/* ================= Helpers ================= */
function rnd(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

/* ================= Shooting ================= */
function shoot(){
  if(G.fireCooldown > 0) return;
  G.fireCooldown = 0.16;
  G.bullets.push({ x:player.x-10, y:player.y-18, r:5, vy:-720 });
  G.bullets.push({ x:player.x+10, y:player.y-18, r:5, vy:-720 });
  burst(player.x, player.y-24, '#6fe3ff', 6, 120);
}

/* ================= Enemy (Hexagon) ================= */
function spawnEnemy(){
  const r = rnd(20, 28);
  G.enemies.push({
    x: rnd(r+20, W-r-20),
    y: -r-20,
    r,
    vy: rnd(70, 130) + G.time*0.6,
    vx: rnd(-40, 40),
    rot: Math.random()*Math.PI,
    rotSpeed: rnd(-1.2, 1.2),
    hp: 1
  });
}

/* ================= Boss ================= */
function spawnBoss(){
  G.bossPhase = true;
  const waveIndex = Math.floor((G.score) / 1000); // برای تعداد تیر
  G.boss = {
    x: W/2, y: -120,
    w: 200, h: 110,
    targetY: 130,
    dir: 1, speed: 180,
    fireTimer: 1.2,
    hp: 40 + waveIndex*12,
    maxHp: 40 + waveIndex*12,
    entering: true,
    bulletsPerVolley: 3 + (waveIndex-1)*2 // هر بار 3، بعد 5، بعد 7 ...
  };
  if(G.boss.bulletsPerVolley < 3) G.boss.bulletsPerVolley = 3;
  showMessage('⚠️ باس وارد شد ⚠️');
}

/* ================= Particles ================= */
function burst(x,y,color,n,spd){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const s = Math.random()*spd+40;
    G.particles.push({
      x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:rnd(0.35,0.8), max:0.8, color, r:rnd(1.5,3.5)
    });
  }
}
function floatText(x,y,txt,color){
  G.floatTexts.push({x,y,txt,color,life:1.1,max:1.1});
}

/* ================= Messages ================= */
let msgTimer = null;
function showMessage(txt){
  const el = document.getElementById('message');
  el.textContent = txt;
  el.classList.add('show');
  clearTimeout(msgTimer);
  msgTimer = setTimeout(()=> el.classList.remove('show'), 1800);
}

/* ================= Input ================= */
window.addEventListener('keydown', e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA') G.keys.left = true;
  if(e.code==='ArrowRight'||e.code==='KeyD') G.keys.right = true;
  if(e.code==='Space'){ G.keys.fire = true; if(G.running) e.preventDefault(); }
});
window.addEventListener('keyup', e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA') G.keys.left = false;
  if(e.code==='ArrowRight'||e.code==='KeyD') G.keys.right = false;
  if(e.code==='Space') G.keys.fire = false;
});

/* ================= UI ================= */
const heartsEl = document.getElementById('hearts');
const scoreEl  = document.getElementById('score');
const coinsEl  = document.getElementById('coins');
const recordEl = document.getElementById('record');

function updateUI(){
  let h = '';
  for(let i=0;i<3;i++){
    h += `<span class="${i<G.lives?'':'dead'}">❤️</span>`;
  }
  heartsEl.innerHTML = h;
  scoreEl.textContent = 'امتیاز: ' + G.score;
  coinsEl.textContent = '💰 ' + G.coins;
  recordEl.textContent = 'رکورد: ' + store.record;
}

/* ================= Game Flow ================= */
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

function startGame(){
  G.running = true; G.over = false;
  G.score = 0; G.coins = store.coins; G.lives = 3;
  G.time = 0; G.spawnTimer = 0; G.spawnInterval = 1.1;
  G.bossPhase = false; G.boss = null; G.nextBossScore = 1000;
  G.bullets = []; G.enemies = []; G.enemyBullets = [];
  G.particles = []; G.floatTexts = [];
  G.fireCooldown = 0; G.shake = 0;
  resetPlayer();
  updateUI();
  overlay.classList.add('hidden');
  showMessage('🚀 شروع!');
}

function gameOver(){
  G.running = false; G.over = true;
  store.coins = G.coins;
  if(G.score > store.record) store.record = G.score;
  updateUI();
  overlay.querySelector('h1').textContent = 'پایان بازی';
  overlay.querySelector('p').textContent = 'امتیاز این دست: ' + G.score + '  |  رکورد: ' + store.record + '  |  💰 ' + G.coins;
  startBtn.textContent = 'بازی مجدد';
  overlay.classList.remove('hidden');
}

startBtn.addEventListener('click', startGame);

/* ================= Update ================= */
function update(dt){
  G.time += dt;
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt*3);

  /* Player movement */
  if(G.keys.left)  player.x -= player.speed*dt;
  if(G.keys.right) player.x += player.speed*dt;
  player.x = clamp(player.x, player.w/2, W - player.w/2);

  /* Fire */
  if(G.fireCooldown > 0) G.fireCooldown -= dt;
  if(G.keys.fire) shoot();

  /* Bullets */
  for(let i=G.bullets.length-1;i>=0;i--){
    const b = G.bullets[i];
    b.y += b.vy*dt;
    if(b.y < -20) G.bullets.splice(i,1);
  }

  /* Spawn enemies */
  if(!G.bossPhase){
    G.spawnTimer -= dt;
    if(G.spawnTimer <= 0){
      spawnEnemy();
      G.spawnTimer = Math.max(0.35, G.spawnInterval - G.time*0.01);
    }
  }

  /* Enemies move */
  for(let i=G.enemies.length-1;i>=0;i--){
    const e = G.enemies[i];
    e.y += e.vy*dt;
    e.x += e.vx*dt;
    if(e.x < e.r){ e.x = e.r; e.vx *= -1; }
    if(e.x > W-e.r){ e.x = W-e.r; e.vx *= -1; }
    e.rot += e.rotSpeed*dt;
    if(e.y > H + 60) G.enemies.splice(i,1);
  }

  /* Bullet vs Enemy */
  for(let i=G.bullets.length-1;i>=0;i--){
    const b = G.bullets[i];
    let hit = false;
    for(let j=G.enemies.length-1;j>=0;j--){
      const e = G.enemies[j];
      const dx = b.x - e.x, dy = b.y - e.y;
      if(dx*dx + dy*dy < (b.r + e.r)*(b.r + e.r)){
        burst(e.x, e.y, '#ff5d8f', 14, 220);
        G.enemies.splice(j,1);
        G.score += 30;
        G.coins += 3;
        store.coins = G.coins;
        floatText(e.x, e.y, '+30', '#7ef0ff');
        floatText(e.x, e.y-20, '+3💰', '#ffe066');
        updateUI();
        checkBossTrigger();
        hit = true;
        break;
      }
    }
    if(hit) G.bullets.splice(i,1);
  }

  /* Boss */
  if(G.boss){
    const bs = G.boss;
    if(bs.entering){
      bs.y += 160*dt;
      if(bs.y >= bs.targetY){ bs.y = bs.targetY; bs.entering = false; }
    } else {
      bs.x += bs.dir*bs.speed*dt;
      if(bs.x > W - bs.w/2){ bs.x = W - bs.w/2; bs.dir = -1; }
      if(bs.x < bs.w/2){ bs.x = bs.w/2; bs.dir = 1; }

      bs.fireTimer -= dt;
      if(bs.fireTimer <= 0){
        bs.fireTimer = 1.35;
        const n = bs.bulletsPerVolley;
        const startX = bs.x - (n-1)*16;
        for(let k=0;k<n;k++){
          G.enemyBullets.push({
            x: startX + k*32, y: bs.y + 40,
            r: 6, vy: 340, vx: 0
          });
        }
      }
    }

    /* Player bullet vs Boss */
    for(let i=G.bullets.length-1;i>=0;i--){
      const b = G.bullets[i];
      if(b.x > bs.x - bs.w/2 && b.x < bs.x + bs.w/2 &&
         b.y > bs.y - bs.h/2 && b.y < bs.y + bs.h/2){
        burst(b.x, b.y, '#ffd84d', 8, 200);
        bs.hp -= 1;
        G.bullets.splice(i,1);
        if(bs.hp <= 0){
          burst(bs.x, bs.y, '#ff7b00', 60, 400);
          burst(bs.x, bs.y, '#ffe066', 40, 300);
          G.shake = 1.2;
          G.score += 100;
          G.coins += 30;
          store.coins = G.coins;
          floatText(bs.x, bs.y, '+100', '#7ef0ff');
          floatText(bs.x, bs.y-25, '+30💰', '#ffe066');
          G.boss = null;
          G.bossPhase = false;
          updateUI();
          showMessage('🌊 موج بعدی');
          checkBossTrigger();
        }
      }
    }
  }

  /* Enemy bullets */
  for(let i=G.enemyBullets.length-1;i>=0;i--){
    const b = G.enemyBullets[i];
    b.x += b.vx*dt;
    b.y += b.vy*dt;
    if(b.y > H + 20 || b.x < -20 || b.x > W+20){ G.enemyBullets.splice(i,1); continue; }
    if(!G.over){
      const dx = b.x - player.x, dy = b.y - player.y;
      if(dx*dx + dy*dy < (b.r + 16)*(b.r + 16)){
        G.enemyBullets.splice(i,1);
        hitPlayer();
      }
    }
  }

  /* Enemy vs Player collision */
  if(!G.over && !G.boss){
    for(let i=G.enemies.length-1;i>=0;i--){
      const e = G.enemies[i];
      const dx = e.x - player.x, dy = e.y - player.y;
      if(Math.abs(dx) < e.r + 18 && Math.abs(dy) < e.r + 16){
        burst(e.x, e.y, '#ff3355', 18, 260);
        G.enemies.splice(i,1);
        hitPlayer();
      }
    }
  }

  /* Particles */
  for(let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt;
    if(p.life <= 0) G.particles.splice(i,1);
  }

  /* Float texts */
  for(let i=G.floatTexts.length-1;i>=0;i--){
    const f = G.floatTexts[i];
    f.y -= 50*dt;
    f.life -= dt;
    if(f.life <= 0) G.floatTexts.splice(i,1);
  }

  /* Stars */
  for(const s of G.stars){
    s.y += s.s*dt*(0.3 + s.r*0.3);
    if(s.y > H){ s.y = -4; s.x = Math.random()*W; }
  }
}

function checkBossTrigger(){
  if(!G.bossPhase && G.score >= G.nextBossScore){
    G.nextBossScore += 1000;
    spawnBoss();
  }
}

function hitPlayer(){
  G.lives--;
  G.shake = 1.0;
  burst(player.x, player.y, '#7ef0ff', 30, 320);
  burst(player.x, player.y, '#ff3355', 20, 260);
  if(G.lives <= 0){
    G.lives = 0;
    updateUI();
    setTimeout(gameOver, 250);
  } else {
    player.x = W/2;
    updateUI();
  }
}

/* ================= Draw ================= */
function drawShip(x,y){
  ctx.save();
  ctx.translate(x,y);

  // Glow
  ctx.shadowColor = '#38c8ff';
  ctx.shadowBlur = 18;

  // Body B-2 style
  ctx.fillStyle = '#132a3d';
  ctx.strokeStyle = '#6fe3ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -28);              // nose (sharp)
  ctx.lineTo(-30, 16);             // left wing back
  ctx.lineTo(-16, 6);
  ctx.lineTo(-8, 18);
  ctx.lineTo(0, 24);               // rear tip
  ctx.lineTo(8, 18);
  ctx.lineTo(16, 6);
  ctx.lineTo(30, 16);              // right wing back
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Cockpit glow
  ctx.shadowBlur = 12;
  ctx.shadowColor = '#aef4ff';
  ctx.fillStyle = 'rgba(110,220,255,.85)';
  ctx.beginPath();
  ctx.ellipse(0, -6, 6, 10, 0, 0, Math.PI*2);
  ctx.fill();

  // Engine glow
  ctx.shadowColor = '#38c8ff';
  ctx.shadowBlur = 22;
  const g = ctx.createRadialGradient(0,22,0, 0,22,18);
  g.addColorStop(0,'rgba(110,230,255,.95)');
  g.addColorStop(1,'rgba(0,120,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0,22,18,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawHexagon(x,y,r,rot){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);

  ctx.shadowColor = '#ff2b6d';
  ctx.shadowBlur = 16;

  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a = (Math.PI/3)*i - Math.PI/2;
    const px = Math.cos(a)*r, py = Math.sin(a)*r;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();

  const grad = ctx.createRadialGradient(0,0,r*0.2, 0,0,r);
  grad.addColorStop(0,'rgba(255,90,140,.25)');
  grad.addColorStop(1,'rgba(255,43,109,.05)');
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.strokeStyle = '#ff4d7d';
  ctx.lineWidth = 2.4;
  ctx.stroke();

  // inner hexagon faint
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,120,160,.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a = (Math.PI/3)*i - Math.PI/2;
    const px = Math.cos(a)*r*0.6, py = Math.sin(a)*r*0.6;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.stroke();

  ctx.restore();
}

function drawBoss(bs){
  ctx.save();
  ctx.translate(bs.x, bs.y);

  ctx.shadowColor = '#ff2b6d';
  ctx.shadowBlur = 28;

  // big body
  ctx.beginPath();
  ctx.moveTo(-bs.w/2, -bs.h/2);
  ctx.lineTo(bs.w/2, -bs.h/2);
  ctx.lineTo(bs.w/2 + 30, 0);
  ctx.lineTo(bs.w/2, bs.h/2);
  ctx.lineTo(-bs.w/2, bs.h/2);
  ctx.lineTo(-bs.w/2 - 30, 0);
  ctx.closePath();

  const grad = ctx.createLinearGradient(0,-bs.h/2,0,bs.h/2);
  grad.addColorStop(0,'#3a0a1a');
  grad.addColorStop(0.5,'#8a1030');
  grad.addColorStop(1,'#2a0612');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#ff4d7d';
  ctx.lineWidth = 3;
  ctx.stroke();

  // core
  ctx.shadowColor = '#ffd84d';
  ctx.shadowBlur = 30;
  const cg = ctx.createRadialGradient(0,0,4, 0,0,34);
  cg.addColorStop(0,'#fff5c0');
  cg.addColorStop(0.5,'#ffcc33');
  cg.addColorStop(1,'rgba(255,80,0,0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(0,0,34,0,Math.PI*2);
  ctx.fill();

  // cannons
  ctx.shadowColor = '#ff4d7d';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#ff2b6d';
  const cannons = Math.min(bs.bulletsPerVolley, 9);
  const step = (bs.w-40)/Math.max(1,(cannons-1));
  for(let i=0;i<cannons;i++){
    const cx = -bs.w/2 + 20 + i*step;
    ctx.beginPath();
    ctx.arc(cx, bs.h/2-6, 5, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  // HP bar
  const pct = Math.max(0, bs.hp/bs.maxHp);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(W/2 - 160, 20, 320, 14);
  const g2 = ctx.createLinearGradient(W/2-160,0,W/2+160,0);
  g2.addColorStop(0,'#ff2b6d');
  g2.addColorStop(1,'#ffd84d');
  ctx.fillStyle = g2;
  ctx.fillRect(W/2 - 160, 20, 320*pct, 14);
  ctx.strokeStyle = '#ff4d7d';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(W/2 - 160, 20, 320, 14);
  ctx.restore();
}

function draw(){
  // Background
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  // Stars
  for(const s of G.stars){
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Shake
  ctx.save();
  if(G.shake > 0){
    const m = G.shake * 8;
    ctx.translate(rnd(-m,m), rnd(-m,m));
  }

  // Particles
  for(const p of G.particles){
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r*a, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // Enemy bullets
  for(const b of G.enemyBullets){
    ctx.shadowColor = '#ff4d7d';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#ff4d7d';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // Player bullets
  for(const b of G.bullets){
    ctx.shadowColor = '#6fe3ff';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#bff6ff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // Enemies
  for(const e of G.enemies){
    drawHexagon(e.x, e.y, e.r, e.rot);
  }

  // Boss
  if(G.boss) drawBoss(G.boss);

  // Player
  if(!G.over && G.running) drawShip(player.x, player.y);

  // Float texts
  for(const f of G.floatTexts){
    const a = f.life / f.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = f.color;
    ctx.font = 'bold 18px Segoe UI, Tahoma';
    ctx.textAlign = 'center';
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 12;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  ctx.restore();
}

/* ================= Loop ================= */
let last = performance.now();
function loop(now){
  const dt = Math.min((now - last)/1000, 0.05);
  last = now;

  if(G.running && !G.over) update(dt);
  else {
    // Even paused, animate stars slowly
    for(const s of G.stars){
      s.y += s.s*dt*0.15;
      if(s.y > H){ s.y = -4; s.x = Math.random()*W; }
    }
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* init display */
updateUI();
</script>
