<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Space Ship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Vazirmatn:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif; touch-action:none; user-select:none; }
  canvas { display:block; width:100%; height:100%; }

  /* ===== Top Tabs ===== */
  #tabs {
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:center;
    gap:4px; padding:10px;
    z-index:6; pointer-events:auto;
    background:linear-gradient(180deg, rgba(0,10,25,.9), rgba(0,10,25,0));
    opacity:0; pointer-events:none; transition:opacity .3s;
  }
  #tabs.active { opacity:1; pointer-events:auto; }
  
  .tab {
    display:flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:12px;
    font-family:'Vazirmatn',sans-serif;
    font-weight:800; font-size:13px;
    color:#9fd4ec; background:rgba(15,35,60,.65);
    border:1px solid rgba(90,170,220,.35);
    cursor:pointer; transition:all .2s; user-select:none;
  }
  .tab svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .tab.active {
    color:#001018; background:linear-gradient(180deg,#8ff0ff,#18a8ff);
    border-color:#8ff0ff;
    box-shadow:0 0 14px rgba(56,200,255,.65), inset 0 -2px 0 rgba(0,0,0,.25);
  }
  .tab:active { transform:scale(.95); }

  /* ===== HUD ===== */
  #ui { position:fixed; inset:0; pointer-events:none; padding:50px 10px 8px; direction:rtl; z-index:5; display:none; }
  #ui.show { display:block; }

  #rightUI { position:absolute; top:50px; right:10px; display:flex; gap:6px; }
  .heart {
    width:24px; height:24px;
    background:radial-gradient(circle at 35% 30%, #ffe1e6 0%, #ff1744 25%, #c10d33 70%, #6a0018 100%);
    clip-path: path('M12,22 C-2,12 -2,4 5,2 C9,1 12,3 12,6 C12,3 15,1 19,2 C26,4 26,12 12,22 Z');
    filter:drop-shadow(0 0 8px #ff1744) drop-shadow(0 0 15px rgba(255,23,68,0.5));
  }
  .heart.dead { opacity:0; }

  #leftUI {
    position:absolute; top:50px; left:10px; text-align:right;
    display:flex; flex-direction:column; gap:4px;
  }
  .pill {
    padding:3px 9px; border-radius:10px;
    background:linear-gradient(180deg, rgba(40,80,140,.55), rgba(10,20,40,.65));
    border:1px solid rgba(120,210,255,.55);
    box-shadow:inset 0 0 6px rgba(120,210,255,.25), 0 0 8px rgba(56,200,255,.25);
    backdrop-filter:blur(4px);
    font-family:'Orbitron','Vazirmatn',sans-serif;
    font-weight:800; line-height:1.1; white-space:nowrap; direction:ltr;
  }
  .recordBox { color:#ffd84d; font-size:12px; text-shadow:0 0 6px #ff9d00, 0 0 12px #ff6a00; }
  .scoreBox  { color:#cdf1ff; font-size:16px; text-shadow:0 0 6px #38c8ff, 0 0 12px #0060ff; }
  .coinBox   { color:#ffe27a; font-size:16px; text-shadow:0 0 6px #ffb300, 0 0 12px #ff7b00; }

  /* ===== Lobby Screen ===== */
  #lobby {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end; padding-bottom:40px;
    background:radial-gradient(circle at 50% 30%, rgba(0,30,60,.7), rgba(0,0,0,.98));
    z-index:8; transition:opacity .4s; font-family:'Vazirmatn',sans-serif;
  }
  #lobby.hidden { opacity:0; pointer-events:none; }
  
  #lobbyTitle {
    position:absolute; top:15%; font-size:32px; font-weight:900; color:#cdeaff;
    text-shadow:0 0 20px #38c8ff, 0 0 40px #0060ff; letter-spacing:3px;
  }
  #lobbyShip {
    position:absolute; top:40%; left:50%; transform:translate(-50%,-50%);
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translate(-50%, -50%); }
    50% { transform: translate(-50%, -60%); }
  }

  .lobby-btns { display:flex; flex-direction:column; gap:12px; width:80%; max-width:300px; z-index:10; margin-top:auto;}
  
  #startBtn {
    cursor:pointer; border:none; padding:16px 0; font-size:20px; font-weight:900;
    color:#001018; border-radius:40px; font-family:'Vazirmatn',sans-serif;
    background:linear-gradient(180deg,#7ef0ff,#18a8ff);
    box-shadow:0 0 20px #18a8ff, 0 0 50px rgba(24,168,255,.6), inset 0 -3px 0 rgba(0,0,0,.25);
    transition:transform .15s;
  }
  #startBtn:active { transform:scale(.95); }

  .secondary-btns { display:flex; gap:8px; justify-content:space-between; }
  .secBtn {
    flex:1; cursor:pointer; border:1px solid rgba(90,170,220,.5);
    background:rgba(10,25,45,.8); color:#9fd4ec; padding:12px 0;
    border-radius:12px; font-size:14px; font-weight:800; font-family:'Vazirmatn',sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:4px; transition:all .15s;
  }
  .secBtn:active { transform:scale(.95); }
  .secBtn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

  /* ===== Message ===== */
  #message {
    position:fixed; top:35%; left:50%; transform:translate(-50%,-50%) scale(0.7);
    color:#fff; font-size:32px; font-weight:900;
    text-shadow:0 0 15px #ff2b6d, 0 0 35px #ff2b6d, 0 0 60px #ff2b6d;
    opacity:0; transition:all .45s cubic-bezier(.2,1.4,.4,1); pointer-events:none;
    text-align:center; white-space:nowrap; z-index:7; font-family:'Vazirmatn',sans-serif;
  }
  #message.show { opacity:1; transform:translate(-50%,-50%) scale(1); }

  /* ===== Shop/Modal Overlay ===== */
  #shopPanel {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(0,40,90,.75), rgba(0,0,0,.96));
    backdrop-filter:blur(6px); opacity:0; pointer-events:none; transition:opacity .3s; z-index:20;
  }
  #shopPanel.show { opacity:1; pointer-events:auto; }
  .shopCard {
    background:linear-gradient(180deg, rgba(15,30,55,.98), rgba(5,12,26,.98));
    border:1px solid #38c8ff; border-radius:20px; padding:26px 24px;
    box-shadow:0 0 40px rgba(56,200,255,.5), inset 0 0 24px rgba(56,200,255,.18);
    text-align:center; max-width:88vw;
  }
  .shopCard h2 { color:#8fefff; font-size:22px; margin-bottom:12px; letter-spacing:2px; text-shadow:0 0 14px #38c8ff; }
  .shopCard p  { color:#cdeaff; font-size:15px; margin-bottom:18px; line-height:1.8; }
  .shopCard button {
    pointer-events:auto; cursor:pointer; border:none;
    padding:10px 32px; font-size:15px; font-weight:800;
    color:#001018; border-radius:30px; font-family:'Vazirmatn',sans-serif;
    background:linear-gradient(180deg,#7ef0ff,#18a8ff);
    box-shadow:0 0 14px #18a8ff, inset 0 -2px 0 rgba(0,0,0,.25);
  }
  .shopCard button:active { transform:scale(.96); }

  /* ===== Game Over ===== */
  #gameOver {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(0,20,40,.9), rgba(0,0,0,.98));
    backdrop-filter:blur(4px); transition:opacity .3s; z-index:10; opacity:0; pointer-events:none;
    font-family:'Vazirmatn', sans-serif;
  }
  #gameOver.show { opacity:1; pointer-events:auto; }
  .go-title {
    font-size:40px; font-weight:900; color:#ff1744;
    text-shadow:0 0 20px #ff1744, 0 0 50px #ff1744, 0 0 80px #ff1744;
    margin-bottom:30px; display:flex; align-items:center; gap:12px;
  }
  .go-title svg { width:38px; height:38px; fill:#ff1744; filter:drop-shadow(0 0 12px #ff1744); }
  .go-sub { color:#fff; font-size:18px; font-weight:800; margin-bottom:25px; text-shadow:0 0 8px rgba(255,255,255,.5); }
  .go-score { color:#fff; font-size:20px; font-weight:800; margin-bottom:15px; display:flex; gap:5px;}
  .go-reward { color:#ffe000; font-size:20px; font-weight:800; margin-bottom:40px; display:flex; gap:8px; align-items:center; text-shadow:0 0 10px #ffe000; }
  .go-reward svg { width:22px; height:22px; fill:#ffe000; }
  #restartBtn {
    cursor:pointer; border:none; padding:16px 60px; font-size:20px; font-weight:900;
    color:#fff; border-radius:50px; font-family:'Vazirmatn',sans-serif;
    background:linear-gradient(180deg, #ff4081, #e91e63);
    box-shadow:0 0 20px #e91e63, 0 0 50px rgba(233,30,99,0.6), inset 0 -3px 0 rgba(0,0,0,.2);
    transition:transform .15s;
  }
  #restartBtn:active { transform:scale(.95); }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- Top tabs -->
<div id="tabs">
  <div class="tab active" id="tabGame">
    <svg viewBox="0 0 24 24"><path d="M6 12h4M8 10v4"/><circle cx="15.5" cy="11" r="1.2"/><circle cx="18.5" cy="13" r="1.2"/><path d="M17.5 2c2 3 2 6-1 9l-2-2c2-2 2-5 3-7z"/><path d="M6 2C4 5 4 8 7 11l2-2C7 7 7 4 6 2z"/></svg>
    <span>بازی</span>
  </div>
  <div class="tab" id="tabShop">
    <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
    <span>فروشگاه</span>
  </div>
  <div class="tab" id="tabRank">
    <svg viewBox="0 0 24 24"><path d="M8 21l4-9 4 9M12 12v9M6 3h12v6a6 6 0 0 1-12 0V3z"/></svg>
    <span>رتبه بندی</span>
  </div>
  <div class="tab" id="tabProfile">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg>
    <span>پروفایل</span>
  </div>
</div>

<div id="ui">
  <div id="rightUI">
    <div class="heart" id="h1"></div>
    <div class="heart" id="h2"></div>
    <div class="heart" id="h3"></div>
  </div>
  <div id="leftUI">
    <div class="pill recordBox" id="record">0</div>
    <div class="pill scoreBox" id="score">0</div>
    <div class="pill coinBox" id="coins">💰 0</div>
  </div>
</div>

<div id="message"></div>

<!-- Modal for other tabs -->
<div id="shopPanel">
  <div class="shopCard">
    <h2 id="modalTitle">🛍️</h2>
    <p>این بخش به زودی اضافه می‌شود</p>
    <button id="shopClose">باشه</button>
  </div>
</div>

<!-- Lobby Screen -->
<div id="lobby">
  <div id="lobbyTitle">SPACE SHIP</div>
  <div id="lobbyShip"></div>
  
  <div class="lobby-btns">
    <button id="startBtn">شروع بازی</button>
    <div class="secondary-btns">
      <div class="secBtn" id="lobbyShop">
        <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        فروشگاه
      </div>
      <div class="secBtn" id="lobbyRank">
        <svg viewBox="0 0 24 24"><path d="M8 21l4-9 4 9M12 12v9M6 3h12v6a6 6 0 0 1-12 0V3z"/></svg>
        رتبه بندی
      </div>
      <div class="secBtn" id="lobbyProfile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg>
        پروفایل
      </div>
    </div>
  </div>
</div>

<div id="gameOver">
  <div class="go-title">
    <svg viewBox="0 0 24 24"><path d="M12 2L14.5 9.5H22L15.8 13.8L18.3 21.5L12 17.2L5.7 21.5L8.2 13.8L2 9.5H9.5L12 2Z"/></svg>
    بازی تمام شد!
  </div>
  <div class="go-sub">جونات تموم شد...</div>
  <div class="go-score">امتیاز این دست: <span id="goScore">0</span></div>
  <div class="go-reward">
    پاداش سکه: <span id="goReward">0</span>
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd700" stroke="#b8860b" stroke-width="2"/><text x="12" y="16" font-size="12" font-weight="bold" fill="#b8860b" text-anchor="middle">$</text></svg>
  </div>
  <button id="restartBtn">شروع مجدد</button>
</div>

<script>
/* ================================================================
   SPACE SHIP — v4
   ================================================================ */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha:false });
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildCaches();
  drawLobbyShip();
}
window.addEventListener('resize', ()=>{ resize(); });

const store = {
  get record(){ return +(localStorage.getItem('sp_record')||0); },
  set record(v){ localStorage.setItem('sp_record', v); },
  get coins(){ return +(localStorage.getItem('sp_coins')||0); },
  set coins(v){ localStorage.setItem('sp_coins', v); }
};

const G = {
  running:false, over:false, inLobby:true,
  score:0, lives:3, runCoins:0,
  time:0, spawnTimer:0.4, spawnInterval:1.0,
  bossPhase:false, boss:null,
  nextBossScore:1000,
  bullets:[], miniBullets:[],
  enemies:[], enemyBullets:[],
  particles:[], stars:[], floatTexts:[],
  touch:{active:false, x:0, y:0},
  fireCooldown:0, shake:0, flash:0,
  MAX_PARTICLES: 120
};

/* ---------- caches ---------- */
const caches = {};
function makeCanvas(w,h){
  const c = document.createElement('canvas');
  c.width = Math.max(1,Math.ceil(w)); c.height = Math.max(1,Math.ceil(h));
  return c;
}
function makeGlow(color, radius, intensity=1){
  const size = radius*2;
  const c = makeCanvas(size,size);
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(radius,radius,1, radius,radius,radius);
  grad.addColorStop(0, color.replace('1)', (1*intensity)+')'));
  grad.addColorStop(0.45, color.replace('1)', (0.55*intensity)+')'));
  grad.addColorStop(1, color.replace('1)', '0)'));
  g.fillStyle = grad;
  g.fillRect(0,0,size,size);
  return c;
}

/* ---------- Enemy Sprite (Hexagon) ---------- */
function makeEnemySprite(r){
  const pad = r*0.6;
  const size = (r+pad)*2;
  const c = makeCanvas(size,size);
  const g = c.getContext('2d');
  g.translate(size/2, size/2);

  const halo = g.createRadialGradient(0,0,r*0.5, 0,0,r*1.5);
  halo.addColorStop(0,'rgba(255,50,90,0.4)');
  halo.addColorStop(1,'rgba(255,0,50,0)');
  g.fillStyle = halo;
  g.beginPath(); g.arc(0,0,r*1.5,0,Math.PI*2); g.fill();

  const hexPath = (rad)=>{
    g.beginPath();
    for(let i=0;i<6;i++){
      const a = (Math.PI/3)*i - Math.PI/2;
      const px = Math.cos(a)*rad, py = Math.sin(a)*rad;
      if(i===0) g.moveTo(px,py); else g.lineTo(px,py);
    }
    g.closePath();
  };

  hexPath(r);
  g.fillStyle = 'rgba(60, 0, 15, 0.7)';
  g.fill();

  g.strokeStyle = '#ff3355';
  g.lineWidth = 2.5;
  hexPath(r);
  g.stroke();

  g.strokeStyle = 'rgba(255,100,120,0.25)';
  g.lineWidth = 1;
  hexPath(r*0.7);
  g.stroke();

  return c;
}

/* ---------- Main Ship Sprite (Original high-quality red) ---------- */
function makeShipSprite(scale){
  const c = makeCanvas(100*scale, 100*scale);
  const g = c.getContext('2d');
  g.scale(scale,scale);
  g.translate(50, 50);

  // Red hull
  g.beginPath();
  g.moveTo(0, -32);
  g.lineTo(-24, 18);
  g.lineTo(0, 26);
  g.lineTo(24, 18);
  g.closePath();
  g.fillStyle = '#e60026';
  g.fill();
  
  // Grey center panel
  g.beginPath();
  g.moveTo(0, -20);
  g.lineTo(-8, 22);
  g.lineTo(8, 22);
  g.closePath();
  g.fillStyle = '#6a7075';
  g.fill();

  // Blue/Teal Cockpit (Gradient)
  const cg = g.createLinearGradient(0, -15, 0, 8);
  cg.addColorStop(0, '#b2f5ff');
  cg.addColorStop(1, '#00bfff');
  g.beginPath();
  g.moveTo(0, -22);
  g.lineTo(-6, 4);
  g.lineTo(6, 4);
  g.closePath();
  g.fillStyle = cg;
  g.fill();

  // Engine glow
  const eg = g.createRadialGradient(0, 28, 1, 0, 28, 15);
  eg.addColorStop(0, 'rgba(255,255,255,1)');
  eg.addColorStop(0.4, 'rgba(255,50,100,0.8)');
  eg.addColorStop(1, 'rgba(255,0,0,0)');
  g.fillStyle = eg;
  g.beginPath();
  g.arc(0, 28, 15, 0, Math.PI*2);
  g.fill();

  return c;
}

/* ---------- Mini Ship Sprite ---------- */
function makeMiniSprite(scale){
  const c = makeCanvas(40*scale, 40*scale);
  const g = c.getContext('2d');
  g.scale(scale,scale);
  g.translate(20, 20);

  // Glow
  const eg = g.createRadialGradient(0, 10, 1, 0, 10, 10);
  eg.addColorStop(0, 'rgba(0,255,255,0.6)');
  eg.addColorStop(1, 'rgba(0,255,255,0)');
  g.fillStyle = eg;
  g.beginPath(); g.arc(0, 10, 10, 0, Math.PI*2); g.fill();

  // Body
  g.beginPath();
  g.moveTo(0, -16);
  g.lineTo(-12, 10);
  g.lineTo(0, 14);
  g.lineTo(12, 10);
  g.closePath();
  g.fillStyle = '#00ffff';
  g.fill();
  g.strokeStyle = '#ffffff';
  g.lineWidth = 1;
  g.stroke();
  
  // Cockpit
  g.beginPath();
  g.moveTo(0, -12);
  g.lineTo(-4, 12);
  g.lineTo(4, 12);
  g.closePath();
  g.fillStyle = 'rgba(255,255,255,0.8)';
  g.fill();

  return c;
}

/* ---------- Boss Sprite ---------- */
function makeBossSprite(w,h,variant){
  const pad = 70;
  const c = makeCanvas(w+pad*2, h+pad*2);
  const g = c.getContext('2d');
  g.translate((w+pad*2)/2, (h+pad*2)/2);

  const aura = g.createRadialGradient(0,0,10, 0,0, w*0.9);
  aura.addColorStop(0,'rgba(255,50,100,0.5)');
  aura.addColorStop(1,'rgba(255,0,50,0)');
  g.fillStyle = aura;
  g.beginPath(); g.arc(0,0,w*0.9,0,Math.PI*2); g.fill();

  const shape = ()=>{
    g.beginPath();
    const hw = w/2, hh = h/2;
    if(variant === 0){
      g.moveTo(-hw, hh*0.5);
      g.quadraticCurveTo(-hw*0.8, -hh*1.1, 0, -hh*1.2);
      g.quadraticCurveTo(hw*0.8, -hh*1.1, hw, hh*0.5);
      g.lineTo(0, hh*1.1);
      g.closePath();
    } else if(variant === 1){
      g.moveTo(0, -hh*1.4);
      g.lineTo(hw*1.1, -hh*0.2);
      g.lineTo(hw*0.5, hh*0.3);
      g.lineTo(hw*0.9, hh*0.9);
      g.lineTo(0, hh*1.1);
      g.lineTo(-hw*0.9, hh*0.9);
      g.lineTo(-hw*0.5, hh*0.3);
      g.lineTo(-hw*1.1, -hh*0.2);
      g.closePath();
    } else {
      g.moveTo(-hw*1.1, 0);
      g.lineTo(-hw*0.5, -hh*0.9);
      g.lineTo(hw*0.5, -hh*0.9);
      g.lineTo(hw*1.1, 0);
      g.lineTo(hw*0.5, hh*0.9);
      g.lineTo(-hw*0.5, hh*0.9);
      g.closePath();
    }
  };

  shape();
  g.lineWidth = 8; g.strokeStyle = 'rgba(255,50,90,0.2)'; g.stroke();
  
  shape();
  const grad = g.createLinearGradient(0,-h/2,0,h/2);
  grad.addColorStop(0,'#7a0a1a');
  grad.addColorStop(0.5,'#b01030');
  grad.addColorStop(1,'#3a0510');
  g.fillStyle = grad; g.fill();
  g.lineWidth = 2.5; g.strokeStyle = '#ff3b5c'; g.stroke();

  g.strokeStyle = 'rgba(255,150,170,0.3)';
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(-w/2+20, -h/2+15); g.lineTo(w/2-20, -h/2+15);
  g.moveTo(-w/2+20, h/2-15); g.lineTo(w/2-20, h/2-15);
  g.stroke();

  g.fillStyle = '#ff5577';
  for(let i=0; i<5; i++){
    g.beginPath();
    g.arc(-w/2 + 20 + i*((w-40)/4), h/2 - 8, 3.5, 0, Math.PI*2);
    g.fill();
  }

  return c;
}

function buildCaches(){
  caches.stars = [
    makeGlow('rgba(255,255,255,1)', 1.5, 1),
    makeGlow('rgba(255,255,255,1)', 2.5, 0.8),
    makeGlow('rgba(200,220,255,1)', 3.5, 0.6)
  ];
  caches.ship = makeShipSprite(1.2);
  caches.mini = makeMiniSprite(1.2);
  caches.particles = {
    '#ff5d8f': makeGlow('rgba(255,93,143,1)', 6, 0.9),
    '#00ffff': makeGlow('rgba(0,255,255,1)', 6, 0.9)
  };
  
  if(G.boss){
    caches.boss = makeBossSprite(G.boss.w, G.boss.h, G.boss.variant);
  }
  makeStars();
}

function makeStars(){
  G.stars = [];
  const count = Math.floor((W*H)/6000);
  for(let i=0;i<count;i++){
    G.stars.push({
      x: Math.random()*W,
      y: Math.random()*H,
      r: Math.random()*1.5 + 0.5,
      s: Math.random()*100 + 50,
      layer: Math.floor(Math.random()*2)
    });
  }
}

const player = { x:0, y:0, hitCooldown:0 };
const minis = [{ offset: -45, fireTimer: 0 }, { offset: 45, fireTimer: 0 }];

function resetPlayer(){
  player.x = W/2;
  player.y = H - 90;
  player.hitCooldown = 0;
  for(const m of minis){ m.fireTimer = 0; }
}

function rnd(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

/* ---------- Shooting ---------- */
function shoot(){
  if(G.fireCooldown > 0) return;
  G.fireCooldown = 0.18;
  G.bullets.push({ x: player.x, y: player.y - 35, w: 3, h: 12, vy: -800 });
}

function shootMini(m){
  G.miniBullets.push({ x: player.x + m.offset, y: player.y, w: 2, h: 10, vy: -700 });
}

/* ---------- Enemy ---------- */
function spawnEnemy(){
  const baseR = clamp(Math.min(W,H) * 0.04, 15, 40);
  const r = baseR * rnd(0.6, 1.4); 
  G.enemies.push({
    x: rnd(r+20, W-r-20), y: -r-20, r,
    vy: rnd(80, 150) + G.time*0.5, vx: rnd(-30, 30),
    rot: Math.random()*Math.PI, rotSpeed: rnd(-1, 1),
    sprite: makeEnemySprite(r)
  });
}

/* ---------- Boss ---------- */
function spawnBoss(){
  G.bossPhase = true;
  const waveIndex = Math.max(1, Math.floor(G.score / 1000));
  const bw = clamp(W * 0.45, 150, 260);
  const variant = (waveIndex - 1) % 3;
  G.boss = {
    x: W/2, y: -bw*0.5, w: bw, h: bw*0.55,
    targetY: Math.min(130, H*0.16), dir: 1, speed: W * 0.18,
    fireTimer: 1.2, hp: 25 + waveIndex * 5, maxHp: 25 + waveIndex * 5,
    entering: true, bulletsPerVolley: 3, variant, t: 0
  };
  caches.boss = makeBossSprite(G.boss.w, G.boss.h, variant);
  showMessage('⚠️ Danger Zone ⚠️'); // پیام باس
}

function burst(x,y,color,n){
  if(G.particles.length >= G.MAX_PARTICLES) return;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const s = Math.random()*100+50;
    G.particles.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.5, color, r:rnd(1.5,3) });
  }
}

function showMessage(txt){
  const el = document.getElementById('message');
  el.textContent = txt;
  el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 1600);
}

/* ---------- Input ---------- */
function onPointerDown(e){
  if(G.over || G.inLobby || !G.running) return;
  const t = e.touches ? e.touches[0] : e;
  G.touch.active = true;
  if(e.cancelable) e.preventDefault();
}
function onPointerMove(e){
  if(!G.touch.active || G.over || G.inLobby || !G.running) return;
  const t = e.touches ? e.touches[0] : e;
  player.x = t.clientX;
  player.y = Math.max(t.clientY - 40, H*0.4);
  if(e.cancelable) e.preventDefault();
}
function onPointerUp(){ G.touch.active = false; }

cv.addEventListener('touchstart', onPointerDown, {passive:false});
cv.addEventListener('touchmove', onPointerMove, {passive:false});
cv.addEventListener('touchend', onPointerUp);
cv.addEventListener('touchcancel', onPointerUp);
cv.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', e=>{ if(G.touch.active) onPointerMove(e); });
window.addEventListener('mouseup', onPointerUp);

/* ---------- UI ---------- */
const scoreEl = document.getElementById('score');
const coinsEl = document.getElementById('coins');
const recordEl = document.getElementById('record');
const hEls = [document.getElementById('h1'), document.getElementById('h2'), document.getElementById('h3')];
const tabsEl = document.getElementById('tabs');
const uiEl = document.getElementById('ui');
const lobbyEl = document.getElementById('lobby');

function updateUI(){
  for(let i=0;i<3;i++) hEls[i].classList.toggle('dead', i >= G.lives);
  scoreEl.textContent = String(G.score);
  coinsEl.textContent = '💰 ' + String(store.coins);
  if(G.score > store.record) store.record = G.score;
  recordEl.textContent = String(store.record);
}

/* ---------- Draw Lobby Ship ---------- */
function drawLobbyShip(){
  const div = document.getElementById('lobbyShip');
  if(!caches.ship) return;
  const cvs = document.createElement('canvas');
  cvs.width = caches.ship.width; cvs.height = caches.ship.height;
  const g = cvs.getContext('2d');
  g.drawImage(caches.ship, 0, 0);
  div.innerHTML = '';
  cvs.style.width = '120px'; cvs.style.height = '120px';
  div.appendChild(cvs);
}

/* ---------- Tabs & Modals ---------- */
const shopPanel = document.getElementById('shopPanel');
const modalTitle = document.getElementById('modalTitle');
const shopClose = document.getElementById('shopClose');
const tabGame = document.getElementById('tabGame');
const tabShop = document.getElementById('tabShop');
const tabRank = document.getElementById('tabRank');

function showModal(title) {

function closeModal() {

shopClose.addEventListener('click', closeModal);

function setTab(activeId) {

tabGame.addEventListener('click', ()=>{

});
tabRank.addEventListener('click', ()=>{

});
tabProfile.addEventListener('click', ()=>{
  setTab('tabProfile');
  showModal('👤 پروفایل');
});

/* ---------- Lobby ---------- */
document.getElementById('startBtn').addEventListener('click', ()=>{
  lobbyEl.classList.add('hidden');
  G.inLobby = false;
  G.running = true;
  tabsEl.classList.add('active');
  uiEl.classList.add('show');
  startGame();
  showMessage('🚀 بازی شروع شد');
});

document.getElementById('lobbyShop').addEventListener('click', ()=> showModal('🛍️ فروشگاه'));
document.getElementById('lobbyRank').addEventListener('click', ()=> showModal('🏆 رتبه بندی'));
document.getElementById('lobbyProfile').addEventListener('click', ()=> showModal('👤 پروفایل'));

/* ---------- game flow ---------- */
const gameOverEl = document.getElementById('gameOver');
const goScoreEl = document.getElementById('goScore');
const goRewardEl = document.getElementById('goReward');
const restartBtn = document.getElementById('restartBtn');

function startGame(){
  G.running = true; G.over = false;
  G.score = 0; G.lives = 3; G.runCoins = 0; // ذخیره سکه‌های این دست
  G.time = 0; G.spawnTimer = 0.4;
  G.bossPhase = false; G.boss = null; G.nextBossScore = 1000;
  G.bullets = []; G.miniBullets = []; G.enemies = []; G.enemyBullets = [];
  G.particles = []; G.floatTexts = [];
  G.fireCooldown = 0; G.touch.active = false;
  resetPlayer();
  updateUI();
  gameOverEl.classList.remove('show');
}

function endGame(){
  G.running = false; G.over = true;
  
  // پاداش معادل تعداد سکه‌های جمع آوری شده در این دست
  const reward = G.runCoins;
  store.coins += reward;
  updateUI();
  
  goScoreEl.textContent = G.score;
  goRewardEl.textContent = '+' + reward;
  gameOverEl.classList.add('show');
  
  // بازگشت به لابی
  setTimeout(()=>{
    gameOverEl.classList.remove('show');
    lobbyEl.classList.remove('hidden');
    G.inLobby = true;
    tabsEl.classList.remove('active');
    uiEl.classList.remove('show');
    setTab('tabGame');
  }, 3500);
}

restartBtn.addEventListener('click', ()=>{
  gameOverEl.classList.remove('show');
  lobbyEl.classList.remove('hidden');
  G.inLobby = true;
  tabsEl.classList.remove('active');
  uiEl.classList.remove('show');
  setTab('tabGame');
  startGame(); // اجرای مجدد منطق بازی
});

/* ---------- Update ---------- */
function update(dt){
  G.time += dt;
  if(player.hitCooldown > 0) player.hitCooldown -= dt;
  if(G.fireCooldown > 0) G.fireCooldown -= dt;

  player.x = clamp(player.x, 30, W-30);
  player.y = clamp(player.y, H*0.35, H - 50);

  if(G.touch.active) shoot();
  for(const m of minis){
    m.fireTimer -= dt;
    if(m.fireTimer <= 0){
      m.fireTimer = 0.4;
      shootMini(m);
    }
  }

  for(let i=G.bullets.length-1;i>=0;i--){
    G.bullets[i].y += G.bullets[i].vy * dt;
    if(G.bullets[i].y < -20) G.bullets.splice(i,1);
  }
  for(let i=G.miniBullets.length-1;i>=0;i--){
    G.miniBullets[i].y += G.miniBullets[i].vy * dt;
    if(G.miniBullets[i].y < -20) G.miniBullets.splice(i,1);
  }

  if(!G.bossPhase){
    G.spawnTimer -= dt;
    if(G.spawnTimer <= 0){
      spawnEnemy();
      G.spawnTimer = Math.max(0.3, 1.0 - G.time*0.01);
    }
  }

  for(let i=G.enemies.length-1;i>=0;i--){
    const e = G.enemies[i];
    e.y += e.vy*dt; e.x += e.vx*dt;
    if(e.x < e.r || e.x > W-e.r) e.vx *= -1;
    e.rot += e.rotSpeed*dt;
    if(e.y > H + 40) G.enemies.splice(i,1);
  }

  // Collisions
  for(let i=G.bullets.length-1;i>=0;i--){
    const b = G.bullets[i];
    for(let j=G.enemies.length-1;j>=0;j--){
      const e = G.enemies[j];
      const dx = b.x - e.x, dy = b.y - e.y;
      if(dx*dx + dy*dy < e.r*e.r){
        burst(e.x, e.y, '#ff5d8f', 6);
        G.enemies.splice(j,1);
        G.score += 30; G.runCoins += 3; // افزایش سکه‌های این دست
        G.bullets.splice(i,1);
        updateUI();
        break;
      }
    }
  }

  for(let i=G.miniBullets.length-1;i>=0;i--){
    const b = G.miniBullets[i];
    for(let j=G.enemies.length-1;j>=0;j--){
      const e = G.enemies[j];
      const dx = b.x - e.x, dy = b.y - e.y;
      if(dx*dx + dy*dy < e.r*e.r){
        burst(e.x, e.y, '#ff5d8f', 6);
        G.enemies.splice(j,1);
        G.score += 30; G.runCoins += 3;
        G.miniBullets.splice(i,1);
        updateUI();
        break;
      }
    }
  }

  // Boss
  if(G.boss){
    const bs = G.boss;
    bs.t += dt;
    if(bs.entering){
      bs.y += 150*dt;
      if(bs.y >= bs.targetY) bs.entering = false;
    } else {
      const prevDir = bs.dir;
      bs.x += bs.dir * bs.speed * dt;
      let hitWall = false;
      if(bs.x > W - bs.w/2 - 10){ bs.x = W - bs.w/2 - 10; bs.dir = -1; hitWall = true; }
      if(bs.x < bs.w/2 + 10){ bs.x = bs.w/2 + 10; bs.dir = 1; hitWall = true; }

      if(hitWall && prevDir !== bs.dir){
        bs.bulletsPerVolley = Math.min(15, bs.bulletsPerVolley + 2);
        fireBoss(bs);
      } else {
        bs.fireTimer -= dt;
        if(bs.fireTimer <= 0){ bs.fireTimer = 1.5; fireBoss(bs); }
      }
    }

    for(let i=G.bullets.length-1;i>=0;i--){
      const b = G.bullets[i];
      if(b.x > bs.x - bs.w/2 && b.x < bs.x + bs.w/2 && b.y > bs.y - bs.h/2 && b.y < bs.y + bs.h/2){
        bs.hp--; G.bullets.splice(i,1);
        if(bs.hp <= 0) defeatBoss();
      }
    }
    for(let i=G.miniBullets.length-1;i>=0;i--){
      const b = G.miniBullets[i];
      if(b.x > bs.x - bs.w/2 && b.x < bs.x + bs.w/2 && b.y > bs.y - bs.h/2 && b.y < bs.y + bs.h/2){
        bs.hp--; G.miniBullets.splice(i,1);
        if(bs.hp <= 0) defeatBoss();
      }
    }
  }

  function fireBoss(bs){
    const n = bs.bulletsPerVolley;
    for(let k=0;k<n;k++){
      const ang = (Math.PI/n) * k + Math.PI/2 - Math.PI/4;
      G.enemyBullets.push({ x: bs.x, y: bs.y + bs.h/2, r: 5, vx: Math.cos(ang)*250, vy: Math.sin(ang)*250 });
    }
  }

  function defeatBoss(){
    burst(G.boss.x, G.boss.y, '#ff5d8f', 30);
    G.score += 100; G.runCoins += 10;
    G.boss = null; G.bossPhase = false;
    updateUI();
  }

  for(let i=G.enemyBullets.length-1;i>=0;i--){
    const b = G.enemyBullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.y > H+20 || b.x < -20 || b.x > W+20) G.enemyBullets.splice(i,1);
    else if(player.hitCooldown <= 0 && Math.hypot(b.x - player.x, b.y - player.y) < 15){
      G.enemyBullets.splice(i,1); hitPlayer();
    }
  }

  if(player.hitCooldown <= 0){
    for(let i=G.enemies.length-1;i>=0;i--){
      const e = G.enemies[i];
      if(Math.hypot(e.x - player.x, e.y - player.y) < e.r + 15){
        G.enemies.splice(i,1); hitPlayer();
      }
    }
  }

  for(let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if(p.life <= 0) G.particles.splice(i,1);
  }

  for(const st of G.stars){
    st.y += st.s*dt;
    if(st.y > H){ st.y = -5; st.x = Math.random()*W; }
  }
}

function hitPlayer(){
  player.hitCooldown = 1.2;
  G.lives--; updateUI();
  if(G.lives <= 0) setTimeout(endGame, 100);
}

/* ---------- Draw ---------- */
function draw(){
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0,0,W,H);

  for(const s of G.stars){
    ctx.fillStyle = s.layer === 0 ? 'rgba(255,255,255,0.8)' : 'rgba(200,220,255,0.4)';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }

  if(G.boss){
    const bs = G.boss;
    if(caches.boss) ctx.drawImage(caches.boss, bs.x - caches.boss.width/2, bs.y - caches.boss.height/2);
    const pulse = Math.sin(bs.t * 5) * 0.1 + 1;
    const core = caches.particles['#ff5d8f'];
    if(core){
      ctx.globalAlpha = 0.7;
      ctx.drawImage(core, bs.x - 25*pulse, bs.y - 25*pulse, 50*pulse, 50*pulse);
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = 'rgba(255,0,50,0.3)';
    ctx.fillRect(W/2 - 100, 60, 200, 8);
    ctx.fillStyle = '#ff2b6d';
    ctx.fillRect(W/2 - 100, 60, 200 * (bs.hp/bs.maxHp), 8);
  }

  for(const e of G.enemies){
    ctx.save();
    ctx.translate(e.x, e.y); ctx.rotate(e.rot);
    ctx.drawImage(e.sprite, -e.sprite.width/2, -e.sprite.height/2);
    ctx.restore();
  }

  ctx.fillStyle = '#ff3355';
  for(const b of G.enemyBullets){ ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); }

  ctx.fillStyle = '#ffffff';
  for(const b of G.bullets){ ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h); }
  ctx.fillStyle = '#00ffff';
  for(const b of G.miniBullets){ ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h); }

  for(const p of G.particles){
    ctx.globalAlpha = p.life * 2;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if(!G.over && G.running){
    const blink = player.hitCooldown > 0 && Math.floor(player.hitCooldown*15) % 2 === 0;
    if(!blink){
      for(const m of minis) ctx.drawImage(caches.mini, player.x + m.offset - caches.mini.width/2, player.y + 10 - caches.mini.height/2);
      ctx.drawImage(caches.ship, player.x - caches.ship.width/2, player.y - caches.ship.height/2);
    }
  }
}

/* ---------- Loop ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min((now - last)/1000, 0.05);
  last = now;
  if(G.running && !G.over && !G.inLobby) update(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
resetPlayer();
updateUI();
requestAnimationFrame(loop);
</script>
