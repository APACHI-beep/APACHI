<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تیراندازی فضایی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Vazirmatn:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif; touch-action:none; user-select:none; }
  canvas { display:block; width:100%; height:100%; }

  /* ===== HUD ===== */
  #ui { position:fixed; inset:0; pointer-events:none; padding:8px 12px; direction:rtl; z-index:5; }

  #leftUI {
    position:absolute; top:10px; left:10px; text-align:right;
    display:flex; flex-direction:column; gap:6px;
  }
  .scoreLine { color:#00e5ff; font-size:18px; font-weight:900; text-shadow:0 0 8px rgba(0,229,255,.6); font-family:'Vazirmatn', sans-serif; }
  .scoreLine .num { font-family:'Orbitron', sans-serif; font-size:20px; letter-spacing:1px; margin-right:4px; }
  
  .coinLine { display:flex; align-items:center; gap:6px; color:#ffea00; font-size:18px; font-weight:900; text-shadow:0 0 8px rgba(255,234,0,.6); }
  .coinLine .num { font-family:'Orbitron', sans-serif; font-size:18px; }
  .coinImg { width:20px; height:20px; }

  #rightUI { position:absolute; top:10px; right:10px; display:flex; gap:6px; align-items:flex-start; }
  .heart {
    width:26px; height:26px;
    background:#ff1a1a;
    clip-path: path('M12,22 C-2,12 -2,4 5,2 C9,1 12,3 12,6 C12,3 15,1 19,2 C26,4 26,12 12,22 Z');
    filter:drop-shadow(0 0 6px #ff0000);
  }

  /* ===== Message (Boss) ===== */
  #message {
    position:fixed; top:35%; left:50%; transform:translate(-50%,-50%) scale(0.7);
    color:#fff; font-size:32px; font-weight:900;
    text-shadow:0 0 15px #ff2b6d, 0 0 30px #ff2b6d;
    opacity:0; transition:all .45s cubic-bezier(.2,1.4,.4,1); pointer-events:none;
    text-align:center; white-space:nowrap; z-index:7; font-family:'Vazirmatn',sans-serif;
  }
  #message.show { opacity:1; transform:translate(-50%,-50%) scale(1); }

  /* ===== Game Over Screen (Matches Image 3) ===== */
  #gameOver {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,0.85); backdrop-filter:blur(2px);
    transition:opacity .3s; z-index:10; opacity:0; pointer-events:none;
    font-family:'Vazirmatn', sans-serif;
  }
  #gameOver.show { opacity:1; pointer-events:auto; }
  
  .go-title {
    font-size:42px; font-weight:900; color:#ff1744;
    text-shadow:0 0 20px #ff1744, 0 0 40px #ff1744, 0 0 60px #ff1744;
    margin-bottom:30px; display:flex; align-items:center; gap:10px;
  }
  .go-title svg { width:36px; height:36px; fill:#ff1744; filter:drop-shadow(0 0 10px #ff1744); }

  .go-sub { color:#fff; font-size:18px; font-weight:800; margin-bottom:20px; }
  .go-score { color:#fff; font-size:20px; font-weight:800; margin-bottom:15px; display:flex; gap:5px;}
  .go-reward { color:#ffe000; font-size:20px; font-weight:800; margin-bottom:40px; display:flex; gap:8px; align-items:center;}
  .go-reward svg { width:22px; height:22px; fill:#ffe000; }

  #restartBtn {
    cursor:pointer; border:none; padding:16px 60px; font-size:22px; font-weight:900;
    color:#fff; border-radius:50px; font-family:'Vazirmatn',sans-serif;
    background:linear-gradient(180deg, #ff4081, #e91e63);
    box-shadow:0 0 20px #e91e63, 0 0 40px rgba(233,30,99,0.5);
    transition:transform .15s;
  }
  #restartBtn:active { transform:scale(.95); }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="ui">
  <div id="leftUI">
    <div class="scoreLine">امتیاز این دست <span class="num" id="score">0</span></div>
    <div class="coinLine">
      <span class="num" id="coins">0</span>
      <!-- Coin Icon -->
      <svg class="coinImg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd700" stroke="#b8860b" stroke-width="2"/><text x="12" y="16" font-size="12" font-weight="bold" fill="#b8860b" text-anchor="middle">$</text></svg>
    </div>
  </div>
  <div id="rightUI">
    <div class="heart" id="h1"></div>
    <div class="heart" id="h2"></div>
    <div class="heart" id="h3"></div>
  </div>
</div>

<div id="message"></div>

<div id="gameOver">
  <div class="go-title">
    <svg viewBox="0 0 24 24"><path d="M12 2L14.5 9.5H22L15.8 13.8L18.3 21.5L12 17.2L5.7 21.5L8.2 13.8L2 9.5H9.5L12 2Z"/></svg>
    بازی تمام شد!
  </div>
  <div class="go-sub">جونات تموم شد...</div>
  <div class="go-score">امتیاز این دست: <span id="goScore">0</span></div>
  <div class="go-reward">
    پاداش سکه: <span id="goReward">+2</span>
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd700" stroke="#b8860b" stroke-width="2"/><text x="12" y="16" font-size="12" font-weight="bold" fill="#b8860b" text-anchor="middle">$</text></svg>
  </div>
  <button id="restartBtn">شروع مجدد</button>
</div>

<script>
/* ================================================================
   Space Ship — Redesign based on provided images
   ================================================================ */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha:false });
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildCaches();
}
window.addEventListener('resize', ()=>{ resize(); });

const store = {
  get record(){ return +(localStorage.getItem('sp_record')||0); },
  set record(v){ localStorage.setItem('sp_record', v); },
  get coins(){ return +(localStorage.getItem('sp_coins')||0); },
  set coins(v){ localStorage.setItem('sp_coins', v); }
};

const G = {
  running:true, over:false,
  score:0, lives:3,
  time:0, spawnTimer:0.4, spawnInterval:1.0,
  bossPhase:false, boss:null,
  nextBossScore:1000,
  bullets:[], miniBullets:[],
  enemies:[], enemyBullets:[],
  particles:[], stars:[], floatTexts:[],
  touch:{active:false, x:0, y:0},
  fireCooldown:0, shake:0, flash:0,
  MAX_PARTICLES: 100
};

/* ---------- caches ---------- */
const caches = {};
function makeCanvas(w,h){
  const c = document.createElement('canvas');
  c.width = Math.max(1,Math.ceil(w)); c.height = Math.max(1,Math.ceil(h));
  return c;
}
function makeGlow(color, radius, intensity=1){
  const size = radius*2;
  const c = makeCanvas(size,size);
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(radius,radius,1, radius,radius,radius);
  grad.addColorStop(0, color.replace('1)', (1*intensity)+')'));
  grad.addColorStop(0.45, color.replace('1)', (0.55*intensity)+')'));
  grad.addColorStop(1, color.replace('1)', '0)'));
  g.fillStyle = grad;
  g.fillRect(0,0,size,size);
  return c;
}

/* ---------- Enemy Sprite ---------- */
function makeEnemySprite(r){
  const pad = r*0.5;
  const size = (r+pad)*2;
  const c = makeCanvas(size,size);
  const g = c.getContext('2d');
  g.translate(size/2, size/2);

  const hexPath = (rad)=>{
    g.beginPath();
    for(let i=0;i<6;i++){
      const a = (Math.PI/3)*i - Math.PI/2;
      const px = Math.cos(a)*rad, py = Math.sin(a)*rad;
      if(i===0) g.moveTo(px,py); else g.lineTo(px,py);
    }
    g.closePath();
  };

  hexPath(r);
  g.fillStyle = 'rgba(100, 20, 40, 0.4)';
  g.fill();

  g.strokeStyle = '#ff3355';
  g.lineWidth = 2.5;
  hexPath(r);
  g.stroke();

  g.strokeStyle = 'rgba(255,100,120,0.3)';
  g.lineWidth = 1;
  hexPath(r*0.8);
  g.stroke();

  return c;
}

/* ---------- Main Ship Sprite ---------- */
function makeShipSprite(scale){
  const c = makeCanvas(100*scale, 100*scale);
  const g = c.getContext('2d');
  g.scale(scale,scale);
  g.translate(50, 50);

  // Red hull
  g.beginPath();
  g.moveTo(0, -32);
  g.lineTo(-24, 18);
  g.lineTo(0, 26);
  g.lineTo(24, 18);
  g.closePath();
  g.fillStyle = '#e60026';
  g.fill();
  
  // Grey center panel
  g.beginPath();
  g.moveTo(0, -20);
  g.lineTo(-8, 22);
  g.lineTo(8, 22);
  g.closePath();
  g.fillStyle = '#6a7075';
  g.fill();

  // Blue/Teal Cockpit (Gradient)
  const cg = g.createLinearGradient(0, -15, 0, 8);
  cg.addColorStop(0, '#b2f5ff');
  cg.addColorStop(1, '#00bfff');
  g.beginPath();
  g.moveTo(0, -22);
  g.lineTo(-6, 4);
  g.lineTo(6, 4);
  g.closePath();
  g.fillStyle = cg;
  g.fill();

  // Engine glow
  const eg = g.createRadialGradient(0, 28, 1, 0, 28, 15);
  eg.addColorStop(0, 'rgba(255,255,255,1)');
  eg.addColorStop(0.4, 'rgba(255,50,100,0.8)');
  eg.addColorStop(1, 'rgba(255,0,0,0)');
  g.fillStyle = eg;
  g.beginPath();
  g.arc(0, 28, 15, 0, Math.PI*2);
  g.fill();

  return c;
}

/* ---------- Mini Ship Sprite ---------- */
function makeMiniSprite(scale){
  const c = makeCanvas(40*scale, 40*scale);
  const g = c.getContext('2d');
  g.scale(scale,scale);
  g.translate(20, 20);

  const eg = g.createRadialGradient(0, 10, 1, 0, 10, 10);
  eg.addColorStop(0, 'rgba(0,255,255,0.6)');
  eg.addColorStop(1, 'rgba(0,255,255,0)');
  g.fillStyle = eg;
  g.beginPath(); g.arc(0, 10, 10, 0, Math.PI*2); g.fill();

  g.beginPath();
  g.moveTo(0, -16);
  g.lineTo(-12, 10);
  g.lineTo(0, 14);
  g.lineTo(12, 10);
  g.closePath();
  g.fillStyle = '#00ffff';
  g.fill();
  g.strokeStyle = '#ffffff';
  g.lineWidth = 1;
  g.stroke();
  
  g.beginPath();
  g.moveTo(0, -12);
  g.lineTo(-4, 12);
  g.lineTo(4, 12);
  g.closePath();
  g.fillStyle = 'rgba(255,255,255,0.8)';
  g.fill();

  return c;
}

/* ---------- Boss Sprite (High Quality, Varied Shapes) ---------- */
function makeBossSprite(w,h,variant){
  const pad = 60;
  const c = makeCanvas(w+pad*2, h+pad*2);
  const g = c.getContext('2d');
  g.translate((w+pad*2)/2, (h+pad*2)/2);

  // Aura
  const aura = g.createRadialGradient(0,0,10, 0,0, w*0.8);
  aura.addColorStop(0,'rgba(255,50,100,0.4)');
  aura.addColorStop(1,'rgba(255,0,50,0)');
  g.fillStyle = aura;
  g.beginPath(); g.arc(0,0,w*0.8,0,Math.PI*2); g.fill();

  const shape = ()=>{
    g.beginPath();
    const hw = w/2, hh = h/2;
    if(variant === 0){
      g.moveTo(-hw, hh*0.6);
      g.quadraticCurveTo(-hw*0.9, -hh*1.1, 0, -hh*1.2);
      g.quadraticCurveTo(hw*0.9, -hh*1.1, hw, hh*0.6);
      g.lineTo(0, hh*1.2);
      g.closePath();
    } else if(variant === 1){
      g.moveTo(0, -hh*1.5);
      g.lineTo(hw*1.2, 0);
      g.lineTo(hw*0.6, hh*1.2);
      g.lineTo(0, hh*0.8);
      g.lineTo(-hw*0.6, hh*1.2);
      g.lineTo(-hw*1.2, 0);
      g.closePath();
    } else {
      g.moveTo(-hw*1.1, 0);
      g.lineTo(-hw*0.5, -hh*0.9);
      g.lineTo(hw*0.5, -hh*0.9);
      g.lineTo(hw*1.1, 0);
      g.lineTo(hw*0.5, hh*0.9);
      g.lineTo(-hw*0.5, hh*0.9);
      g.closePath();
    }
  };

  shape();
  g.lineWidth = 8; g.strokeStyle = 'rgba(255,50,90,0.2)'; g.stroke();
  shape();
  g.fillStyle = 'rgba(80, 10, 20, 0.9)'; g.fill();
  g.lineWidth = 3; g.strokeStyle = '#ff2b6d'; g.stroke();

  // Details
  g.fillStyle = '#ff2b6d';
  for(let i=0; i<5; i++){
    g.beginPath();
    g.arc(-w/2 + 20 + i*((w-40)/4), h/2 - 10, 4, 0, Math.PI*2);
    g.fill();
  }

  return c;
}

function buildCaches(){
  caches.stars = [
    makeGlow('rgba(255,255,255,1)', 1.5, 1),
    makeGlow('rgba(255,255,255,1)', 2.5, 0.8),
    makeGlow('rgba(200,220,255,1)', 3.5, 0.6)
  ];
  caches.ship = makeShipSprite(1.2);
  caches.mini = makeMiniSprite(1.2);
  caches.particles = {
    '#ff5d8f': makeGlow('rgba(255,93,143,1)', 6, 0.9),
    '#00ffff': makeGlow('rgba(0,255,255,1)', 6, 0.9)
  };
  
  if(G.boss){
    caches.boss = makeBossSprite(G.boss.w, G.boss.h, G.boss.variant);
  }
  makeStars();
}

function makeStars(){
  G.stars = [];
  const count = Math.floor((W*H)/6000);
  for(let i=0;i<count;i++){
    G.stars.push({
      x: Math.random()*W,
      y: Math.random()*H,
      r: Math.random()*1.5 + 0.5,
      s: Math.random()*100 + 50,
      layer: Math.floor(Math.random()*2)
    });
  }
}

const player = { x:0, y:0, hitCooldown:0 };
const minis = [{ offset: -45, fireTimer: 0 }, { offset: 45, fireTimer: 0 }];

function resetPlayer(){
  player.x = W/2;
  player.y = H - 90;
  player.hitCooldown = 0;
  for(const m of minis){ m.fireTimer = 0; }
}

function rnd(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

/* ---------- Shooting ---------- */
function shoot(){
  if(G.fireCooldown > 0) return;
  G.fireCooldown = 0.18;
  G.bullets.push({
    x: player.x,
    y: player.y - 35,
    w: 3,
    h: 12,
    vy: -800
  });
}

function shootMini(m){
  G.miniBullets.push({
    x: player.x + m.offset,
    y: player.y,
    w: 2,
    h: 10,
    vy: -700
  });
}

/* ---------- Enemy ---------- */
function spawnEnemy(){
  // Varied sizes as requested
  const baseR = clamp(Math.min(W,H) * 0.04, 15, 40);
  const r = baseR * rnd(0.6, 1.4); 
  
  G.enemies.push({
    x: rnd(r+20, W-r-20),
    y: -r-20,
    r,
    vy: rnd(80, 150) + G.time*0.5,
    vx: rnd(-30, 30),
    rot: Math.random()*Math.PI,
    rotSpeed: rnd(-1, 1),
    sprite: makeEnemySprite(r)
  });
}

/* ---------- Boss ---------- */
function spawnBoss(){
  G.bossPhase = true;
  const waveIndex = Math.max(1, Math.floor(G.score / 1000));
  const bw = clamp(W * 0.45, 150, 260);
  const variant = (waveIndex - 1) % 3;
  G.boss = {
    x: W/2, y: -bw*0.5,
    w: bw, h: bw*0.55,
    targetY: Math.min(130, H*0.16),
    dir: 1,
    speed: W * 0.18,
    fireTimer: 1.2,
    hp: 25 + waveIndex * 5,
    maxHp: 25 + waveIndex * 5,
    entering: true,
    bulletsPerVolley: 3,
    variant,
    t: 0
  };
  caches.boss = makeBossSprite(G.boss.w, G.boss.h, variant);
  showMessage('⚠️ باس وارد شد ⚠️');
}

function burst(x,y,color,n){
  if(G.particles.length >= G.MAX_PARTICLES) return;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const s = Math.random()*100+50;
    G.particles.push({
      x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:0.5, color, r:rnd(1.5,3)
    });
  }
}

function showMessage(txt){
  const el = document.getElementById('message');
  el.textContent = txt;
  el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 1600);
}

/* ---------- Input ---------- */
function onPointerDown(e){
  if(G.over) return;
  const t = e.touches ? e.touches[0] : e;
  G.touch.active = true;
  G.touch.x = t.clientX;
  G.touch.y = t.clientY;
  if(e.cancelable) e.preventDefault();
}
function onPointerMove(e){
  if(!G.touch.active) return;
  const t = e.touches ? e.touches[0] : e;
  player.x = t.clientX;
  player.y = Math.max(t.clientY - 40, H*0.4);
  if(e.cancelable) e.preventDefault();
}
function onPointerUp(){ G.touch.active = false; }

cv.addEventListener('touchstart', onPointerDown, {passive:false});
cv.addEventListener('touchmove', onPointerMove, {passive:false});
cv.addEventListener('touchend', onPointerUp);
cv.addEventListener('touchcancel', onPointerUp);
cv.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', e=>{ if(G.touch.active) onPointerMove(e); });
window.addEventListener('mouseup', onPointerUp);

/* ---------- UI ---------- */
const scoreEl = document.getElementById('score');
const coinsEl = document.getElementById('coins');
const hEls = [document.getElementById('h1'), document.getElementById('h2'), document.getElementById('h3')];

function updateUI(){
  for(let i=0;i<3;i++){
    hEls[i].style.display = i < G.lives ? 'block' : 'none';
  }
  scoreEl.textContent = String(G.score);
  coinsEl.textContent = String(store.coins);
}

const gameOverEl = document.getElementById('gameOver');
const goScoreEl = document.getElementById('goScore');
const goRewardEl = document.getElementById('goReward');
const restartBtn = document.getElementById('restartBtn');

function startGame(){
  G.running = true; G.over = false;
  G.score = 0; G.lives = 3;
  G.time = 0; G.spawnTimer = 0.4;
  G.bossPhase = false; G.boss = null; G.nextBossScore = 1000;
  G.bullets = []; G.miniBullets = []; G.enemies = []; G.enemyBullets = [];
  G.particles = []; G.floatTexts = [];
  G.fireCooldown = 0; G.touch.active = false;
  resetPlayer();
  updateUI();
  gameOverEl.classList.remove('show');
}

function endGame(){
  G.running = false; G.over = true;
  const reward = 2;
  store.coins += reward;
  updateUI();
  
  goScoreEl.textContent = G.score;
  goRewardEl.textContent = '+' + reward;
  gameOverEl.classList.add('show');
}

restartBtn.addEventListener('click', startGame);

/* ---------- Update ---------- */
function update(dt){
  G.time += dt;
  if(player.hitCooldown > 0) player.hitCooldown -= dt;
  if(G.fireCooldown > 0) G.fireCooldown -= dt;

  player.x = clamp(player.x, 30, W-30);
  player.y = clamp(player.y, H*0.35, H - 50);

  if(G.touch.active) shoot();
  for(const m of minis){
    m.fireTimer -= dt;
    if(m.fireTimer <= 0){
      m.fireTimer = 0.4;
      shootMini(m);
    }
  }

  // Bullets move
  for(let i=G.bullets.length-1;i>=0;i--){
    G.bullets[i].y += G.bullets[i].vy * dt;
    if(G.bullets[i].y < -20) G.bullets.splice(i,1);
  }
  for(let i=G.miniBullets.length-1;i>=0;i--){
    G.miniBullets[i].y += G.miniBullets[i].vy * dt;
    if(G.miniBullets[i].y < -20) G.miniBullets.splice(i,1);
  }

  // Spawn
  if(!G.bossPhase){
    G.spawnTimer -= dt;
    if(G.spawnTimer <= 0){
      spawnEnemy();
      G.spawnTimer = Math.max(0.3, 1.0 - G.time*0.01);
    }
  }

  // Enemies move
  for(let i=G.enemies.length-1;i>=0;i--){
    const e = G.enemies[i];
    e.y += e.vy*dt;
    e.x += e.vx*dt;
    if(e.x < e.r || e.x > W-e.r) e.vx *= -1;
    e.rot += e.rotSpeed*dt;
    if(e.y > H + 40) G.enemies.splice(i,1);
  }

  // Collisions (Bullet vs Enemy)
  for(let i=G.bullets.length-1;i>=0;i--){
    const b = G.bullets[i];
    for(let j=G.enemies.length-1;j>=0;j--){
      const e = G.enemies[j];
      const dx = b.x - e.x, dy = b.y - e.y;
      if(dx*dx + dy*dy < e.r*e.r){
        burst(e.x, e.y, '#ff5d8f', 6);
        G.enemies.splice(j,1);
        G.score += 30;
        store.coins += 3;
        G.bullets.splice(i,1);
        updateUI();
        break;
      }
    }
  }

  // Mini bullets vs Enemy
  for(let i=G.miniBullets.length-1;i>=0;i--){
    const b = G.miniBullets[i];
    for(let j=G.enemies.length-1;j>=0;j--){
      const e = G.enemies[j];
      const dx = b.x - e.x, dy = b.y - e.y;
      if(dx*dx + dy*dy < e.r*e.r){
        burst(e.x, e.y, '#ff5d8f', 6);
        G.enemies.splice(j,1);
        G.score += 30;
        store.coins += 3;
        G.miniBullets.splice(i,1);
        updateUI();
        break;
      }
    }
  }

  // Boss Logic
  if(G.boss){
    const bs = G.boss;
    bs.t += dt;
    if(bs.entering){
      bs.y += 150*dt;
      if(bs.y >= bs.targetY) bs.entering = false;
    } else {
      const prevDir = bs.dir;
      bs.x += bs.dir * bs.speed * dt;
      let hitWall = false;
      if(bs.x > W - bs.w/2 - 10){ bs.x = W - bs.w/2 - 10; bs.dir = -1; hitWall = true; }
      if(bs.x < bs.w/2 + 10){ bs.x = bs.w/2 + 10; bs.dir = 1; hitWall = true; }

      if(hitWall && prevDir !== bs.dir){
        bs.bulletsPerVolley = Math.min(15, bs.bulletsPerVolley + 2);
        fireBoss(bs);
      } else {
        bs.fireTimer -= dt;
        if(bs.fireTimer <= 0){ bs.fireTimer = 1.5; fireBoss(bs); }
      }
    }

    // Damage
    for(let i=G.bullets.length-1;i>=0;i--){
      const b = G.bullets[i];
      if(b.x > bs.x - bs.w/2 && b.x < bs.x + bs.w/2 && b.y > bs.y - bs.h/2 && b.y < bs.y + bs.h/2){
        bs.hp--;
        G.bullets.splice(i,1);
        if(bs.hp <= 0) defeatBoss();
      }
    }
    for(let i=G.miniBullets.length-1;i>=0;i--){
      const b = G.miniBullets[i];
      if(b.x > bs.x - bs.w/2 && b.x < bs.x + bs.w/2 && b.y > bs.y - bs.h/2 && b.y < bs.y + bs.h/2){
        bs.hp--;
        G.miniBullets.splice(i,1);
        if(bs.hp <= 0) defeatBoss();
      }
    }
  }

  function fireBoss(bs){
    const n = bs.bulletsPerVolley;
    for(let k=0;k<n;k++){
      const ang = (Math.PI/n) * k + Math.PI/2 - Math.PI/4;
      G.enemyBullets.push({
        x: bs.x, y: bs.y + bs.h/2,
        r: 5, vx: Math.cos(ang)*250, vy: Math.sin(ang)*250
      });
    }
  }

  function defeatBoss(){
    burst(G.boss.x, G.boss.y, '#ff5d8f', 30);
    G.score += 100;
    store.coins += 10;
    G.boss = null;
    G.bossPhase = false;
    updateUI();
  }

  // Enemy bullets
  for(let i=G.enemyBullets.length-1;i>=0;i--){
    const b = G.enemyBullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.y > H+20 || b.x < -20 || b.x > W+20) G.enemyBullets.splice(i,1);
    else if(player.hitCooldown <= 0 && Math.hypot(b.x - player.x, b.y - player.y) < 15){
      G.enemyBullets.splice(i,1);
      hitPlayer();
    }
  }

  // Enemy collision
  if(player.hitCooldown <= 0){
    for(let i=G.enemies.length-1;i>=0;i--){
      const e = G.enemies[i];
      if(Math.hypot(e.x - player.x, e.y - player.y) < e.r + 15){
        G.enemies.splice(i,1);
        hitPlayer();
      }
    }
  }

  // Particles
  for(let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.life -= dt;
    if(p.life <= 0) G.particles.splice(i,1);
  }

  // Stars
  for(const st of G.stars){
    st.y += st.s*dt;
    if(st.y > H){ st.y = -5; st.x = Math.random()*W; }
  }
}

function hitPlayer(){
  player.hitCooldown = 1.2;
  G.lives--;
  updateUI();
  if(G.lives <= 0) setTimeout(endGame, 100);
}

/* ---------- Draw ---------- */
function draw(){
  ctx.fillStyle = '#0a0a12'; // Very dark blue/black background
  ctx.fillRect(0,0,W,H);

  // Stars
  for(const s of G.stars){
    ctx.fillStyle = s.layer === 0 ? 'rgba(255,255,255,0.8)' : 'rgba(200,220,255,0.4)';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }

  // Boss
  if(G.boss){
    const bs = G.boss;
    if(caches.boss){
      ctx.drawImage(caches.boss, bs.x - caches.boss.width/2, bs.y - caches.boss.height/2);
    }
    // HP Bar
    ctx.fillStyle = 'rgba(255,0,50,0.3)';
    ctx.fillRect(W/2 - 100, 60, 200, 8);
    ctx.fillStyle = '#ff2b6d';
    ctx.fillRect(W/2 - 100, 60, 200 * (bs.hp/bs.maxHp), 8);
  }

  // Enemies
  for(const e of G.enemies){
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.rot);
    ctx.drawImage(e.sprite, -e.sprite.width/2, -e.sprite.height/2);
    ctx.restore();
  }

  // Enemy Bullets
  ctx.fillStyle = '#ff3355';
  for(const b of G.enemyBullets){
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
  }

  // Player Bullets
  ctx.fillStyle = '#ffffff';
  for(const b of G.bullets){
    ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
  }
  ctx.fillStyle = '#00ffff';
  for(const b of G.miniBullets){
    ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
  }

  // Particles
  for(const p of G.particles){
    ctx.globalAlpha = p.life * 2;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Player
  if(!G.over && G.running){
    const blink = player.hitCooldown > 0 && Math.floor(player.hitCooldown*15) % 2 === 0;
    if(!blink){
      // Minis
      for(const m of minis){
        ctx.drawImage(caches.mini, player.x + m.offset - caches.mini.width/2, player.y + 10 - caches.mini.height/2);
      }
      // Main
      ctx.drawImage(caches.ship, player.x - caches.ship.width/2, player.y - caches.ship.height/2);
    }
  }
}

/* ---------- Loop ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min((now - last)/1000, 0.05);
  last = now;
  if(G.running && !G.over) update(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
resetPlayer();
updateUI();
requestAnimationFrame(loop);
</script>
