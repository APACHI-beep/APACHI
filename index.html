<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>خیانت میوه‌ها 🍎🍊🍌</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Tahoma, sans-serif;
    background: radial-gradient(circle at top, #1a0b2e, #000);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  h1 {
    margin: 10px 0 4px;
    font-size: clamp(1.5rem, 5vw, 2.8rem);
    background: linear-gradient(90deg, #ff0, #0f0, #0ff, #f0f, #ff0);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbow 4s linear infinite;
    text-shadow: 0 0 30px rgba(255,255,0,.3);
  }
  @keyframes rainbow { to { background-position: 300% 0; } }

  .sub {
    opacity: .8;
    font-size: .9rem;
    margin-bottom: 18px;
  }

  /* صحنه فیلم */
  .cinema {
    position: relative;
    width: min(92vw, 860px);
    height: min(56vw, 480px);
    background: linear-gradient(#2a1a4a, #12081f);
    border: 6px solid #444;
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(255,255,0,.15), 0 0 80px rgba(255,0,255,.1);
    overflow: hidden;
    cursor: pointer;
  }

  /* پرده */
  .curtain {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background: repeating-linear-gradient(90deg, #8b0000 0 20px, #b30000 20px 40px);
    z-index: 20;
    transition: transform 1.2s ease;
  }
  .curtain.left  { left: 0;  transform-origin: left center; }
  .curtain.right { right: 0; transform-origin: right center; }
  .cinema.open .curtain.left  { transform: scaleX(0); }
  .cinema.open .curtain.right { transform: scaleX(0); }

  /* صحنه داخلی */
  .stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 60px;
    gap: 30px;
  }

  /* میوه پایه */
  .fruit {
    position: relative;
    width: 110px;
    height: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform .8s ease, opacity .8s ease;
    z-index: 5;
  }

  .fruit .top {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50% 50% 45% 45%;
    border: 4px solid #111;
    box-shadow: inset -10px -10px 20px rgba(0,0,0,.3);
  }

  /* سیب */
  .apple .top { background: radial-gradient(circle at 30% 30%, #ff6b6b, #b30000); }
  .apple .stem {
    position: absolute;
    top: -18px;
    left: 50%;
    width: 6px;
    height: 22px;
    background: #5a3a1a;
    border-radius: 4px;
    transform: translateX(-50%) rotate(10deg);
    border: 2px solid #111;
  }
  .apple .leaf {
    position: absolute;
    top: -10px;
    left: 58%;
    width: 22px;
    height: 14px;
    background: #2ecc71;
    border-radius: 0 100% 0 100%;
    border: 2px solid #111;
    transform: rotate(-20deg);
  }

  /* پرتقال */
  .orange .top { background: radial-gradient(circle at 30% 30%, #ffb347, #e67e22); }
  .orange .stem {
    position: absolute;
    top: -14px;
    left: 50%;
    width: 6px;
    height: 18px;
    background: #5a3a1a;
    border-radius: 4px;
    transform: translateX(-50%);
    border: 2px solid #111;
  }

  /* موز */
  .banana {
    width: 130px;
    height: 80px;
  }
  .banana .top {
    width: 100%;
    height: 100%;
    border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
    background: radial-gradient(circle at 30% 30%, #ffe066, #f1c40f);
    transform: rotate(-15deg);
  }
  .banana .tip {
    position: absolute;
    top: 6px;
    right: -8px;
    width: 16px;
    height: 16px;
    background: #7f6a1a;
    border-radius: 50%;
    border: 2px solid #111;
  }

  /* چشم‌ها و دهان */
  .eyes {
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 18px;
    z-index: 6;
  }
  .eye {
    width: 16px;
    height: 20px;
    background: #111;
    border-radius: 50%;
    position: relative;
    transition: all .3s;
  }
  .eye::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 7px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
  }

  .mouth {
    position: absolute;
    bottom: 22%;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 14px;
    border-radius: 0 0 30px 30px;
    background: #4a0d0d;
    border: 3px solid #111;
    z-index: 6;
  }
  .mouth.sad { border-radius: 30px 30px 0 0; background: #4a0d0d; }

  /* دست‌ها */
  .arm {
    position: absolute;
    width: 14px;
    height: 50px;
    background: #5a3a1a;
    border: 3px solid #111;
    border-radius: 20px;
    top: 50%;
    z-index: 4;
  }
  .arm.left  { left: -10px;  transform-origin: top center; transform: rotate(20deg); }
  .arm.right { right: -10px; transform-origin: top center; transform: rotate(-20deg); }

  /* حباب دیالوگ */
  .bubble {
    position: absolute;
    top: -70px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    background: #fff;
    color: #111;
    padding: 10px 14px;
    border-radius: 16px;
    border: 3px solid #111;
    font-size: .8rem;
    min-width: 90px;
    text-align: center;
    z-index: 10;
    transition: transform .3s ease;
    white-space: nowrap;
  }
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: #111;
  }
  .bubble.show { transform: translateX(-50%) scale(1); }

  /* صحنه‌های پایانی */
  .overlay-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.2rem, 3vw, 2rem);
    font-weight: bold;
    text-shadow: 0 0 20px #000;
    opacity: 0;
    pointer-events: none;
    z-index: 15;
    text-align: center;
    padding: 20px;
  }
  .overlay-text.show { opacity: 1; }

  /* دکمه‌ها */
  .controls {
    margin-top: 18px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 999px;
    padding: 12px 26px;
    font-family: inherit;
    font-weight: bold;
    font-size: 1rem;
    color: #1b0026;
    background: linear-gradient(135deg, #ffe600, #00ffe1);
    box-shadow: 0 6px 0 #0006;
    transition: transform .12s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #0006; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* انیمیشن‌های صحنه */
  .fruit.enter { animation: enterScene .8s ease forwards; }
  @keyframes enterScene {
    from { transform: translateY(200px) scale(.5); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  .fruit.steal { animation: steal .9s ease forwards; }
  @keyframes steal {
    0%   { transform: translateX(0) rotate(0deg); }
    30%  { transform: translateX(-20px) rotate(-10deg); }
    60%  { transform: translateX(40px) rotate(10deg); }
    100% { transform: translateX(0) rotate(0deg); }
  }

  .fruit.angry .eye { transform: scaleY(.6) rotate(20deg); background: #8b0000; }
  .fruit.angry .mouth { border-radius: 30px 30px 0 0; width: 34px; }

  .shake { animation: shake .4s infinite; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px) rotate(-2deg); }
    75% { transform: translateX(6px) rotate(2deg); }
  }
</style>
</head>
<body>

<h1>🍎 خیانت میوه‌ها 🍊</h1>
<div class="sub">یک فیلم کوتاه کارتونی | برای پخش روی صفحه کلیک کن</div>

<div class="cinema" id="cinema" onclick="startMovie()">
  <div class="curtain left"></div>
  <div class="curtain right"></div>

  <div class="stage" id="stage">
    <!-- سیب -->
    <div class="fruit apple" id="apple" style="display:none;">
      <div class="arm left"></div>
      <div class="bubble" id="bubbleApple">سلام پرتقال!</div>
      <div class="top">
        <div class="stem"></div>
        <div class="leaf"></div>
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="mouth"></div>
      </div>
      <div class="arm right"></div>
    </div>

    <!-- پرتقال -->
    <div class="fruit orange" id="orange" style="display:none;">
      <div class="arm left"></div>
      <div class="bubble" id="bubbleOrange">سلام سیب!</div>
      <div class="top">
        <div class="stem"></div>
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="mouth"></div>
      </div>
      <div class="arm right"></div>
    </div>

    <!-- موز -->
    <div class="fruit banana" id="banana" style="display:none;">
      <div class="arm left"></div>
      <div class="bubble" id="bubbleBanana">هههه!</div>
      <div class="top">
        <div class="tip"></div>
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="mouth"></div>
      </div>
      <div class="arm right"></div>
    </div>
  </div>

  <!-- متن‌های میان‌صحنه -->
  <div class="overlay-text" id="overlay"></div>
</div>

<div class="controls">
  <button id="playBtn" onclick="startMovie()" disabled>⏳ لطفاً صبر کنید...</button>
  <button onclick="replay()">🔄 پخش دوباره</button>
</div>

<script>
  const cinema = document.getElementById("cinema");
  const apple = document.getElementById("apple");
  const orange = document.getElementById("orange");
  const banana = document.getElementById("banana");
  const bubbleApple = document.getElementById("bubbleApple");
  const bubbleOrange = document.getElementById("bubbleOrange");
  const bubbleBanana = document.getElementById("bubbleBanana");
  const overlay = document.getElementById("overlay");
  const playBtn = document.getElementById("playBtn");

  let playing = false;
  let timers = [];

  function clearTimers() {
    timers.forEach(t => clearTimeout(t));
    timers = [];
  }

  function wait(ms) {
    return new Promise(res => timers.push(setTimeout(res, ms)));
  }

  function resetScene() {
    clearTimers();
    playing = false;
    cinema.classList.remove("open");
    apple.style.display = "none";
    orange.style.display = "none";
    banana.style.display = "none";
    apple.className = "fruit apple";
    orange.className = "fruit orange";
    banana.className = "fruit banana";
    bubbleApple.classList.remove("show");
    bubbleOrange.classList.remove("show");
    bubbleBanana.classList.remove("show");
    overlay.classList.remove("show");
    overlay.textContent = "";
    playBtn.disabled = false;
    playBtn.textContent = "▶️ پخش فیلم";
  }

  function showBubble(el) {
    el.classList.add("show");
    timers.push(setTimeout(() => el.classList.remove("show"), 1800));
  }

  async function startMovie() {
    if (playing) return;
    playing = true;
    playBtn.disabled = true;
    playBtn.textContent = "⏳ در حال پخش...";

    cinema.classList.add("open");
    await wait(1300); // باز شدن پرده

    // صحنه ۱: ورود سیب و پرتقال
    apple.style.display = "block";
    orange.style.display = "block";
    apple.classList.add("enter");
    orange.classList.add("enter");
    await wait(700);

    showBubble(bubbleApple);
    await wait(1200);
    showBubble(bubbleOrange);
    await wait(1500);

    // صحنه ۲: ورود موز
    banana.style.display = "block";
    banana.classList.add("enter");
    await wait(900);
    showBubble(bubbleBanana);
    await wait(1500);

    // صحنه ۳: خیانت! موز سیب را هل می‌دهد
    overlay.textContent = "😱 موز به سیب خیانت کرد!";
    overlay.classList.add("show");
    await wait(900);
    overlay.classList.remove("show");

    banana.classList.add("steal");
    apple.classList.add("angry");
    orange.classList.add("angry");
    await wait(900);
    apple.classList.add("shake");
    orange.classList.add("shake");
    await wait(1200);

    // صحنه ۴: نتیجه
    apple.classList.remove("shake");
    orange.classList.remove("shake");
    overlay.textContent = "🍌 موز فرار کرد... سیب و پرتقال ماندند!";
    overlay.classList.add("show");
    await wait(2000);

    // پایان
    overlay.textContent = "🎬 پایان";
    overlay.classList.add("show");
    await wait(1500);

    // بستن پرده
    cinema.classList.remove("open");
    playBtn.disabled = false;
    playBtn.textContent = "▶️ پخش دوباره";
    playing = false;
  }

  function replay() {
    resetScene();
    setTimeout(() => startMovie(), 200);
  }

  // فعال‌سازی اولیه دکمه
  window.onload = () => {
    playBtn.disabled = false;
    playBtn.textContent = "▶️ پخش فیلم";
    resetScene();
  };
</script>

</body>
  </html>
