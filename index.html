<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Space Ship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Vazirmatn:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif; touch-action:none; user-select:none; }
  canvas { display:block; width:100%; height:100%; }

  #ui { position:fixed; inset:0; pointer-events:none; padding:6px 8px; direction:rtl; z-index:5; }

  #rightUI { position:absolute; top:6px; right:8px; text-align:right; }
  .hearts { font-size:26px; letter-spacing:1px; filter:drop-shadow(0 0 6px #ff3355); line-height:1; }
  .hearts .dead { opacity:.22; filter:none; }

  #leftUI {
    position:absolute; top:6px; left:6px; text-align:right;
    display:flex; flex-direction:column; gap:1px;
  }
  .recordBox, .scoreBox, .coinBox {
    color:#e8f6ff; text-shadow:0 0 8px #38c8ff, 0 0 16px #0060ff;
    font-weight:700; user-select:none; line-height:1.15;
    font-family:'Orbitron','Vazirmatn',sans-serif;
  }
  .recordBox { font-size:12px; color:#ffd84d; text-shadow:0 0 8px #ff9d00; }
  .scoreBox  { font-size:16px; }
  .coinBox   { font-size:18px; color:#ffcf33; text-shadow:0 0 8px #ffb300,0 0 16px #ff7b00; }

  #message {
    position:fixed; top:38%; left:50%; transform:translate(-50%,-50%) scale(0.7);
    color:#fff; font-size:30px; font-weight:900; letter-spacing:2px;
    text-shadow:0 0 12px #ff2b6d, 0 0 30px #ff2b6d, 0 0 60px #ff2b6d;
    opacity:0; transition:all .45s cubic-bezier(.2,1.4,.4,1); pointer-events:none;
    text-align:center; white-space:nowrap; z-index:6;
    font-family:'Vazirmatn',sans-serif;
  }
  #message.show { opacity:1; transform:translate(-50%,-50%) scale(1); }

  #gameOver {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
    background:radial-gradient(circle at 50% 40%, rgba(0,40,90,.7), rgba(0,0,0,.96));
    backdrop-filter:blur(4px); transition:opacity .4s; z-index:10;
    opacity:0; pointer-events:none;
  }
  #gameOver.show { opacity:1; pointer-events:auto; }
  #gameOver h1 { color:#cdeaff; font-size:32px; letter-spacing:3px; text-shadow:0 0 14px #38c8ff,0 0 40px #0060ff; }
  #gameOver p  { color:#9fd0e8; font-size:14px; text-align:center; line-height:2; }
  #gameOver p b { font-family:'Orbitron',monospace; }
  #restartBtn {
    cursor:pointer; border:none; padding:12px 46px; font-size:17px; font-weight:800; letter-spacing:2px;
    color:#001018; border-radius:40px; font-family:'Vazirmatn',sans-serif;
    background:linear-gradient(180deg,#7ef0ff,#18a8ff);
    box-shadow:0 0 18px #18a8ff,0 0 50px rgba(24,168,255,.6),inset 0 -3px 0 rgba(0,0,0,.25);
    transition:transform .15s;
  }
  #restartBtn:active { transform:scale(.95); }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="ui">
  <div id="rightUI">
    <div class="hearts" id="hearts"></div>
  </div>
  <div id="leftUI">
    <div class="recordBox" id="record">رکورد 0</div>
    <div class="scoreBox" id="score">امتیاز 0</div>
    <div class="coinBox" id="coins">💰 0</div>
  </div>
</div>

<div id="message"></div>

<div id="gameOver">
  <h1>پایان بازی</h1>
  <p id="goText"></p>
  <button id="restartBtn">بازی مجدد</button>
</div>

<script>
/* ================= Setup ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ================= Storage ================= */
const store = {
  get record(){ return +(localStorage.getItem('sp_record')||0); },
  set record(v){ localStorage.setItem('sp_record', v); },
  get coins(){ return +(localStorage.getItem('sp_coins')||0); },
  set coins(v){ localStorage.setItem('sp_coins', v); }
};

/* ================= State ================= */
const G = {
  running:true, over:false,
  score:0, lives:3,
  time:0, spawnTimer:0.4, spawnInterval:1.15,
  bossPhase:false, boss:null,
  nextBossScore:1000,
  bullets:[], enemies:[], enemyBullets:[], particles:[], stars:[], floatTexts:[], shockwaves:[],
  touch:{active:false, x:0, y:0},
  fireCooldown:0, shake:0, flash:0
};

/* ================= Stars ================= */
function makeStars(){
  G.stars = [];
  const count = Math.floor((W*H)/5500);
  for(let i=0;i<count;i++){
    G.stars.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.4+0.3, s:Math.random()*28+8,
      a:Math.random()*0.7+0.3
    });
  }
}
makeStars();

/* ================= Player ================= */
const player = { x:0, y:0, scale:1, hitCooldown:0 };
function resetPlayer(){
  player.x = W/2;
  player.y = H - 80;
  player.scale = Math.max(1, Math.min(W, H) / 480);
  player.scale = Math.min(player.scale, 1.7);
  player.hitCooldown = 0;
}
resetPlayer();

/* ================= Helpers ================= */
function rnd(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

/* ================= Shooting (single big blue) ================= */
function shoot(){
  if(G.fireCooldown > 0) return;
  G.fireCooldown = 0.16;
  const s = player.scale;
  G.bullets.push({
    x: player.x,
    y: player.y - 26*s,
    r: 9*s,
    vy: -780,
    glow: '#38b6ff'
  });
  burst(player.x, player.y-28*s, '#38b6ff', 6, 130);
}

/* ================= Enemy ================= */
function enemyRadius(){
  return clamp(Math.min(W,H) * 0.045, 22, 46);
}
function spawnEnemy(){
  const r = enemyRadius() * rnd(0.85, 1.15);
  G.enemies.push({
    x: rnd(r+20, W-r-20),
    y: -r-20,
    r,
    vy: rnd(70, 120) + G.time*0.5,
    vx: rnd(-40, 40),
    rot: Math.random()*Math.PI,
    rotSpeed: rnd(-1.2, 1.2),
    hp: 1
  });
}

/* ================= Boss ================= */
function spawnBoss(){
  G.bossPhase = true;
  const waveIndex = Math.max(1, Math.floor(G.score / 1000));
  const bw = clamp(W * 0.42, 160, 280);
  G.boss = {
    x: W/2, y: -bw*0.5,
    w: bw, h: bw*0.55,
    targetY: Math.min(130, H*0.16),
    dir: 1, speed: W*0.35,
    fireTimer: 1.2,
    hp: 30 + waveIndex*10,
    maxHp: 30 + waveIndex*10,
    entering: true,
    bulletsPerVolley: 3 + (waveIndex-1)*2
  };
  if(G.boss.bulletsPerVolley > 15) G.boss.bulletsPerVolley = 15;
  showMessage('⚠️ باس وارد شد ⚠️');
}

/* ================= Particles ================= */
function burst(x,y,color,n,spd){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const s = Math.random()*spd+40;
    G.particles.push({
      x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:rnd(0.35,0.85), max:0.85, color, r:rnd(1.6,4.2)
    });
  }
}
function shockwave(x,y,color,rMax){
  G.shockwaves.push({x,y,color,r:4,rMax,life:1,max:1});
}
function floatText(x,y,txt,color){
  G.floatTexts.push({x,y,txt,color,life:1.1,max:1.1});
}

/* ================= Messages ================= */
let msgTimer = null;
function showMessage(txt, dur=1600){
  const el = document.getElementById('message');
  el.textContent = txt;
  el.classList.add('show');
  clearTimeout(msgTimer);
  msgTimer = setTimeout(()=> el.classList.remove('show'), dur);
}

/* ================= Input ================= */
function onPointerDown(e){
  if(G.over) return;
  const t = e.touches ? e.touches[0] : e;
  G.touch.active = true;
  G.touch.x = t.clientX;
  G.touch.y = t.clientY;
  if(Math.abs(player.x - t.clientX) > 40) player.x = t.clientX;
  if(e.cancelable) e.preventDefault();
}
function onPointerMove(e){
  if(!G.touch.active) return;
  const t = e.touches ? e.touches[0] : e;
  G.touch.x = t.clientX;
  G.touch.y = t.clientY;
  player.x = t.clientX;
  const targetY = Math.min(t.clientY, H - 60);
  player.y += (targetY - player.y) * 0.25;
  if(e.cancelable) e.preventDefault();
}
function onPointerUp(){ G.touch.active = false; }
cv.addEventListener('touchstart', onPointerDown, {passive:false});
cv.addEventListener('touchmove', onPointerMove, {passive:false});
cv.addEventListener('touchend', onPointerUp);
cv.addEventListener('touchcancel', onPointerUp);
cv.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', e=>{ if(G.touch.active) onPointerMove(e); });
window.addEventListener('mouseup', onPointerUp);

window.addEventListener('keydown', e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA') G.keysLeft = true;
  if(e.code==='ArrowRight'||e.code==='KeyD') G.keysRight = true;
  if(e.code==='Space') G.keysFire = true;
});
window.addEventListener('keyup', e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA') G.keysLeft = false;
  if(e.code==='ArrowRight'||e.code==='KeyD') G.keysRight = false;
  if(e.code==='Space') G.keysFire = false;
});

/* ================= UI ================= */
const heartsEl = document.getElementById('hearts');
const scoreEl  = document.getElementById('score');
const coinsEl  = document.getElementById('coins');
const recordEl = document.getElementById('record');

function updateUI(){
  let h = '';
  for(let i=0;i<3;i++) h += `<span class="${i<G.lives?'':'dead'}">❤️</span>`;
  heartsEl.innerHTML = h;
  scoreEl.textContent = 'امتیاز ' + G.score;
  coinsEl.textContent = '💰 ' + store.coins;
  if(G.score > store.record) store.record = G.score;
  recordEl.textContent = 'رکورد ' + store.record;
}

/* ================= Game Flow ================= */
const gameOverEl = document.getElementById('gameOver');
const restartBtn = document.getElementById('restartBtn');

function startGame(){
  G.running = true; G.over = false;
  G.score = 0; G.lives = 3;
  G.time = 0; G.spawnTimer = 0.4; G.spawnInterval = 1.15;
  G.bossPhase = false; G.boss = null; G.nextBossScore = 1000;
  G.bullets = []; G.enemies = []; G.enemyBullets = [];
  G.particles = []; G.floatTexts = []; G.shockwaves = [];
  G.fireCooldown = 0; G.shake = 0; G.flash = 0;
  G.touch.active = false;
  resetPlayer();
  updateUI();
  gameOverEl.classList.remove('show');
  showMessage('🚀 بازی شروع شد', 1800);
}

function endGame(){
  G.running = false; G.over = true;
  if(G.score > store.record) store.record = G.score;
  updateUI();
  document.getElementById('goText').innerHTML =
    `امتیاز این دست: <b style="color:#7ef0ff">${G.score}</b><br>` +
    `رکورد: <b style="color:#ffd84d">${store.record}</b><br>` +
    `کل سکه‌ها: <b style="color:#ffcf33">${store.coins}</b> 💰`;
  gameOverEl.classList.add('show');
}

restartBtn.addEventListener('click', startGame);

/* ================= Update ================= */
function update(dt){
  G.time += dt;
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt*3);
  if(G.flash > 0) G.flash = Math.max(0, G.flash - dt*3.5);
  if(player.hitCooldown > 0) player.hitCooldown -= dt;

  const s = player.speed || 520;
  if(G.keysLeft)  player.x -= s*dt;
  if(G.keysRight) player.x += s*dt;
  player.x = clamp(player.x, 40, W-40);
  player.y = clamp(player.y, H*0.35, H - 50);

  if(G.fireCooldown > 0) G.fireCooldown -= dt;
  if(G.touch.active || G.keysFire) shoot();

  for(let i=G.bullets.length-1;i>=0;i--){
    const b = G.bullets[i];
    b.y += b.vy*dt;
    if(b.y < -20) G.bullets.splice(i,1);
  }

  if(!G.bossPhase){
    G.spawnTimer -= dt;
    if(G.spawnTimer <= 0){
      spawnEnemy();
      G.spawnTimer = Math.max(0.35, G.spawnInterval - G.time*0.01);
    }
  }

  for(let i=G.enemies.length-1;i>=0;i--){
    const e = G.enemies[i];
    e.y += e.vy*dt;
    e.x += e.vx*dt;
    if(e.x < e.r){ e.x = e.r; e.vx *= -1; }
    if(e.x > W-e.r){ e.x = W-e.r; e.vx *= -1; }
    e.rot += e.rotSpeed*dt;
    if(e.y > H + 60) G.enemies.splice(i,1);
  }

  for(let i=G.bullets.length-1;i>=0;i--){
    const b = G.bullets[i];
    let hit = false;
    for(let j=G.enemies.length-1;j>=0;j--){
      const e = G.enemies[j];
      const dx = b.x - e.x, dy = b.y - e.y;
      if(dx*dx + dy*dy < (b.r + e.r)*(b.r + e.r)){
        burst(e.x, e.y, '#ff5d8f', 16, 260);
        shockwave(e.x, e.y, '#ff5d8f', e.r*2.4);
        G.enemies.splice(j,1);
        G.score += 30;
        store.coins = store.coins + 3;
        floatText(e.x, e.y, '+30', '#7ef0ff');
        floatText(e.x, e.y-20, '+3💰', '#ffe066');
        updateUI();
        checkBossTrigger();
        hit = true;
        break;
      }
    }
    if(hit) G.bullets.splice(i,1);
  }

  if(G.boss){
    const bs = G.boss;
    if(bs.entering){
      bs.y += 160*dt;
      if(bs.y >= bs.targetY){ bs.y = bs.targetY; bs.entering = false; }
    } else {
      bs.x += bs.dir*bs.speed*dt;
      if(bs.x > W - bs.w/2 - 10){ bs.x = W - bs.w/2 - 10; bs.dir = -1; }
      if(bs.x < bs.w/2 + 10){ bs.x = bs.w/2 + 10; bs.dir = 1; }
      bs.fireTimer -= dt;
      if(bs.fireTimer <= 0){
        bs.fireTimer = 1.3;
        const n = bs.bulletsPerVolley;
        const spacing = (bs.w - 40) / Math.max(1, n-1);
        for(let k=0;k<n;k++){
          G.enemyBullets.push({
            x: bs.x - bs.w/2 + 20 + k*spacing,
            y: bs.y + bs.h/2 - 4,
            r: 6, vy: 320, vx: 0
          });
        }
      }
    }

    for(let i=G.bullets.length-1;i>=0;i--){
      const b = G.bullets[i];
      if(b.x > bs.x - bs.w/2 && b.x < bs.x + bs.w/2 &&
         b.y > bs.y - bs.h/2 && b.y < bs.y + bs.h/2){
        burst(b.x, b.y, '#ffd84d', 8, 220);
        bs.hp -= 1;
        G.bullets.splice(i,1);
        if(bs.hp <= 0){
          burst(bs.x, bs.y, '#ff7b00', 70, 440);
          burst(bs.x, bs.y, '#ffe066', 50, 340);
          shockwave(bs.x, bs.y, '#ffd84d', bs.w*1.2);
          G.shake = 1.3; G.flash = 1;
          G.score += 100;
          store.coins = store.coins + 30;
          floatText(bs.x, bs.y, '+100', '#7ef0ff');
          floatText(bs.x, bs.y-25, '+30💰', '#ffe066');
          G.boss = null;
          G.bossPhase = false;
          updateUI();
          showMessage('🌊 موج بعدی');
          checkBossTrigger();
        }
      }
    }
  }

  for(let i=G.enemyBullets.length-1;i>=0;i--){
    const b = G.enemyBullets[i];
    b.x += b.vx*dt;
    b.y += b.vy*dt;
    if(b.y > H + 20 || b.x < -20 || b.x > W+20){ G.enemyBullets.splice(i,1); continue; }
    if(!G.over && player.hitCooldown <= 0){
      const dx = b.x - player.x, dy = b.y - player.y;
      const hitR = 16 * player.scale;
      if(dx*dx + dy*dy < (b.r + hitR)*(b.r + hitR)){
        G.enemyBullets.splice(i,1);
        hitPlayer(b.x, b.y);
      }
    }
  }

  if(!G.over && player.hitCooldown <= 0){
    for(let i=G.enemies.length-1;i>=0;i--){
      const e = G.enemies[i];
      const dx = e.x - player.x, dy = e.y - player.y;
      const hitR = 16 * player.scale;
      if(Math.abs(dx) < e.r + hitR && Math.abs(dy) < e.r + hitR){
        G.enemies.splice(i,1);
        G.lives--;
        player.hitCooldown = 1.0;
        updateUI();
        if(G.lives <= 0){
          G.lives = 0;
          setTimeout(endGame, 260);
        }
        break;
      }
    }
  }

  for(let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= dt;
    if(p.life <= 0) G.particles.splice(i,1);
  }
  for(let i=G.shockwaves.length-1;i>=0;i--){
    const w = G.shockwaves[i];
    w.r += (w.rMax - w.r) * dt * 6;
    w.life -= dt;
    if(w.life <= 0) G.shockwaves.splice(i,1);
  }
  for(let i=G.floatTexts.length-1;i>=0;i--){
    const f = G.floatTexts[i];
    f.y -= 50*dt;
    f.life -= dt;
    if(f.life <= 0) G.floatTexts.splice(i,1);
  }
  for(const st of G.stars){
    st.y += st.s*dt*(0.3 + st.r*0.3);
    if(st.y > H){ st.y = -4; st.x = Math.random()*W; }
  }
}

function checkBossTrigger(){
  if(!G.bossPhase && G.score >= G.nextBossScore){
    G.nextBossScore += 1000;
    spawnBoss();
  }
}

function hitPlayer(hitX, hitY){
  G.shake = 1.4;
  G.flash = 0.9;
  const ix = (hitX !== undefined) ? hitX : player.x;
  const iy = (hitY !== undefined) ? hitY : player.y;
  burst(ix, iy, '#ff3355', 40, 420);
  burst(ix, iy, '#ffd84d', 25, 360);
  burst(ix, iy, '#7ef0ff', 20, 280);
  shockwave(ix, iy, '#ff3355', Math.min(W,H)*0.35);
  shockwave(ix, iy, '#ffd84d', Math.min(W,H)*0.22);

  player.hitCooldown = 1.2;
  G.lives--;
  updateUI();
  if(G.lives <= 0){
    G.lives = 0;
    setTimeout(endGame, 320);
  }
}

/* ================= Draw ================= */
/* سفینه: بدنه قرمز تیره، لبه نئون قرمز روشن، کابین صورتی-سفید، موتور قرمز */
function drawShip(x,y,scale){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale, scale);

  const blink = player.hitCooldown > 0 && Math.floor(player.hitCooldown*14) % 2 === 0;
  if(blink) ctx.globalAlpha = 0.5;

  // engine glow (red)
  const g = ctx.createRadialGradient(0,22,0, 0,22,32);
  g.addColorStop(0,'rgba(255,90,110,.98)');
  g.addColorStop(0.5,'rgba(255,30,60,.55)');
  g.addColorStop(1,'rgba(255,0,40,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0,26,32,0,Math.PI*2);
  ctx.fill();

  // outer neon red aura
  ctx.shadowColor = '#ff2b4d';
  ctx.shadowBlur = 26;

  // body
  ctx.fillStyle = '#3a0c14';
  ctx.strokeStyle = '#ff5566';
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(0, -32);
  ctx.lineTo(-38, 18);
  ctx.lineTo(-20, 8);
  ctx.lineTo(-10, 22);
  ctx.lineTo(0, 28);
  ctx.lineTo(10, 22);
  ctx.lineTo(20, 8);
  ctx.lineTo(38, 18);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // inner highlight line
  ctx.shadowBlur = 8;
  ctx.strokeStyle = 'rgba(255,150,160,.7)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, -26);
  ctx.lineTo(-16, 10);
  ctx.moveTo(0, -26);
  ctx.lineTo(16, 10);
  ctx.stroke();

  // cockpit (pink-white glow)
  ctx.shadowColor = '#ffb0c0';
  ctx.shadowBlur = 16;
  ctx.fillStyle = 'rgba(255,190,205,.95)';
  ctx.beginPath();
  ctx.ellipse(0, -8, 7, 12, 0, 0, Math.PI*2);
  ctx.fill();

  // small glowing wing tips
  ctx.shadowColor = '#ff3355';
  ctx.shadowBlur = 14;
  ctx.fillStyle = '#ff4d6a';
  ctx.beginPath(); ctx.arc(-34, 16, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( 34, 16, 3, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

function drawHexagon(x,y,r,rot){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);

  ctx.shadowColor = '#ff2b6d';
  ctx.shadowBlur = 20;

  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a = (Math.PI/3)*i - Math.PI/2;
    const px = Math.cos(a)*r, py = Math.sin(a)*r;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();

  const grad = ctx.createRadialGradient(0,0,r*0.15, 0,0,r);
  grad.addColorStop(0,'rgba(255,110,150,.35)');
  grad.addColorStop(1,'rgba(255,43,109,.08)');
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.strokeStyle = '#ff4d7d';
  ctx.lineWidth = 2.6;
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,140,170,.4)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a = (Math.PI/3)*i - Math.PI/2;
    const px = Math.cos(a)*r*0.6, py = Math.sin(a)*r*0.6;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.stroke();

  ctx.restore();
}

function drawBoss(bs){
  ctx.save();
  ctx.translate(bs.x, bs.y);

  ctx.shadowColor = '#ff2b6d';
  ctx.shadowBlur = 30;

  ctx.beginPath();
  ctx.moveTo(-bs.w/2, -bs.h/2);
  ctx.lineTo(bs.w/2, -bs.h/2);
  ctx.lineTo(bs.w/2 + 30, 0);
  ctx.lineTo(bs.w/2, bs.h/2);
  ctx.lineTo(-bs.w/2, bs.h/2);
  ctx.lineTo(-bs.w/2 - 30, 0);
  ctx.closePath();

  const grad = ctx.createLinearGradient(0,-bs.h/2,0,bs.h/2);
  grad.addColorStop(0,'#3a0a1a');
  grad.addColorStop(0.5,'#8a1030');
  grad.addColorStop(1,'#2a0612');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#ff4d7d';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.shadowColor = '#ffd84d';
  ctx.shadowBlur = 30;
  const cg = ctx.createRadialGradient(0,0,4, 0,0,36);
  cg.addColorStop(0,'#fff5c0');
  cg.addColorStop(0.5,'#ffcc33');
  cg.addColorStop(1,'rgba(255,80,0,0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(0,0,36,0,Math.PI*2);
  ctx.fill();

  ctx.shadowColor = '#ff4d7d';
  ctx.shadowBlur = 14;
  ctx.fillStyle = '#ff2b6d';
  const cannons = Math.min(bs.bulletsPerVolley, 15);
  const step = (bs.w-40)/Math.max(1,(cannons-1));
  for(let i=0;i<cannons;i++){
    const cx = -bs.w/2 + 20 + i*step;
    ctx.beginPath();
    ctx.arc(cx, bs.h/2-6, 5, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  const pct = Math.max(0, bs.hp/bs.maxHp);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(W/2 - 140, 14, 280, 12);
  const g2 = ctx.createLinearGradient(W/2-140,0,W/2+140,0);
  g2.addColorStop(0,'#ff2b6d');
  g2.addColorStop(1,'#ffd84d');
  ctx.fillStyle = g2;
  ctx.fillRect(W/2 - 140, 14, 280*pct, 12);
  ctx.strokeStyle = '#ff4d7d';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(W/2 - 140, 14, 280, 12);
  ctx.restore();
}

function draw(){
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  for(const s of G.stars){
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  if(G.flash > 0){
    ctx.fillStyle = `rgba(255,60,90,${G.flash*0.28})`;
    ctx.fillRect(0,0,W,H);
  }

  ctx.save();
  if(G.shake > 0){
    const m = G.shake * 9;
    ctx.translate(rnd(-m,m), rnd(-m,m));
  }

  for(const w of G.shockwaves){
    ctx.globalAlpha = w.life * 0.7;
    ctx.strokeStyle = w.color;
    ctx.shadowColor = w.color;
    ctx.shadowBlur = 20;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.r, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  for(const p of G.particles){
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r*a, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  for(const b of G.enemyBullets){
    ctx.shadowColor = '#ff4d7d';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#ff4d7d';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  for(const b of G.bullets){
    ctx.shadowColor = '#38b6ff';
    ctx.shadowBlur = 26;
    const g = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, b.r*2.2);
    g.addColorStop(0, 'rgba(200,240,255,1)');
    g.addColorStop(0.5, 'rgba(56,182,255,.9)');
    g.addColorStop(1, 'rgba(56,182,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r*2.2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#d6f4ff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  for(const e of G.enemies) drawHexagon(e.x, e.y, e.r, e.rot);
  if(G.boss) drawBoss(G.boss);
  if(!G.over && G.running) drawShip(player.x, player.y, player.scale);

  for(const f of G.floatTexts){
    const a = f.life / f.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = f.color;
    ctx.font = 'bold 18px Orbitron, Vazirmatn, Tahoma';
    ctx.textAlign = 'center';
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 12;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  ctx.restore();
}

/* ================= Loop ================= */
let last = performance.now();
function loop(now){
  const dt = Math.min((now - last)/1000, 0.05);
  last = now;
  if(G.running && !G.over) update(dt);
  else {
    for(const s of G.stars){
      s.y += s.s*dt*0.15;
      if(s.y > H){ s.y = -4; s.x = Math.random()*W; }
    }
  }
  draw();
  requestAnimationFrame(loop);
}

updateUI();
setTimeout(()=> showMessage('🚀 بازی شروع شد', 1800), 150);
requestAnimationFrame(loop);
</script>
