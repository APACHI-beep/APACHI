<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>علم با نیکان | ویدیوهای علمی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-pink: #ff00ff;
            --bg-dark: #0f0f13;
            --card-bg: #1a1a20;
        }
        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container { max-width: 900px; width: 100%; }
        
        /* هدر سایت */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        header h1 {
            color: var(--neon-cyan);
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        header p { color: #aaa; }

        /* شبکه ویدیوها */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-card-list {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #333;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.1);
        }
        .video-card-list:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.4);
            border-color: var(--neon-pink);
        }
        .video-card-list img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 2px solid var(--neon-cyan);
        }
        .video-card-list .info { padding: 15px; }
        .video-card-list h3 { margin: 0 0 10px 0; font-size: 1.1rem; color: var(--neon-cyan); }
        .video-card-list p { margin: 0; font-size: 0.9rem; color: #aaa; }

        /* صفحه تماشای ویدیو */
        #watchSection { display: none; }
        .back-btn {
            background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan);
            padding: 8px 15px; border-radius: 8px; cursor: pointer; margin-bottom: 20px;
            font-family: inherit; transition: 0.3s;
        }
        .back-btn:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }
        
        .video-player-card {
            background: var(--card-bg); border-radius: 15px; overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.2); border: 1px solid var(--neon-cyan);
        }
        video { width: 100%; display: block; }
        .video-info { padding: 20px; }
        .video-info h2 { margin-top: 0; color: var(--neon-pink); text-shadow: 0 0 10px rgba(255, 0, 255, 0.5); }
        .character-badge {
            display: inline-block; background: #333; color: var(--neon-cyan);
            padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; margin-bottom: 10px;
            border: 1px solid var(--neon-cyan);
        }

        /* دکمه‌ها و کامنت‌ها */
        .actions { display: flex; gap: 15px; margin-top: 15px; }
        button.action-btn {
            background: transparent; color: var(--neon-pink); border: 1px solid var(--neon-pink);
            padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: inherit;
            font-size: 16px; transition: all 0.3s; box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
        }
        button.action-btn:hover { background: var(--neon-pink); color: #fff; box-shadow: 0 0 20px rgba(255, 0, 255, 0.6); }
        button.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .comments-section {
            margin-top: 20px; background: var(--card-bg); padding: 20px;
            border-radius: 15px; border: 1px solid #333;
        }
        .comment-input { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input, textarea {
            background: #2a2a30; border: 1px solid #444; color: #fff;
            padding: 10px; border-radius: 8px; font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--neon-cyan); }
        .comment-item {
            background: #2a2a30; padding: 15px; border-radius: 8px;
            margin-bottom: 10px; border-right: 4px solid var(--neon-pink);
        }
        .comment-author { color: var(--neon-cyan); font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>علم با نیکان</h1>
        <p>ویدیوهای کوتاه علمی با گرافیک نئونی و انیمیشن‌های پرانرژی</p>
    </header>

    <!-- بخش لیست ویدیوها -->
    <div id="listSection">
        <h2 style="color: var(--neon-cyan); margin-bottom: 20px;">آرشیو ویدیوها</h2>
        <div class="video-grid" id="videoGrid">
            <p>در حال بارگذاری ویدیوها...</p>
        </div>
    </div>

    <!-- بخش پخش ویدیو و کامنت -->
    <div id="watchSection">
        <button class="back-btn" onclick="goBack()">← بازگشت به لیست ویدیوها</button>
        
        <div class="video-player-card">
            <video id="mainVideo" controls>
                <source src="" type="video/mp4">
            </video>
            <div class="video-info">
                <span class="character-badge" id="videoCharacter">شخصیت: نیکان</span>
                <h2 id="videoTitle">عنوان ویدیو</h2>
                <p id="videoDesc">توضیحات ویدیو...</p>
                <div class="actions">
                    <button class="action-btn" id="likeBtn">❤️ لایک (<span id="likeCount">0</span>)</button>
                </div>
            </div>
        </div>

        <div class="comments-section">
            <h3>نظرات (<span id="commentCount">0</span>)</h3>
            <div class="comment-input">
                <input type="text" id="authorName" placeholder="نام شما...">
                <textarea id="commentContent" rows="3" placeholder="نظر خود را بنویسید..."></textarea>
                <button class="action-btn" id="submitComment">ارسال نظر</button>
            </div>
            <div id="commentsList"></div>
        </div>
    </div>
</div>

<script>
    // --- تنظیمات Supabase (اطلاعات شما) ---
    const SUPABASE_URL = 'https://dqykeqtibspeajxdpsuk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4eLhQiDjFiWpTZn-P5w0dw_Q4xJgLLM';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentVideoId = null;

    // بارگذاری لیست ویدیوها
    async function loadVideos() {
        const { data, error } = await supabaseClient.from('videos').select('*');
        
        if (error) {
            console.error('خطا در دریافت ویدیوها:', error);
            document.getElementById('videoGrid').innerHTML = '<p>خطا در بارگذاری ویدیوها. لطفا کدهای SQL را در دیتابیس اجرا کنید.</p>';
            return;
        }

        const grid = document.getElementById('videoGrid');
        grid.innerHTML = '';

        if(data.length === 0) {
             grid.innerHTML = '<p>هیچ ویدیویی در دیتابیس یافت نشد.</p>';
             return;
        }

        data.forEach(video => {
            const card = document.createElement('div');
            card.className = 'video-card-list';
            const coverImg = 'https://via.placeholder.com/400x200/1a1a20/00ffff?text=Science+Video';
            card.innerHTML = `
                <img src="${coverImg}" alt="کاور">
                <div class="info">
                    <h3>${video.title}</h3>
                    <p>${video.description.substring(0, 60)}...</p>
                </div>
            `;
            card.onclick = () => openVideo(video);
            grid.appendChild(card);
        });
    }

    // باز کردن ویدیو
    function openVideo(video) {
        currentVideoId = video.id;
        
        document.getElementById('listSection').style.display = 'none';
        document.getElementById('watchSection').style.display = 'block';
        window.scrollTo(0, 0);

        document.getElementById('mainVideo').src = video.video_url;
        document.getElementById('videoTitle').innerText = video.title;
        document.getElementById('videoDesc').innerText = video.description;
        document.getElementById('videoCharacter').innerText = `شخصیت: ${video.character_name || 'نیکان'}`;
        
        const btn = document.getElementById('likeBtn');
        btn.disabled = false;

        fetchLikes();
        fetchComments();
    }

    // بازگشت به لیست
    function goBack() {
        document.getElementById('mainVideo').pause();
        document.getElementById('mainVideo').src = '';
        document.getElementById('watchSection').style.display = 'none';
        document.getElementById('listSection').style.display = 'block';
    }

    // لایک‌ها
    async function fetchLikes() {
        const { count } = await supabaseClient
            .from('likes')
            .select('*', { count: 'exact', head: true })
            .eq('video_id', currentVideoId);
        document.getElementById('likeCount').innerText = count || 0;
    }

    document.getElementById('likeBtn').addEventListener('click', async () => {
        if (!currentVideoId) return;
        const btn = document.getElementById('likeBtn');
        btn.disabled = true;

        const { error } = await supabaseClient.from('likes').insert([{ video_id: currentVideoId }]);
        if (!error) {
            const currentCount = parseInt(document.getElementById('likeCount').innerText);
            document.getElementById('likeCount').innerText = currentCount + 1;
        }
    });

    // کامنت‌ها
    async function fetchComments() {
        const { data, error } = await supabaseClient
            .from('comments')
            .select('*')
            .eq('video_id', currentVideoId)
            .order('created_at', { ascending: false });

        if (error) return;

        document.getElementById('commentCount').innerText = data.length;
        const commentsList = document.getElementById('commentsList');
        commentsList.innerHTML = '';

        if (data.length === 0) {
            commentsList.innerHTML = '<p style="color:#888;">هنوز نظری ثبت نشده است. اولین نفر باشید!</p>';
            return;
        }

        data.forEach(comment => {
            const date = new Date(comment.created_at).toLocaleDateString('fa-IR');
            commentsList.innerHTML += `
                <div class="comment-item">
                    <div class="comment-author">${comment.author_name} <span style="font-size:12px;color:#888;">(${date})</span></div>
                    <div>${comment.content}</div>
                </div>
            `;
        });
    }

    // ارسال کامنت
    document.getElementById('submitComment').addEventListener('click', async () => {
        const name = document.getElementById('authorName').value.trim();
        const content = document.getElementById('commentContent').value.trim();

        if (!name || !content) { alert('لطفا نام و متن نظر را وارد کنید.'); return; }

        const { error } = await supabaseClient.from('comments').insert([{ 
            video_id: currentVideoId, author_name: name, content: content 
        }]);

        if (!error) {
            document.getElementById('commentContent').value = '';
            fetchComments(); 
        } else {
            console.error(error);
            alert('خطا در ارسال نظر');
        }
    });

    // اجرای اولیه
    loadVideos();
</script>
</body>
</html>
