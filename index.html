// ============ حافظه مرورگر ============
function saveGame() {
  localStorage.setItem('iranwar_data', JSON.stringify({
    name: playerName,
    country: playerCountry,
    code: playerCode,
    hasEquipment: hasEquipment
  }));
}

function loadGame() {
  const data = localStorage.getItem('iranwar_data');
  if (data) {
    const parsed = JSON.parse(data);
    if (parsed.name) {
      playerName = parsed.name;
      playerCountry = parsed.country;
      playerCode = parsed.code;
      hasEquipment = parsed.hasEquipment || false;
      showScreen('screen-menu');
    }
  }
}

// ============ ناوبری ============
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function backToMenu() { showScreen('screen-menu'); }

}

// ============ مدیریت دو چت کاملاً مجزا ============
function openChat(type) {
  currentChatType = type;
  showScreen('screen-chat');
  const title = document.getElementById('chatTitle');
  const box = document.getElementById('chatBox');
  box.innerHTML = '';

  if (type === 'country') {
    title.textContent = '🧑‍💻 بات کشورگیری';
    if (countryChatHistory.length > 0) {
      countryChatHistory.forEach(m => renderMsg(m.role, m.text, m.copyable));
    } else {
      addMsg('bot', سلام ${playerName}! 👋\nاسم یک کشور یا گروهک رو بفرست تا برات ثبت کنم.);
    }
  } else if (type === 'equipment') {
    title.textContent = '🚀 بات تجهیزات';
    if (equipmentChatHistory.length > 0) {
      equipmentChatHistory.forEach(m => renderMsg(m.role, m.text, m.copyable));
    } else {
      addMsg('bot', سلام ${playerName} خوش اومدی 👋\nکد کشور خودت رو بده تا تجهیزات کشورت رو بهت بدم 🚀);
    }
  }
}

// ============ رندر پیام (با دکمه کپی) ============
function renderMsg(role, text, copyable) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;

  if (copyable) {
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '📋 کپی متن';
    btn.onclick = () => {
      navigator.clipboard.writeText(text).then(() => {btn.textContent = '✅ کپی شد!';
        setTimeout(() => { btn.textContent = '📋 کپی متن'; }, 1500);
      }).catch(() => {
        // فالبک برای مرورگرهای قدیمی
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        btn.textContent = '✅ کپی شد!';
        setTimeout(() => { btn.textContent = '📋 کپی متن'; }, 1500);
      });
    };
    div.appendChild(btn);
  }

  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// ============ افزودن پیام (ذخیره در تاریخچه) ============
function addMsg(role, text, copyable = false) {
  const history = currentChatType === 'country' ? countryChatHistory : equipmentChatHistory;
  history.push({ role, text, copyable });
  renderMsg(role, text, copyable);
}

// ============ ارسال پیام ============
async function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg('user', text, false);

  if (currentChatType === 'country') {
    await handleCountryChat(text);
  } else {
    await handleEquipmentChat(text);
  }
}
// ============ منطق بات کشورگیری ============
async function handleCountryChat(text) {
  if (playerCountry) {
    setTimeout(() => addMsg('bot', 'شما قبلاً کشور گرفته‌اید. منتظر سیزن بعد باشید ⏳'), 400);
    return;
  }

  const found = ALL_ENTITIES.find(e => e === text);
  if (!found) {
    setTimeout(() => addMsg('bot', 'کشور یافت نشد ❌'), 400);
    return;
  }

  try {
    const { data: existing } = await db.from('player_countries')
      .select('country').eq('country', found).maybeSingle();

    if (existing) {
      setTimeout(() => addMsg('bot', 'این کشور از قبل گرفته شده است ❌'), 400);
      return;
    }

    const code = Math.floor(1000 + Math.random() * 9000);
    const { error } = await db.from('player_countries')
      .insert([{ player_name: playerName, country: found, code: code }]);

    if (error) throw error;

    playerCountry = found;
    playerCode = code;
    saveGame();

    setTimeout(() => addMsg('bot', 'کشور شما با موفقیت ثبت شد ✅'), 400);
    setTimeout(() => addMsg('bot', 🔑 کد اختصاصی شما: ${code}), 900);
    setTimeout(() => addMsg('bot', 'منتظر سیزن بعد باشید ⏳'), 1400);

  } catch (err) {
    console.error(err);
    setTimeout(() => addMsg('bot', 'خطا در ثبت اطلاعات ❌'), 400);
  }
}

// ============ منطق بات تجهیزات ============
async function handleEquipmentChat(inputCode) {
  if (hasEquipment) {
    setTimeout(() => addMsg('bot', 'شما قبلاً تجهیزات خود را دریافت کرده‌اید. ⏳'), 400);
    return;
  }

  if (!playerCountry || !playerCode) {
    setTimeout(() => addMsg('bot', 'شما هنوز کشوری نگرفته‌اید! اول از بات کشورگیری یک کشور بگیرید ❌'), 400);
    return;
  }

  if (parseInt(inputCode) !== playerCode) {
    setTimeout(() => addMsg('bot', 'کد اشتباه است! کدی که بات کشورگیری به شما داد را وارد کنید ❌'), 400);
    return;
  }

  let equipment;
  if (playerCountry === 'داعش') {
    equipment = ISIS_TEXT;
  } else if (EQUIPMENT_DB[playerCountry]) {
    equipment = EQUIPMENT_DB[playerCountry];
  } else {
    equipment = getDefaultEquipment(playerCountry);
  }

  try {
    await db.from('equipment_claims').insert([{
      player_name: playerName,
      country: playerCountry,
      equipment: equipment
    }]);

    hasEquipment = true;
    saveGame();

    setTimeout(() => addMsg('bot', کد تایید شد ✅\nکشور شما: ${playerCountry}), 400);
    setTimeout(() => addMsg('bot', equipment, true), 900);
    setTimeout(() => addMsg('bot', 'موفق باشی فرمانده! 🫡'), 1600);

  } catch (err) {
    console.error(err);
    setTimeout(() => addMsg('bot', 'خطا در دریافت تجهیزات ❌'), 400);
  }
}

// ============ صفحه کشورها ============
async function openCountries() {
  showScreen('screen-countries');
  const list = document.getElementById('countriesList');
  list.innerHTML = '<p style="text-align:center;color:#888;padding:20px">در حال دریافت اطلاعات...</p>';let takenSet = new Set();
  try {
    const { data } = await db.from('player_countries').select('country');
    if (data) takenSet = new Set(data.map(r => r.country));
  } catch (e) { console.log(e); }

  list.innerHTML = '';
  ALL_ENTITIES.forEach(c => {
    const isTaken = takenSet.has(c);
    const div = document.createElement('div');
    div.className = 'country-item' + (isTaken ? ' taken' : '');
    div.innerHTML = <span>${c}</span> +
      (isTaken ? '<span class="check">✅</span>' : '<span style="color:#64748b">—</span>');
    list.appendChild(div);
  });
}

// ============ شروع بازی ============
loadGame();
