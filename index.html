<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APACHI | دنیای داستان‌های تعاملی</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#080b18;
  --panel:#11172b;
  --panel2:#171f38;
  --text:#f4f6ff;
  --muted:#9ba8c5;
  --blue:#00cfff;
  --purple:#9b72ff;
  --pink:#ec65c8;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  font-family:'Vazirmatn',sans-serif;
  background:
    radial-gradient(ellipse at 10% 0%,#17265a 0%,transparent 40%),
    radial-gradient(ellipse at 90% 30%,#29144b 0%,transparent 35%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input {
  font-family:inherit;
}

button {
  cursor:pointer;
}

header {
  position:sticky;
  top:0;
  z-index:20;
  background:#080b18eF;
  backdrop-filter:blur(18px);
  border-bottom:1px solid #ffffff12;
}

.nav {
  max-width:1250px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.brand {
  font-size:28px;
  font-weight:900;
  letter-spacing:3px;
  color:var(--blue);
  text-shadow:0 0 20px #00cfff80;
}

.brand span {
  color:white;
}

.nav button {
  background:#ffffff10;
  color:white;
  border:1px solid #ffffff20;
  padding:10px 16px;
  border-radius:12px;
}

.hero {
  max-width:1200px;
  margin:45px auto;
  padding:30px 22px;
}

.hero-box {
  position:relative;
  overflow:hidden;
  border:1px solid #ffffff20;
  border-radius:28px;
  padding:55px 35px;
  background:
    radial-gradient(circle at 80% 30%,#7c3aed55,transparent 40%),
    linear-gradient(120deg,#101a39,#15102d);
  box-shadow:0 25px 90px #0008;
}

.hero h1 {
  font-size:clamp(32px,6vw,62px);
  line-height:1.4;
  margin:0 0 15px;
}

.hero h1 span {
  color:var(--blue);
}

.hero p {
  color:#bdc9e8;
  max-width:600px;
  line-height:2;
}

.hero button {
  margin-top:15px;
  border:0;
  padding:14px 24px;
  border-radius:13px;
  color:#07101e;
  font-weight:900;
  background:linear-gradient(100deg,var(--blue),#8b7cff);
}

.hero-art {
  position:absolute;
  left:35px;
  top:20px;
  width:200px;
  height:230px;
  opacity:.9;
  pointer-events:none;
}

@media(max-width:700px) {
  .hero-art {display:none}
  .hero-box {padding:35px 22px}
}

.container {
  max-width:1250px;
  margin:auto;
  padding:0 20px 70px;
}

.section-title {
  font-size:23px;
  font-weight:900;
  margin:35px 0 18px;
}

.search {
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.search input {
  flex:1;
  min-width:0;
  background:var(--panel);
  border:1px solid #ffffff20;
  color:white;
  border-radius:13px;
  padding:14px;
  outline:none;
}

.search input:focus {
  border-color:var(--blue);
}

.filters {
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:12px;
}

.filter {
  flex-shrink:0;
  background:var(--panel);
  color:#cbd5ed;
  border:1px solid #ffffff15;
  border-radius:30px;
  padding:9px 16px;
}

.filter.active {
  color:#06111c;
  background:var(--blue);
  font-weight:900;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(235px,1fr));
  gap:19px;
}

.card {
  position:relative;
  background:linear-gradient(150deg,#18213b,#101528);
  border:1px solid #ffffff15;
  border-radius:21px;
  overflow:hidden;
  transition:.25s;
  cursor:pointer;
}

.card:hover {
  transform:translateY(-7px);
  border-color:var(--blue);
  box-shadow:0 15px 40px #00cfff20;
}

.card-cover {
  height:175px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,var(--glow),transparent 70%),
    linear-gradient(145deg,var(--color),#101329);
}

.story-logo {
  position:absolute;
  top:12px;
  right:13px;
  width:47px;
  height:47px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:#080b18b8;
  border:1px solid #ffffff40;
  font-size:25px;
  box-shadow:0 0 20px var(--glow);
}

.story-character {
  width:145px;
  height:165px;
  margin-top:25px;
  filter:drop-shadow(0 10px 15px #0008);
}

.card-info {
  padding:15px;
}

.card-info h3 {
  margin:0 0 8px;
  font-size:17px;
}

.card-info p {
  color:var(--muted);
  font-size:12px;
  line-height:1.9;
  min-height:45px;
}

.meta {
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#aebbd8;
  font-size:12px;
  margin-top:12px;
}

.badge {
  background:#ffffff12;
  border-radius:30px;
  padding:5px 10px;
}

.loading {
  text-align:center;
  color:var(--muted);
  padding:45px;
}

.empty {
  text-align:center;
  color:var(--muted);
  padding:35px;
  grid-column:1/-1;
}

.modal {
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#050714ed;
  overflow-y:auto;
  padding:20px;
}

.modal.show {
  display:block;
}

.modal-content {
  max-width:850px;
  margin:25px auto;
  background:#10172b;
  border:1px solid #ffffff20;
  border-radius:25px;
  overflow:hidden;
}

.modal-head {
  position:relative;
  min-height:250px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle,var(--glow),transparent 65%),
    linear-gradient(130deg,var(--color),#11152b);
}

.modal-head .story-character {
  width:205px;
  height:225px;
}

.close {
  position:absolute;
  top:15px;
  left:15px;
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  color:white;
  background:#0008;
  font-size:22px;
}

.modal-body {
  padding:24px;
}

.modal-body h2 {
  font-size:27px;
}

.story-text {
  color:#d5def3;
  line-height:2.4;
  background:#ffffff08;
  padding:18px;
  border-radius:15px;
  margin:18px 0;
}

.scene {
  color:#9caed5;
  font-size:13px;
}

.choices {
  display:grid;
  gap:12px;
  margin-top:20px;
}

.choice {
  background:#192442;
  color:white;
  border:1px solid #ffffff20;
  border-radius:13px;
  padding:14px;
  text-align:right;
  transition:.2s;
}

.choice:hover {
  border-color:var(--blue);
  background:#20345a;
}

.action-row {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:20px 0;
}

.action-row button {
  border:1px solid #ffffff20;
  background:#ffffff10;
  color:white;
  padding:11px 16px;
  border-radius:12px;
}

.action-row button.liked {
  background:#5d2448;
  border-color:#ed68b8;
}

.comments {
  border-top:1px solid #ffffff20;
  padding-top:20px;
}

.comments input {
  width:100%;
  background:#080d1d;
  color:white;
  border:1px solid #ffffff20;
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
}

.comments button {
  border:0;
  color:#07101e;
  background:var(--blue);
  padding:11px 20px;
  border-radius:11px;
  font-weight:900;
}

.comment {
  background:#ffffff09;
  border-radius:12px;
  padding:13px;
  margin-top:10px;
  font-size:13px;
  line-height:2;
  overflow-wrap:anywhere;
}

footer {
  text-align:center;
  color:#7885a5;
  padding:30px 15px;
  border-top:1px solid #ffffff12;
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="brand">APA<span>CHI</span></div>
    <button onclick="scrollToStories()">ورود به داستان‌ها ↓</button>
  </div>
</header>

<section class="hero">
  <div class="hero-box">
    <div class="hero-art" id="heroArt"></div>

    <h1>وارد دنیای <span>APACHI</span> شو!</h1>
    <p>
      اینجا تو فقط تماشاگر نیستی.
      انتخاب می‌کنی، ماجراجویی می‌کنی و سرنوشت
      شخصیت‌ها را تغییر می‌دهی.
    </p>

    <button onclick="scrollToStories()">شروع ماجراجویی</button>
  </div>
</section>

<main class="container" id="storiesSection">

  <h2 class="section-title">🔥 محبوب‌ترین داستان‌ها</h2>
  <div class="grid" id="popularGrid">
    <div class="loading">در حال دریافت داستان‌ها...</div>
  </div>

  <h2 class="section-title">🌌 دنیای داستان‌ها</h2>

  <div class="search">
    <input id="searchInput" placeholder="نام داستان یا موضوع را جست‌وجو کن...">
  </div>

  <div class="filters" id="filters"></div>

  <div class="grid" id="storiesGrid">
    <div class="loading">در حال بارگذاری APACHI...</div>
  </div>

</main>

<div class="modal" id="storyModal">
  <div class="modal-content">

    <div class="modal-head" id="modalHead">
      <button class="close" onclick="closeStory()">×</button>
      <div id="modalCharacter"></div>
    </div>

    <div class="modal-body">

      <div id="modalCategory" class="badge"></div>
      <h2 id="modalTitle"></h2>

      <div class="story-text">
        <div id="storyScene" class="scene"></div>
        <div id="storyNarrative"></div>
      </div>

      <div id="choices" class="choices"></div>

      <div class="action-row">
        <button id="likeButton" onclick="toggleLike()">❤️ لایک</button>
        <span id="likeCount">۰ لایک</span>
      </div>

      <div class="comments">
        <h3>💬 نظرات ماجراجویان</h3>

        <input id="commentInput"
          maxlength="500"
          placeholder="نظر خودت را بنویس...">

        <button onclick="sendComment()">ارسال نظر</button>

        <div id="commentsList"></div>
      </div>

    </div>
  </div>
</div>

<footer>
  APACHI © 2026 — دنیای انتخاب‌های تو
</footer>

<script>
// =======================================
// SUPABASE CONFIGURATION
// =======================================

const SUPABASE_URL =
  "https://dqykeqtibspeajxdpsuk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4eLhQiDjFiWpTZn-P5w0dw_Q4xJgLLM";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const STORIES_TABLE = "apachi_stories_v2";
const LIKES_TABLE = "apachi_likes_v2";
const COMMENTS_TABLE = "apachi_comments_v2";

// =======================================
// VISITOR ID
// =======================================

function getVisitorId() {
  let id = localStorage.getItem("apachi_visitor");

  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("apachi_visitor",id);
  }

  return id;
}

const visitorId = getVisitorId();

// =======================================
// STATE
// =======================================

let stories = [];
let currentStory = null;
let activeCategory = "همه";
let currentScene = 0;
let storyChoices = [];

// =======================================
// HELPERS
// =======================================

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function scrollToStories() {
  document.getElementById("storiesSection")
    .scrollIntoView({behavior:"smooth"});
}

function closeStory() {
  document.getElementById("storyModal").classList.remove("show");
  currentStory = null;
}

document.getElementById("storyModal").addEventListener("click",e=>{
  if(e.target.id==="storyModal") closeStory();
});

// =======================================
// UNIQUE CHARACTER GENERATOR
// =======================================

function characterSVG(story) {
  const hash = [...story.slug].reduce(
    (a,c)=>a+c.charCodeAt(0),0
  );

  const hue = hash % 360;
  const skin = ["#d9a27d","#efbd9a","#bd815f","#e5ad85"][hash%4];
  const hair = ["#171522","#34211b","#17283c","#50352b"][hash%4];
  const jacket = `hsl(${hue},65%,48%)`;
  const hairStyle = hash%3;

  return `
  <svg class="story-character" viewBox="0 0 180 210"
       xmlns="http://www.w3.org/2000/svg">

    <defs>
      <linearGradient id="j${hash}" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="${jacket}"/>
        <stop offset="1" stop-color="#16172e"/>
      </linearGradient>
      <filter id="g${hash}">
        <feGaussianBlur stdDeviation="8"/>
      </filter>
    </defs>

    <ellipse cx="90" cy="192" rx="55" ry="9"
      fill="#000" opacity=".35"/>

    <circle cx="90" cy="88" r="58"
      fill="#fff" opacity=".09"
      filter="url(#g${hash})"/>

    <!-- BODY -->
    <path d="M34 207 Q35 135 65 130
      L90 145 L115 130
      Q145 135 146 207Z"
      fill="url(#j${hash})"
      stroke="#ffffff55" stroke-width="2"/>

    <!-- NECK -->
    <path d="M76 115 L75 143 Q90 157 105 143
      L104 115Z" fill="${skin}"/>

    <!-- FACE -->
    <ellipse cx="90" cy="87" rx="38" ry="46"
      fill="${skin}"/>

    <!-- EARS -->
    <ellipse cx="52" cy="91" rx="7" ry="11" fill="${skin}"/>
    <ellipse cx="128" cy="91" rx="7" ry="11" fill="${skin}"/>

    <!-- HAIR -->
    ${
      hairStyle===0
      ? `<path d="M51 83 Q42 28 89 31
         Q139 25 130 85
         L117 65 Q99 78 85 60
         Q69 82 51 83Z" fill="${hair}"/>`
      : hairStyle===1
      ? `<path d="M51 86 Q43 32 90 31
         Q135 31 129 87 L119 73
         Q100 80 90 66
         Q73 77 51 86Z" fill="${hair}"/>`
      : `<path d="M52 87 Q45 28 90 29
         Q139 28 130 87
         Q110 58 98 51
         Q80 73 52 87Z" fill="${hair}"/>`
    }

    <!-- EYES -->
    <ellipse cx="76" cy="90" rx="4" ry="5" fill="#171522"/>
    <ellipse cx="104" cy="90" rx="4" ry="5" fill="#171522"/>

    <path d="M81 111 Q90 118 99 111"
      fill="none" stroke="#824c43"
      stroke-width="2.5" stroke-linecap="round"/>

    <!-- JACKET DETAILS -->
    <path d="M90 145 L90 207"
      stroke="#ffffff65" stroke-width="2"/>

    <path d="M65 144 L78 164 L90 151 L102 164 L116 144"
      fill="none" stroke="#ffffff60" stroke-width="3"/>

    <circle cx="90" cy="173" r="5" fill="#fff" opacity=".7"/>

  </svg>`;
}

// =======================================
// UNIQUE LOGO
// =======================================

function storyLogo(story) {
  const hash = [...story.slug].reduce(
    (a,c)=>a+c.charCodeAt(0),0
  );

  const icons = ["⚡","🌌","🔥","💎","🚀","🌀","🌙","🐉","🔮","🛸"];

  return icons[hash % icons.length];
}

function storyColor(story) {
  return story.accent_color || "#00cfff";
}

function storyGlow(story) {
  return storyColor(story) + "88";
}

// =======================================
// LOAD STORIES
// =======================================

async function loadStories() {

  const {data,error} = await db
    .from(STORIES_TABLE)
    .select("*")
    .order("created_at",{ascending:false});

  if(error) {
    document.getElementById("storiesGrid").innerHTML =
      `<div class="empty">
        خطا در اتصال به دیتابیس:
        ${escapeHTML(error.message)}
      </div>`;
    return;
  }

  stories = data || [];

  await loadLikes();
  buildFilters();
  renderStories();
}

// =======================================
// LOAD LIKE COUNTS
// =======================================

let likeCounts = {};

async function loadLikes() {

  likeCounts = {};

  const {data,error} = await db
    .from(LIKES_TABLE)
    .select("story_id");

  if(error) {
    console.error(error);
    return;
  }

  (data || []).forEach(item=>{
    likeCounts[item.story_id] =
      (likeCounts[item.story_id] || 0) + 1;
  });
}

// =======================================
// FILTERS
// =======================================

function buildFilters() {

  const categories = [
    "همه",
    ...new Set(stories.map(s=>s.category))
  ];

  document.getElementById("filters").innerHTML =
    categories.map(category=>`
      <button
        class="filter ${category===activeCategory?'active':''}"
        onclick="setCategory('${escapeHTML(category)}')">
        ${escapeHTML(category)}
      </button>
    `).join("");
}

function setCategory(category) {
  activeCategory = category;
  buildFilters();
  renderStories();
}

// =======================================
// STORY CARDS
// =======================================

function makeCard(story) {

  const color = storyColor(story);
  const glow = storyGlow(story);
  const logo = storyLogo(story);

  return `
  <article class="card"
    style="--color:${color};--glow:${glow}"
    onclick="openStory('${story.id}')">

    <div class="card-cover">

      <div class="story-logo">${logo}</div>

      ${characterSVG(story)}

    </div>

    <div class="card-info">
      <h3>${escapeHTML(story.title)}</h3>

      <p>${escapeHTML(story.summary || "یک ماجراجویی تازه در APACHI منتظر توست.")}</p>

      <div class="meta">
        <span class="badge">${escapeHTML(story.category)}</span>
        <span>❤️ ${likeCounts[story.id] || 0}</span>
      </div>
    </div>

  </article>`;
}

function renderStories() {

  const query = document
    .getElementById("searchInput").value
    .trim()
    .toLowerCase();

  const filtered = stories.filter(story=>{
    const matchCategory =
      activeCategory==="همه" ||
      story.category===activeCategory;

    const matchSearch =
      story.title.toLowerCase().includes(query) ||
      (story.summary || "").toLowerCase().includes(query) ||
      story.category.toLowerCase().includes(query);

    return matchCategory && matchSearch;
  });

  document.getElementById("storiesGrid").innerHTML =
    filtered.length
    ? filtered.map(makeCard).join("")
    : `<div class="empty">داستانی پیدا نشد.</div>`;

  const popular = [...stories]
    .sort((a,b)=>
      (likeCounts[b.id]||0)-(likeCounts[a.id]||0)
    )
    .slice(0,4);

  document.getElementById("popularGrid").innerHTML =
    popular.length
    ? popular.map(makeCard).join("")
    : `<div class="empty">هنوز داستانی وجود ندارد.</div>`;
}

document.getElementById("searchInput")
  .addEventListener("input",renderStories);

// =======================================
// STORY EXPERIENCE
// =======================================

function openStory(id) {

  currentStory = stories.find(s=>s.id===id);

  if(!currentStory) return;

  currentScene = 0;
  storyChoices = [];

  const color = storyColor(currentStory);

  document.getElementById("modalHead").style
    .setProperty("--color",color);

  document.getElementById("modalHead").style
    .setProperty("--glow",storyGlow(currentStory));

  document.getElementById("modalCharacter").innerHTML =
    characterSVG(currentStory);

  document.getElementById("modalTitle").textContent =
    currentStory.title;

  document.getElementById("modalCategory").textContent =
    currentStory.category;

  document.getElementById("storyModal").classList.add("show");

  loadStoryLikes();
  loadComments();

  renderScene();
}

function renderScene() {

  const story = currentStory;

  const scenes = [
    {
      title:"فصل اول — شروع ماجرا",
      text:`هوا آرام است، اما اتفاق عجیبی در راه است.

${story.summary || "ماجرایی ناشناخته در انتظار توست."}

شخصیت اصلی داستان به اطراف نگاه می‌کند. صدای عجیبی از دور شنیده می‌شود.

او می‌گوید: «این اتفاق نمی‌تواند تصادفی باشد... باید بفهمم چه خبر است.»`,
      choices:[
        "به سمت صدای عجیب حرکت کن.",
        "اول محیط اطراف را بررسی کن.",
        "از یک دوست کمک بگیر."
      ]
    },
    {
      title:"فصل دوم — انتخاب سرنوشت‌ساز",
      text:`شخصیت داستان به یک مکان ناشناخته می‌رسد.

در مقابلش چند مسیر متفاوت وجود دارد.

او کمی فکر می‌کند و می‌گوید:
«هر تصمیمی بگیرم، ممکن است همه‌چیز تغییر کند.»`,
      choices:[
        "مسیر ناشناخته را انتخاب کن.",
        "دنبال نشانه‌های پنهان بگرد.",
        "با شخصیت مرموز صحبت کن."
      ]
    },
    {
      title:"فصل سوم — لحظه تصمیم",
      text:`حالا راز اصلی کم‌کم آشکار می‌شود.

شخصیت داستان متوجه می‌شود که تصمیم‌های قبلی او بی‌تأثیر نبوده‌اند.

او می‌گوید:
«وقتشه تصمیم نهایی رو بگیرم!»`,
      choices:[
        "راه شجاعانه را انتخاب کن.",
        "با هوش و برنامه‌ریزی جلو برو.",
        "به کمک دوستانت اعتماد کن."
      ]
    }
  ];

  const scene = scenes[Math.min(currentScene,2)];

  document.getElementById("storyScene").textContent =
    scene.title;

  document.getElementById("storyNarrative").textContent =
    scene.text;

  const choices = document.getElementById("choices");

  if(currentScene<3) {

    choices.innerHTML = scene.choices.map((choice,index)=>`
      <button class="choice"
        onclick="chooseStory(${index})">
        ${index+1}. ${choice}
      </button>
    `).join("");

  } else {

    const ending = [
      "پایان شجاعانه: شخصیت داستان با تصمیم جسورانه‌اش به یک قهرمان تبدیل شد.",
      "پایان هوشمندانه: شخصیت داستان با فکر و برنامه‌ریزی راز ماجرا را حل کرد.",
      "پایان دوستانه: شخصیت داستان با کمک همراهانش به موفقیت رسید."
    ];

    choices.innerHTML = `
      <h3>🏆 پایان ماجراجویی</h3>
      <p class="story-text">
        ${ending[storyChoices[2] || 0]}
      </p>
      <button class="choice" onclick="restartStory()">
        🔄 تجربه دوباره داستان
      </button>
    `;
  }
}

function chooseStory(index) {

  storyChoices[currentScene] = index;

  currentScene++;

  renderScene();
}

function restartStory() {
  currentScene = 0;
  storyChoices = [];
  renderScene();
}

// =======================================
// LIKES
// =======================================

async function loadStoryLikes() {

  if(!currentStory) return;

  const {data,error} = await db
    .from(LIKES_TABLE)
    .select("id,visitor_id")
    .eq("story_id",currentStory.id);

  if(error) {
    console.error(error);
    return;
  }

  const count = data.length;

  const liked = data.some(
    item=>item.visitor_id===visitorId
  );

  document.getElementById("likeCount").textContent =
    count + " لایک";

  document.getElementById("likeButton").classList
    .toggle("liked",liked);

  document.getElementById("likeButton").textContent =
    liked ? "❤️ لایک شده" : "🤍 لایک";
}

async function toggleLike() {

  if(!currentStory) return;

  const button = document.getElementById("likeButton");
  button.disabled = true;

  const {data,error} = await db
    .from(LIKES_TABLE)
    .select("id")
    .eq("story_id",currentStory.id)
    .eq("visitor_id",visitorId)
    .maybeSingle();

  if(error) {
    alert("خطا در بررسی لایک.");
    button.disabled = false;
    return;
  }

  if(data) {

    const result = await db
      .from(LIKES_TABLE)
      .delete()
      .eq("id",data.id);

    if(result.error) {
      alert("حذف لایک انجام نشد.");
    }

  } else {

    const result = await db
      .from(LIKES_TABLE)
      .insert({
        story_id:currentStory.id,
        visitor_id:visitorId
      });

    if(result.error) {
      alert("ثبت لایک انجام نشد.");
    }
  }

  await loadLikes();
  await loadStoryLikes();
  renderStories();

  button.disabled = false;
}

// =======================================
// COMMENTS
// =======================================

async function loadComments() {

  if(!currentStory) return;

  const {data,error} = await db
    .from(COMMENTS_TABLE)
    .select("id,comment,created_at")
    .eq("story_id",currentStory.id)
    .order("created_at",{ascending:false})
    .limit(50);

  if(error) {
    document.getElementById("commentsList").textContent =
      "دریافت نظرات ممکن نشد.";
    return;
  }

  const list = document.getElementById("commentsList");

  if(!data.length) {
    list.innerHTML = '<p class="scene">هنوز نظری ثبت نشده است.</p>';
    return;
  }

  list.innerHTML = data.map(item=>`
    <div class="comment">
      ${escapeHTML(item.comment)}
    </div>
  `).join("");
}

async function sendComment() {

  if(!currentStory) return;

  const input = document.getElementById("commentInput");
  const comment = input.value.trim();

  if(comment.length<2) {
    alert("نظر باید حداقل ۲ حرف داشته باشد.");
    return;
  }

  if(comment.length>500) {
    alert("نظر بیش از حد طولانی است.");
    return;
  }

  const button = document.querySelector(".comments button");
  button.disabled = true;

  const {error} = await db
    .from(COMMENTS_TABLE)
    .insert({
      story_id:currentStory.id,
      visitor_id:visitorId,
      comment:comment
    });

  button.disabled = false;

  if(error) {
    alert("ارسال نظر انجام نشد: "+error.message);
    return;
  }

  input.value = "";

  await loadComments();
}

// =======================================
// START
// =======================================

loadStories();

</script>
</body>
