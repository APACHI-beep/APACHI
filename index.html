<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مبین 💃🐱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Vazirmatn',Tahoma,sans-serif;cursor:pointer}

/* ---------- طبیعت ---------- */
.sky{
  position:fixed;inset:0;
  background:linear-gradient(180deg,#4FC3F7 0%,#81D4FA 35%,#B3E5FC 60%,#E1F5FE 78%);
}
.sun{
  position:fixed;top:5%;right:8%;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,#FFF59D,#FFD54F 60%,#FFB300);
  box-shadow:0 0 60px 18px rgba(255,213,79,.55);
  animation:sunPulse 4s infinite alternate ease-in-out;
}
@keyframes sunPulse{from{transform:scale(1)}to{transform:scale(1.09)}}

.cloud{
  position:fixed;left:0;width:120px;height:44px;background:#fff;border-radius:50px;
  opacity:.9;animation:drift linear infinite;
}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:62px;height:62px;left:14px;top:-30px}
.cloud::after{width:46px;height:46px;right:16px;top:-20px}
.c1{top:8%;animation-duration:38s}
.c2{top:20%;animation-duration:52s;animation-delay:-12s;transform:scale(.8)}
.c3{top:32%;animation-duration:45s;animation-delay:-25s;transform:scale(.6)}
@keyframes drift{from{transform:translateX(110vw)}to{transform:translateX(-40vw)}}

.hill{position:fixed;bottom:24%;border-radius:50% 50% 0 0;z-index:1}
.h1{left:-10vw;width:75vw;height:24vh;background:#9CCC65}
.h2{right:-15vw;width:85vw;height:20vh;background:#AED581}

.ground{
  position:fixed;bottom:0;left:0;width:100%;height:30%;z-index:2;
  background:linear-gradient(180deg,#7CB342,#33691E);
  border-radius:50% 50% 0 0/10% 10% 0 0;
}

.tree{position:fixed;bottom:26%;z-index:1;transform-origin:bottom center;animation:sway 3.5s infinite alternate ease-in-out}
.trunk{width:16px;height:70px;background:#6D4C41;margin:0 auto;border-radius:4px}
.leaves{width:100px;height:100px;position:absolute;bottom:56px;left:50%;transform:translateX(-50%);
  background:radial-gradient(circle at 35% 30%,#81C784,#2E7D32);border-radius:50%}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}

.flower{position:fixed;bottom:2%;font-size:34px;z-index:3;animation:sway 2.5s infinite alternate ease-in-out}
.butterfly{position:fixed;font-size:30px;z-index:4;animation:fly 7s infinite ease-in-out}
@keyframes fly{
  0%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(80px,-70px) rotate(15deg)}
  50%{transform:translate(160px,-20px) rotate(-10deg)}
  75%{transform:translate(60px,-110px) rotate(20deg)}
  100%{transform:translate(0,0) rotate(0)}
}

/* ---------- گربه ---------- */
.cat-stage{
  position:fixed;left:50%;bottom:11%;width:260px;height:300px;
  transform:translateX(-50%);z-index:10;
}
.shadow{
  position:absolute;bottom:-14px;left:50%;width:180px;height:28px;
  background:rgba(0,0,0,.2);border-radius:50%;filter:blur(5px);
  animation:shadowPulse .8s infinite alternate ease-in-out;
}
@keyframes shadowPulse{from{transform:translateX(-50%) scaleX(1)}to{transform:translateX(-50%) scaleX(.72)}}

.cat{
  position:relative;width:100%;height:100%;
  transform-origin:bottom center;
  animation:dance .8s infinite ease-in-out;
}
@keyframes dance{
  0%  {transform:translateY(0) rotate(-6deg)}
  25% {transform:translateY(-24px) rotate(0deg) scaleY(1.04)}
  50% {transform:translateY(0) rotate(6deg)}
  75% {transform:translateY(-24px) rotate(0deg) scaleY(1.04)}
  100%{transform:translateY(0) rotate(-6deg)}
}

.head{
  position:absolute;left:55px;top:15px;width:150px;height:125px;z-index:4;
  background:radial-gradient(circle at 35% 30%,#FFB74D,#F57C00);
  border-radius:50% 50% 46% 46%;
}
.ear{position:absolute;width:60px;height:60px;background:#F57C00;
  clip-path:polygon(50% 0%,0% 100%,100% 100%);top:-6px;z-index:3}
.ear::after{content:'';position:absolute;left:50%;top:13px;transform:translateX(-50%);
  width:30px;height:34px;background:#FF8A80;clip-path:polygon(50% 0%,0% 100%,100% 100%)}
.ear.left{left:60px;transform:rotate(-10deg)}
.ear.right{right:60px;transform:rotate(10deg)}

.eye{position:absolute;width:26px;height:30px;background:#2E1A0F;border-radius:50%;top:50px;
  animation:blink 3.2s infinite}
.eye.left{left:78px}
.eye.right{right:78px}
.eye::after{content:'';position:absolute;width:9px;height:9px;background:#fff;border-radius:50%;top:5px;left:5px}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}

.cheek{position:absolute;width:32px;height:20px;background:#FF8A80;opacity:.65;border-radius:50%;top:80px}
.cheek.left{left:52px}
.cheek.right{right:52px}

.nose{position:absolute;left:50%;transform:translateX(-50%);top:80px;width:18px;height:13px;
  background:#FF8A80;border-radius:50% 50% 50% 50%/30% 30% 70% 70%}

.mouth{position:absolute;left:50%;transform:translateX(-50%);top:96px;width:42px;height:16px;z-index:5}
.mouth::before,.mouth::after{content:'';position:absolute;width:21px;height:16px;
  border-bottom:3px solid #4E342E;border-radius:50%;bottom:0}
.mouth::before{left:0}
.mouth::after{right:0}

.whisker{position:absolute;width:46px;height:3px;background:#4E342E;border-radius:3px;opacity:.65;z-index:6}
.w1{left:10px;top:76px;transform:rotate(-9deg)}
.w2{left:6px;top:92px}
.w3{left:10px;top:108px;transform:rotate(9deg)}
.w4{right:10px;top:76px;transform:rotate(9deg)}
.w5{right:6px;top:92px}
.w6{right:10px;top:108px;transform:rotate(-9deg)}

.body{
  position:absolute;left:47px;top:125px;width:166px;height:135px;z-index:2;
  background:radial-gradient(circle at 40% 25%,#FFB74D,#EF6C00);
  border-radius:48% 48% 42% 42%;
}
.belly{position:absolute;left:50%;transform:translateX(-50%);top:155px;width:90px;height:95px;
  background:#FFE0B2;border-radius:50%;z-index:3;opacity:.92}

.arm{position:absolute;width:44px;height:90px;top:135px;z-index:1;
  background:linear-gradient(#FFB74D,#EF6C00);border-radius:45%;transform-origin:top center}
.arm.left{left:4px;animation:armL .5s infinite alternate ease-in-out}
.arm.right{right:4px;animation:armR .5s infinite alternate ease-in-out}
@keyframes armL{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
@keyframes armR{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}

.leg{position:absolute;width:50px;height:60px;bottom:0;z-index:1;
  background:linear-gradient(#FFB74D,#EF6C00);border-radius:45% 45% 40% 40%}
.leg.left{left:60px;animation:legL .5s infinite alternate ease-in-out}
.leg.right{right:60px;animation:legR .5s infinite alternate ease-in-out}
@keyframes legL{from{transform:rotate(-10deg) translateY(0)}to{transform:rotate(12deg) translateY(-8px)}}
@keyframes legR{from{transform:rotate(10deg) translateY(-8px)}to{transform:rotate(-12deg) translateY(0)}}

.tail{position:absolute;right:6px;top:158px;width:22px;height:115px;z-index:1;
  background:linear-gradient(#EF6C00,#FFB74D);border-radius:11px;
  transform-origin:bottom center;animation:tailWag .5s infinite alternate ease-in-out}
@keyframes tailWag{from{transform:rotate(-32deg)}to{transform:rotate(26deg)}}

/* ---------- نوشته‌ها ---------- */
.name{
  position:absolute;top:-105px;left:50%;z-index:20;
  font-size:clamp(3.2rem,13vw,7rem);font-weight:900;color:#fff;line-height:1;
  text-shadow:0 0 8px #fff,0 0 22px #ff0,0 0 42px #f0f,0 0 70px #0ff,4px 5px 0 #ff4081;
  animation:nameBounce .6s infinite alternate ease-in-out;
  white-space:nowrap;
}
@keyframes nameBounce{
  from{transform:translateX(-50%) translateY(0) rotate(-4deg) scale(1)}
  to{transform:translateX(-50%) translateY(-16px) rotate(4deg) scale(1.09)}
}

.silent-badge{
  position:absolute;top:-142px;left:50%;transform:translateX(-50%);
  background:#111;color:#fff;font-weight:900;font-size:1rem;
  padding:6px 18px;border-radius:30px;white-space:nowrap;z-index:20;
  box-shadow:0 0 0 3px #fff,0 6px 18px rgba(0,0,0,.35);
  animation:badgePulse 1.2s infinite alternate ease-in-out;
}
@keyframes badgePulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.08)}}

.caption{
  position:fixed;bottom:2.5%;left:50%;transform:translateX(-50%);z-index:30;
  max-width:92vw;text-align:center;
  font-size:clamp(.95rem,3.4vw,1.5rem);font-weight:900;color:#fff;
  background:rgba(0,0,0,.3);padding:10px 24px;border-radius:40px;
  backdrop-filter:blur(6px);text-shadow:0 2px 8px rgba(0,0,0,.6);
  transition:opacity .3s;
}

/* ---------- افکت کلیک ---------- */
.pop{position:fixed;font-size:30px;pointer-events:none;z-index:99;
  animation:popUp 1.2s ease-out forwards}
@keyframes popUp{
  from{transform:translate(-50%,-50%) scale(.3);opacity:1}
  to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.5) rotate(200deg);opacity:0}
}

@media (max-width:600px){
  .cat-stage{transform:translateX(-50%) scale(.72);transform-origin:bottom center}
  .sun{width:80px;height:80px}
}
</style>
</head>
<body>

<div class="sky"></div>
<div class="sun"></div>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>

<div class="hill h1"></div>
<div class="hill h2"></div>

<div class="tree" style="left:6%;"><div class="trunk"></div><div class="leaves"></div></div>
<div class="tree" style="right:8%;transform:scale(.8);animation-delay:-1s"><div class="trunk"></div><div class="leaves"></div></div>

<div class="ground"></div>

<div class="flower" style="left:12%">🌻</div>
<div class="flower" style="left:28%;animation-delay:-.7s">🌼</div>
<div class="flower" style="right:15%">🌷</div>
<div class="flower" style="right:30%;animation-delay:-1.2s">🌺</div>

<div class="butterfly" style="left:15%;top:45%">🦋</div>
<div class="butterfly" style="right:18%;top:38%;animation-delay:-3s">🦋</div>

<!-- ===== گربه ===== -->
<div class="cat-stage">
  <div class="silent-badge">🔇 بدون صدا</div>
  <div class="name">مبین</div>
  <div class="shadow"></div>

  <div class="cat">
    <div class="tail"></div>
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>

    <div class="ear left"></div>
    <div class="ear right"></div>

    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="cheek left"></div>
      <div class="cheek right"></div>
      <div class="nose"></div>
      <div class="mouth"></div>
      <div class="whisker w1"></div>
      <div class="whisker w2"></div>
      <div class="whisker w3"></div>
      <div class="whisker w4"></div>
      <div class="whisker w5"></div>
      <div class="whisker w6"></div>
    </div>

    <div class="body"></div>
    <div class="belly"></div>
  </div>
</div>

<div class="caption" id="caption">مبین داره می‌رقصه... ولی موزیک قطع شده 😂</div>

<script>
/* ---- جمله‌های خنده‌دار که خودکار عوض می‌شن ---- */
const captions = [
  "مبین داره می‌رقصه... ولی موزیک قطع شده 😂",
  "کسی به مبین نگفته صدا نداره 🤣",
  "رقص بی‌صدا، حال بی‌نهایت 🕺",
  "مبین! موزیکو وصل کن دیگه! 🔇",
  "گربه‌ها هم می‌رقصن، باور کن 🐱",
  "این رقص تا ابد ادامه داره... 😵‍💫",
  "مبین فکر می‌کنه موزیک پخشه 🎧",
  "دنیا بدون موزیک هم می‌رقصه 💃",
  "هیشکی نمی‌دونه مبین چرا می‌رقصه 🤔",
  "مبین: موزیک؟ چه موزیکی؟ 😎"
];
const capEl = document.getElementById('caption');
let idx = 0;
setInterval(() => {
  idx = (idx + 1) % captions.length;
  capEl.style.opacity = 0;
  setTimeout(() => {
    capEl.textContent = captions[idx];
    capEl.style.opacity = 1;
  }, 300);
}, 3200);

/* ---- ترکوندن ایموجی با کلیک ---- */
const emojis = ['🎵','🎶','✨','💫','🤣','🐾','💃','🌟','🐟','😂'];
document.addEventListener('click', e => {
  for (let i = 0; i < 9; i++) {
    const s = document.createElement('span');
    s.className = 'pop';
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = e.clientX + 'px';
    s.style.top  = e.clientY + 'px';
    s.style.setProperty('--dx', (Math.random() * 360 - 180) + 'px');
    s.style.setProperty('--dy', (-Math.random() * 280 - 60) + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1300);
  }
});
</script>
</body>
</html>
